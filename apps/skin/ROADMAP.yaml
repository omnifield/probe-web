# Дорожная карта @web-core/skin-app — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/store (categories → items, log → журнал решений); без milestones — у приложения
# нет освоенной поставки с датами релиза, только сделанное и открытое.

categories:
  - category: Структура каталогов
    items:
      - id: index-as-public-api
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: index.ts/tsx — единственный публичный вход папки
        description: |
          Означает: файл вида `папка/папка.tsx` (дублирующее имя) переименован в `папка/index.tsx`
          везде, где встретился (header, tree, preview, input, renderer, slot, app). Агрегирующие
          папки без единственного файла (model, ui, верх слайса entities/component,
          entities/showcase, widgets/component) получили тонкий index.ts-barrel — снаружи ходят
          только в него, не глубже.

      - id: index-stays-thin
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: index держит только реэкспорт, не логику
        description: |
          Означает: entities/component/utils/fake-generator разнесён на index.ts (один реэкспорт),
          generate.ts (сама функция), text.ts (приватные хелперы текста), hints.ts (таблица
          подсказок, тоже не публичная). Разбор — FAQ.md.

  - category: Импорты
    items:
      - id: no-file-extensions
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Расширения убраны из всех импортов
        description: |
          Означает: ни настоящих (.ts/.tsx), ни поддельных под скомпилированный вывод (.js/.jsx) —
          бандлер (Vite, moduleResolution bundler) в них не нуждается.

      - id: hash-imports-need-tsconfig-paths
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "package.json#imports (алиас #/*) не резолвится без расширения даже под bundler"
        description: |
          Означает: TypeScript 7.0.2 даёт мягкое резолвление bundler-режима (без расширения, с
          авто-index папки) только относительным путям и tsconfig.paths — не package.json#imports,
          тот остаётся строгим по спецификации Node ESM независимо от moduleResolution. Починено
          зеркальным compilerOptions.paths в apps/skin/tsconfig.json, локально для этого
          приложения. Разбор — FAQ.md.

  - category: Фейк-генератор (удалён)
    items:
      - id: schema-only-generator
        type: feature
        status: Removed
        priority: Medium
        milestone: null
        name: generateFakeData принимает io-схему, не компонент целиком
        description: |
          Было сделано так (движок один и общий — zocker, читает зод-теги прямо из схемы; второй
          параметр component — только ключ таблицы подсказок). Выпилено целиком решением user —
          см. `zocker-removed` в категории "Наполнение данными показа": наполнение теперь только
          из presets, зодер как источник данных показа больше не существует в этом приложении.

      - id: hints-per-field
        type: feature
        status: Removed
        priority: Medium
        milestone: null
        name: Таблица подсказок длины текста (component → field → length)
        description: |
          Было сделано так (supply() по ссылке на схему конкретного поля, не override() по типу).
          Выпилено вместе со всем `fake-generator/` — см. `zocker-removed`.

  - category: Документация
    items:
      - id: readme-app-template
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: README по общему шаблону — первый пилот genus "app"
        description: |
          Означает: Анатомия — таблица маршрутов (адрес = URL, не импорт-спецификатор, у
          приложения нет импортируемой поверхности); Использование — команды и адреса вместо
          кода-потребителя; Настройки — переменные окружения Vite и флаги dev-сервера; Состояния —
          статус componentInfoAtom (ResourceState); IO — параметры маршрута и адрес службы на
          входе, реальный рендер и фейковые данные на выходе; Рецепт — таблица подсказок
          фейк-генератора как съёмный слой снаружи io-схемы. genus "app" — новый, эталон для
          будущих apps/*.

      - id: faq-roadmap
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: FAQ.md и ROADMAP.yaml — первое заполнение
        description: |
          Означает: FAQ.md сгруппирован по темам (структура каталогов / импорты / фейк-генератор /
          тесты), каждый ответ со ссылкой на проверку. ROADMAP.yaml — по образцу packages/store
          (Done-пункты сразу с описанием, log — датированный журнал решений).

  - category: Наполнение данными показа
    items:
      - id: zocker-removed
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Фейк-генератор (zocker) выпилен — единственный источник данных теперь presets"
        description: |
          Означает: `entities/component/utils/fake-generator/` (generate.ts/hints.ts/payload.ts/
          text.ts) и неиспользуемый враппер `shared/utils/zocker/` удалены целиком, `zocker` убран
          из `package.json` и лок-файла этого приложения (в `apps/skin/.mcp` остаётся — отдельный
          пакет, отдельная зависимость, не трогали). `componentHandle.generate()` и его вызовы
          (кнопка "GENERATE FAKE DATA" в `Input`, fallback в `pages/embed/index.tsx` без
          `?content=`) убраны — компонент без сохранённого content теперь остаётся без данных
          (`embed`) или получает мок-строку (витрина, см. `input-content-select` ниже), не
          выдуманный зодером объект. Решение user: наполнение — только из наших пресетов.

      - id: input-content-select
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Input — выбор сохранённого content, дефолт на пункт 0, реакция на смену компонента"
        description: |
          Означает: `widgets/component/input` — контролируемый `Select` (`value={selected()}`, не
          отдан на откуп внутреннему стейту Ark) поверх `listContentFor(component)`. Эффект на
          `items()` сам выставляет пункт `0` и грузит его `state.data` через `component.setData`
          при каждой смене списка — в т.ч. при переключении компонента в дереве (баг: раньше
          подпись на триггере оставалась от предыдущего компонента, Select не реагировал). Список
          пуст → выбор сброшен, данные — литерал `"-мок-"`, не пустота и не зодер.

  - category: Чат
    items:
      - id: chat-ui-split
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "entities/chat/ui/chat — разбит на control/ и content/"
        description: |
          Означает: `control/index.tsx` — форма (инпут+кнопка отправки, весь стейт `text`/
          `onSubmit`); `content/item.tsx` — одно сообщение (аватар+бабл, свой/чужой); `content/
          container.tsx` — скролл-область и `For` по `messages()`. `chat/index.tsx` — тонкая
          сборка `ChatContent`+`ChatControl` внутри `Flow`, без своей логики. По ходу (решение
          user): имя автора и время сообщения убраны из `ChatItem` — остался только текст и
          аватар для выравнивания.

      - id: chat-real-backend
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Чат шлёт сообщения в реальную сессию агента, не в локальный мок"
        description: |
          Означает: новый `entities/chat/model/api.ts`'s `sendChatMessage(text)` —
          `POST {VITE_CHAT_URL}/sessions/{component}/messages` (дефолт URL —
          `https://150.251.145.87/api`), `Authorization: Bearer {VITE_CHAT_TOKEN}` (билд-тайм env,
          общий на всю витрину), `X-User-Login: {currentUser()}` (`entities/user`), тело
          `{text, context: {component}}`. Session id = имя ТЕКУЩЕГО компонента
          (`currentComponent`, `entities/component`) — по словам user, у агента чат хранится
          per-session, и сессия должна быть в рамках компонента; нет выбранного компонента → явный
          отказ, не запрос в никуда. Ответ — один синхронный JSON (`event: "run-finished"`), без
          стрима/поллинга.

          `store.ts`'s `sendMessage` пишет сообщение юзера в историю сразу (оптимистично), потом
          ждёт ответ и дописывает `reply` (или `refusal`, если он есть — тоже полноценный ответ
          агента, тем же путём). Сетевая ошибка/отказ службы тоже оседает в чат текстом, не
          проглатывается. Новый сигнал `pending` — `ChatControl` дизейблит форму на время запроса
          (сессия синхронная, второе сообщение до ответа на первое не имеет смысла). Моковая
          затравка (`MOCK_MESSAGES`, три сообщения "Ева"/"Архитектор") убрана — история теперь
          только из реальной переписки.

          Сознательно не сделано (не было источника во фронте на момент разговора): `variant`/
          `outfit` в `context` — их пока нигде не выбирают, context несёт только `component`;
          загрузка истории чата при заходе на компонент — эндпоинт на это не называли, `messages`
          стартует пустым; рендер `did` (списка вызовов MCP-тулов из ответа) — в UI сейчас виден
          только `reply`/`refusal`, `did` из ответа не читается вовсе.

  - category: Embed-маршруты
    items:
      - id: embed-routes-for-agent-playground
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Embed-маршруты — изолированный playground для агента, не живая витрина юзера"
        description: |
          Цепь: `apps/skin/.mcp` (MCP-сервер) уже даёт внешнему агенту headless-браузер со своей
          вкладкой на сессию (`browser_navigate`/`browser_snapshot`/`browser_click`/
          `browser_screenshot`) — изоляция ПРОЦЕССА/вкладки решена. Но `browser_navigate` ходил на
          живые маршруты витрины (`/showcase/...`), а там хедер/чат/сайдбар и прочий UI, не
          относящийся к делу. Кейс "агент работает со сборками" — по словам user, "не частый кейс,
          но не одноразовый" — этому шум прямо мешал.

          User дословно: "я не хочу чтобы агент читал саму витрину, в которой работает юзер, так
          как там много шума. поэтому нам для скина нужно поднять свой [плейграунд]. или как
          вариант сделать отдельные маршруты embed что бы агент мог брать изолированно".

          Решение (обсуждено и принято) — ВТОРОЙ вариант, не отдельное приложение:
          - Отдельный процесс/приложение дублировал бы рендер-механику, которая уже есть и работает
            в этой витрине (`Renderer`/`instanceOf`, подключение скина, `componentDataAtom`) — риск
            разъехаться с оригиналом, лишняя инфраструктура на поддержку.
          - Изоляция ПРОЦЕССА не нужна повторно — она уже дана MCP-браузером (своя вкладка на
            сессию, агент физически не пересекается с вкладкой живого юзера). Нужна изоляция
            DOM/визуального шума, не вторая инфраструктура — для этого достаточно маршрута БЕЗ
            хрома приложения в ТОМ ЖЕ бандле.
          - Тот же приём у Storybook (canvas в отдельном iframe того же приложения, не второй
            сервер) и Ladle/Histoire.

          Сделано: новый маршрут `/embed/$component/$assembly` (`routes/embed.$component.$assembly.tsx`
          + `pages/embed/index.tsx`) рендерит ТОЛЬКО `<Renderer>` — без `Header`/чата/сайдбара.
          Чтобы дать ему путь мимо хрома, хром (`WorkspaceLayout`) переехал из `__root.tsx` в
          отдельный pathless layout `_workspace.tsx` (`createFileRoute("/_workspace")`) — все
          прежние маршруты (`/`, `/lab`, `/playground`, `/showcase/...`) стали его детьми
          (файлы переименованы с префиксом `_workspace.`, URL не изменились), `/embed/...` остался
          сиротой прямо под корнем и хром не наследует. Источник данных — `?content=<name>` (новая
          `getContentByName` в `entities/component/model/content.ts`, читает ту же службу пресетов,
          что и `get_content` в `apps/skin/.mcp`), без параметра или если имя не найдено —
          существующий fallback (`generateFakeData`). Проверено вручную (dev-сервер + MCP-браузер):
          `/embed/button/base` — фейковые данные; `/embed/button/base?content=button-save` —
          сохранённый content; `/showcase/button` — хром не сломан.

          Дальше по цепи (не в этом файле): `apps/skin/.mcp`'s `browser_navigate`/доки (`docs/*.md`)
          должны научиться указывать на `/embed/...` для кейса сборок вместо `/showcase/...` — это
          отдельный, более мелкий заход со стороны MCP.
      - id: input-widget-real-ui
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: Input — редактирование отдельных полей данных, не только выбор целого набора
        description: |
          Означает: выбор ГОТОВОГО набора данных (сохранённый content, дефолт на пункт 0) уже
          сделан — см. `input-content-select`. Не сделано — редактирование ОТДЕЛЬНЫХ полей
          выбранного набора (форма по io-схеме компонента, поле за полем); сейчас единица
          изменения — весь набор целиком, точечная правка одного поля невозможна без ухода в
          службу пресетов напрямую.

      - id: array-count-hints
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: Подсказки количества/контента для полей-массивов
        description: |
          Означает: для компонентов со списками (меню, аккордеон) — не просто заменить N пунктов
          на аналоги, а сгенерить и разное количество, и разный контент. Тем же приёмом (supply по
          ссылке на .element-схему массива + подсказка на количество), но отдельным заходом, когда
          дойдём до конкретного такого компонента.

      - id: lab-page-purpose
        type: feature
        status: Backlog
        priority: Low
        milestone: null
        name: "/lab — назначение экрана не объявлено"
        description: |
          Означает: маршрут жив ("Лаборатория (мок)"), что там будет показано — не решено.

      - id: no-tests
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: Нет ни одного теста
        description: |
          Означает: vitest.config.ts настроен, test/ — пустая папка. Композиции, описанные в
          README как "Сборки", проверены только вручную через dev-сервер и браузер, не
          автоматическим прогоном.

log:
  - id: fsd-index-barrels
    type: plan
    date: 2026-09-05
    summary: >
      Переезд widgets/entities на структуру, где каждая папка — модуль с ОДНИМ публичным входом.
      Файлы вида `папка/папка.tsx` (header, tree, preview, input, renderer, slot, app)
      переименованы в `папка/index.tsx`. Агрегирующие папки без единственного файла (model, ui,
      entities/component, entities/showcase, widgets/component) получили тонкий index.ts-barrel,
      реэкспортирующий только используемое снаружи. Снаружи теперь ходят в корень слайса
      (#/entities/component), не глубже (не #/entities/component/model/store).

  - id: extensions-and-hash-imports-finding
    type: plan
    date: 2026-09-05
    summary: >
      Расширения убраны из всех импортов (относительных и алиаса #/*). При проверке обнаружено:
      moduleResolution "bundler" даёт мягкое резолвление (без расширения, с авто-index папки)
      только относительным путям и tsconfig.paths — package.json#imports остаётся строгим по
      Node ESM независимо от bundler-режима (проверено эмпирически тремя прогонами tsc с одним и
      тем же импортом: без расширения — падает, с явным /index без расширения — падает, с явным
      /index.tsx — резолвится). Починено зеркальным compilerOptions.paths в apps/skin/tsconfig.json,
      общий @web-core/build/tsconfig не тронут.

  - id: fake-generator-v1-schema-and-hints
    type: plan
    date: 2026-09-06
    summary: >
      Первая версия generateFakeData принимала имя компонента и сама тянула io-схему — по
      результату разговора переделано: генератор принимает схему напрямую, компонент — только
      ключ подсказок. zocker остаётся единственным и общим движком (зод-теги — email/телефон/имя
      и т.д. читает сам). Для полей без зод-тегов (обычный z.string(), например label кнопки, для
      которого нужна конкретная длина, а не случайный текст любой длины) заведена точечная таблица
      подсказок (hints.ts) — применяется через supply() по ссылке на схему конкретного поля, не
      override() по типу, чтобы не задеть остальные строковые поля. Пока одна запись — button.label
      = 10, тест самой механики, не полный охват кита. Подсказки на количество для полей-массивов
      (меню, аккордеон) — тем же приёмом, но отдельным заходом (см. категорию "Не сделано").

  - id: readme-app-template-first-pilot
    type: plan
    date: 2026-09-06
    summary: >
      apps/skin — первое приложение, заполнившее общий шаблон README ("Главное → Анатомия →
      Использование → Настройки → Состояния → IO → Сборки → Рецепт"), заведённый user поверх
      шаблонов "component" (packages/ui) и "engine" (packages/store, первый пилот). genus "app" —
      новый, устоявшейся группы/таксономии для apps/* ещё не было — выбрано "витрина" по смыслу
      этого конкретного приложения, не факт, что подойдёт будущим apps/* без вопроса. Наблюдения по
      адаптации шаблона: "Анатомия" у приложения без импортируемой поверхности — за "адрес" части
      взят URL маршрута, а не импорт-спецификатор (как у движка) и не CSS-селектор (как у
      компонента); "Использование" показывает команды/адреса вместо кода-потребителя — приложение
      никто не импортирует; "Сборки" честно помечены как проверенные только вручную — тестов пока
      нет вообще (см. категорию "Не сделано").

  - id: embed-routes-pathless-layout
    type: plan
    date: 2026-09-08
    summary: >
      Добавлен `/embed/$component/$assembly` для MCP-браузера агента — без хрома витрины. Корень
      дерева маршрутов (`__root.tsx`) раньше монтировал `WorkspaceLayout` безусловно вокруг
      `Outlet`, поэтому любой дочерний маршрут наследовал хром — потребовался pathless layout
      (`_workspace.tsx`, `createFileRoute("/_workspace")`, приём документирован в README
      `@web-core/router` как `_auth.tsx`), в который переехал `WorkspaceLayout`, а шесть прежних
      файлов маршрутов переименованы с префиксом `_workspace.` (URL не изменились, `routeTree.gen.ts`
      подтверждает — `/embed/...` висит сиротой прямо под корнем). Источник данных — новая
      `getContentByName` (`entities/component/model/content.ts`), тонкая обёртка над уже
      существующим `PresetsClient.get`, ранее не вызывавшимся с фронта (только `list`+фильтр).
      Находка по пути: уже запущенный (до этой сессии) dev-сервер закэшировал битую промежуточную
