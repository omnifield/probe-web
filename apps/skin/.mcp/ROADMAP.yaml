          componentDataAtom) получает способ подставить сохранённый content компонента ВМЕСТО
          собственного generateFakeData — тем же путём, каким витрина уже читает tag/palette/form
          напрямую из backend/presets, минуя MCP (см. FAQ.md — «Побочная находка про packages/io» и
          более ранний разбор про tags). Не сделано: сначала должно накопиться содержимое
          (content-записи для реально стилизуемых сейчас компонентов), UI-переключатель
