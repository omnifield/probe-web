# harness.yaml — per-product СИД роль-модели (обвес агент-харнесса).
#
# Кладётся записью раскладки → .omnifield/harness.yaml, класс `placed-once`: станок кладёт файл
# один раз и дальше НЕ трогает — им владеет человек, заполняет под свой продукт. Рамка
# (инварианты ролей) впаяна в roles/*.md + shared-policy.md,
# а здесь — ДАННЫЕ роль-модели под конкретный продукт (kb:BRAIN2-12).
#
# ⚠️ Значения ниже — НЕЙТРАЛЬНЫЙ ШАБЛОН (my-product / backend / frontend). Замени на своё.
#
# ⚠️ ПИЛОТ. Раскладка полей этого файла ещё не устоялась: состав будет меняться, переезд
# плановый и объявленный (в частности, разделение должности и полномочий изменит секции
# `zones` и `git`). Файл твой — станок его не перезаписывает, — но при обновлении обвеса
# сверяйся с сидом новой версии: там появятся поля, которых здесь ещё нет.
apiVersion: omnifield.dev/v1
kind: harness

# Имя продукта — идёт в identity-баннер каждой сессии ("architect/main продукта <product>").
# ЗАМЕНИ на своё. Если убрать/оставить пустым — баннер прямо попросит вписать.
product: probe-web

# Число архитекторов (main-сессий). Канон-дефолт — 3 (продукт/фронт/бэк); мелкий продукт — 1.
architects: 1

# Пины моделей по роли (провайдер claude-code; agent-as-provider — расширяемо провайдером).
# Дефолт-пресет: architect и owner — сильнейшая (opus-5), layer — haiku (узкий одноартефактный
# промпт). Эти же значения применяются, если секцию убрать. Переопредели под свой продукт.
#
# Берём АЛИАСЫ, а не снапшоты с датой (`claude-haiku-4-5`, не `claude-haiku-4-5-20251001`):
# алиас едет за выпусками сам, снапшот замораживает сессии на конкретной сборке и требует
# ручного обновления в каждом репозитории.
models:
  architect: claude-opus-5
  owner: claude-opus-5
  layer: claude-haiku-4-5

# Зоны продукта: scope (leaf-имя) → paths[] + краткое назначение. scope=main → architect.
# owner-<zone> владеет папками целиком (commit-only под git-gate). paths[] — МАССИВ: один
# owner может держать несколько папок; пути РАЗНЫХ зон не пересекаются (одна папка — один
# владелец, disjoint). ЗАМЕНИ на реальные папки. (legacy одиночный `path:` тоже читается.)
# Засеянная догадка baser заменена 2026-08-08 architect'ом этой локации.
# Действующая раскладка и границы зон — контракт kb:PROBEWEB-4.
zones:
  style:
    paths: [packages/style, packages/style-tools]
    description: >-
      две папки у одного владельца НА ВРЕМЯ РАЗРЕЗА (PWEB-3): `style` — набор значений
      (шкалы, размерности, роли), `style-tools` — инструменты стилизации, которые из него
      выделяются. Шов между ними режется прямо сейчас, и пока он режется, обе стороны обязаны
      быть у одного владельца: разделённое владение посреди разреза — это ровно тот случай,
      когда один чинит и ломает у другого. Разделить зоны можно будет после того, как разрез
      закончен и граница перестала двигаться.
  ui:
    paths: [packages/ui]
    description: примитивы на kobalte — 1-to-1 DOM, ноль стилей по умолчанию, свои обработчики насквозь
  runtime:
    paths: [packages/runtime]
    description: mount() и контракт #root — то, что зовёт скелет у потребителя

  skin-mech:
    paths: [packages/skin, packages/skin-reference]
    description: >-
      МЕХАНИКА скина — модель, сборка рецепта по частям, адресация из анатомии, порождение
      CSS. Механика это фреймворк; ОДЕЖДА остаётся продуктом (`products/skin`), и поставка
      той зоны по-прежнему только CSS, ни одного модуля кода. Тот же разрез, что между
      набором значений и инструментами: предмет разный — дом разный.
      Рядом — `packages/skin-reference`, ЭТАЛОННЫЙ скин фреймворка: отдельная поставка,
      потому что механика не знает ни одного скина, а отдельный пакет делает получение
      эталона согласием, а не умолчанием. Зависимость односторонняя: эталон знает механику,
      механика о нём — нет. Один овнер у обоих: предмет соседний, компетенция та же.

  assembly:
    paths: [packages/assembly]
    description: >-
      механика сборки — дерево узлов, реестр из паспортов, правки дерева, проверка
      вложенности, отрисовка по данным. Одна на редактор скинов и конструктор страниц:
      различие в охвате дерева, а не в устройстве. Средство, а не решение — своего вида
      не приносит.
  build:
    paths: [packages/build]
    description: оснастка сборки — подпути /vite, /tsconfig, /vitest
  lint:
    paths: [packages/lint]
    description: пресет eslint-plugin-solid — канон Solid, выраженный машиной
  starter:
    paths: [packages/starter]
    description: npm-обвес @omnifield/probe-web — шаблоны скелета, который baser кладёт в web/
  reference:
    paths: [apps/reference]
    description: эталонное приложение — гейт сборки всей цепочки, а не витрина

  # Зоны products/ стоят здесь ВРЕМЕННО и уедут отдельными продуктами; условие выезда и
  # запрет на публикацию — контракт kb:PROBEWEB-5. В packages/ им нельзя: там база.
  tables:
    paths: [products/tables]
    description: таблицы, headless как и кит; фильтры — модуль внутри со своей границей
  studio:
    paths: [products/studio, canons/studio]
    description: витрина первой волны — что умеет производство; плагинная модель позже

  presets:
    paths: [products/presets]
    description: хранилище пресетов — кладёт и отдаёт JSON, формата фильтра НЕ понимает (kb:PROBEWEB-8)

  map:
    paths: [products/map, canons/map]
    description: карта — 3D-рельеф и города на MapLibre, тайлы файлом без сервера (kb:PROBEWEB-10)

  skin:
    paths: [products/skin, canons/ui-skin]
    description: производство оформлений для безголового кита — своя логика, кит остаётся голым (kb:PROBEWEB-11)

  chat:
    paths: [products/chat, canons/chat]
    description: чат — каркас фонда уже стоит (canons/chat), предмет обсуждает user с овнером

# Git-доступ по роли — РАМКА (инвариант shared-policy), приведён для наглядности,
# выключить нельзя: architect=full; owner=commit-only (gate); layer=none.
git:
  architect: full
  owner: commit-only
  layer: none

# Слот grabli (BRAIN2-7): tasker-ws, куда агенты пишут затыки/грабли ПОСЛЕ обсуждения с user
# (класс проблемы = родитель, конкретные случаи = дети). При накоплении — правим шаблоны/пресеты.
# Дефолт — центральный беклог под контролем architect; ЗАМЕНИ/убери под свой продукт.
grabli:
  workspace: GRABLI2

# Слот services (BRAIN2-9): базы omnifield-сервисов. Доступ — CURL (Bash), НЕ MCP-инструменты
# (их может не быть — норма). Адрес ЗАВИСИТ ОТ ОКРУЖЕНИЯ, подставь рабочий:
#   • сосед по docker-сети (product-devbox):  http://tasker:8030/tasker · http://knowledger:8040/knowledger
#   • если соседи недоступны — дверь через хост: http://host.docker.internal:8080/api/tasker · .../api/knowledger
#   • localhost:8080 — ТОЛЬКО с хост-машины, НЕ изнутри контейнера.
# Проверка связи: `curl -s <base>/healthz`. Сэндбокс Bash режет сеть → выполняй с сэндбоксом off.
#
# 2026-08-19, снова из офиса: живая дверь — `10.8.1.3:8080`. Домашние соседи по docker-сети
# отсюда не резолвятся вовсе, `host.docker.internal:8080` отдаёт 502. Отдельно: САМ адрес двери
# сменился — прежняя офисная запись `10.8.1.1` тоже отвечает 502, так что вчерашний адрес брать
# нельзя, его надо перепроверять. Контейнер здесь `172.23.0.2` (дома был `172.19.0.x`).
# Проверено `healthz` = 200 на обоих сервисах перед этой правкой.
services:
  windshift_mcp: http://10.8.1.3:8095/mcp # ← агенты сюда
  windshift: http://10.8.1.3:8095/rest/api/v1 # людям и отладке; агенту — только с оговоркой вслух
  tasker: http://10.8.1.3:8080/api/tasker
  knowledger: http://10.8.1.3:8080/api/knowledger
  # площадка product-devbox (соседи по docker-сети) — из офиса не резолвятся:
  # tasker: http://tasker:8030/tasker
  # knowledger: http://knowledger:8040/knowledger

# Слот pilots (BRAIN2-59): раздел пилотов — общая площадка продуктов, где механика обсуждается
# и обкатывается ДО того, как попадёт в каталог канонов (`kb:MECH`). Знание о мехе — в
# knowledger, работа и ступень (`пилот → обкатка → канон`) — в tasker; ссылка друг на друга
# обязательна. Правила раздела целиком — `kb:PILOT-1`. Убери секцию — правило молчит.
pilots:
  tasker: PILOT
  knowledger: PILOT

# Слот checkpoints (BRAIN2-58): корень чекпойнтов РОЛЕЙ — состояние прогона (где мы, что не
# доделано, что делать первым), чтобы рестарт/переезд контейнера не стоил сессии. Узел на роль,
# а не на сессию: адрес стабилен, описание = текущее состояние, комменты = история.
# Адрес несёт `root` (ключ узла-корня); `workspace` — где его искать.
#
# Раздел заведён 2026-08-08 по запросу user: корень — `tasker:PROBEWEB-15` (МАРШРУТ),
# узел на роль — его дети (`PROBEWEB-16` = architect/main). Форма записи и правила ведения
# описаны в самом корне; рамка — shared-policy.
checkpoints:
  workspace: PROBEWEB
  root: PROBEWEB-15
