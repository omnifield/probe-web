log:
  - id: api-shape-rework-decided
    type: plan
    date: 2026-09-08
    summary: >
      User измерил реальные ответы на поднятом сервере и назвал происходящее прямо: одна ручка
      отдаёт половину репозитория, файл на 500 строк, это не соответствует тому, чем МСИПИ стал
      (полноценный сервис на пике популярности, не утилита). Решено не чинить точечно, а сперва
      сверить план с источниками: спека MCP, Anthropic «Writing effective tools for agents», реальный
      исходник chrome-devtools-mcp (не по памяти). Первый предложенный вариант (get_passport с
      флагом response_format:concise/detailed) user отклонил метко: «паспорт» не должен решать,
      входит ли в него сборка или анатомия — это разные сущности, а не разная подробность одной.
      Также рассмотрен и отклонён GraphQL — несоразмерно задаче (фиксированный маленький набор
      граней компонента, не глубокий произвольный граф; модели пришлось бы писать текст запроса
      вместо заполнения обычной JSON Schema). Итоговая форма — три честно названных тула
      (get_passport/get_assemblies/get_io_schema), решение записано в api-response-shape-rework.
      Прошлая версия этого файла (посценарийная история находок и точечных починок) удалена по
      прямому указанию user — новый вид описывает ТЕКУЩЕЕ и ПЛАНИРУЕМОЕ состояние, не хронологию
      ошибок.

  - id: external-agent-remeasured-independently
    type: plan
    date: 2026-09-08
    summary: >
      Внешний агент замерил зону заново после api-response-shape-rework, независимо от внутренних
      цифр этого файла — совпало: разведка «список → паспорт» подешевела с ~14.9k до ~7.5k токенов
      без фильтра, ~4.8k с ним; list_components 17358 → 8271 символов (288 с group=actions);
      get_passport 16354 → 4005 на другом реальном компоненте (io-схема и сборки уехали в свои
      ручки); instructions 1650 → 423 символа; при удвоении числа ручек (13 → 24) вес описаний
      остался тем же ~9.7k — то есть резали осознанно, не дали разрастись. Та же заявка сразу нашла
      следующий слой (limitSchema, list_feedback, list_presets без kind) — см. пункты выше в этой
      категории, все три закрыты тем же заходом.
