# Дорожная карта @web-core/chat — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же, что
# у interfaces/feeder, packages/io, packages/store (categories → items, log — журнал решений); без
# milestones — у пакета нет освоенной поставки с датами релиза, только сделанное и открытое.

categories:
  - category: Фундамент
    items:
      - id: chat-package-scaffold
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`interfaces/chat` — скелет пакета по образцу `interfaces/feeder`"
        description: |
          Означает: `package.json` (`@web-core/chat`, `vite build`, `solid-js` peer, без доменных
          зависимостей — назначение не определено), `tsconfig.json`, `eslint.config.js` (пресет
          `@web-core/lint`), `vite.config.ts` (`defineLibraryConfig`, один вход `index`,
          `solid: true`) — build/typecheck/lint прогнаны, все зелёные. `interfaces/*` в
          `pnpm-workspace.yaml` уже покрывал новый пакет, отдельная правка не понадобилась.

      - id: chat-placeholder-wired
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`ChatPlaceholder` подключён в `apps/skin/src/pages/lab`"
        description: |
          Означает: `apps/skin` получил зависимость `@web-core/chat: workspace:*`, dev-страница
          `pages/lab` рендерит `ChatPlaceholder` рядом с `FeederPlaceholder`/`Tree` — тем же
          приёмом, что фидер.

      - id: chat-zone-registered
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Зона `chat` в `.claude/harness.yaml`"
        description: |
          Означает: `paths: [interfaces/chat]` зарегистрирован, owner-сессию заводит user —
          назначение пакета разбирается с ним напрямую, не через architect.

  - category: Направление (решено architect/user — код впереди)
    items:
      - id: chat-core-agnostic-decision
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Ядро не привязано к тому, кто по ту сторону — агент это фича, не архитектурная развилка"
        description: |
          Означает: TanStack AI (и `@web-core/neurobox` поверх него) заточен под пару юзер↔нейронка
          и несёт механики (тулз-коллы, стриминг), которые к нейронке НЕ привязаны в самом
          протоколе. Neurobox отвечает за нейронку (рантайм, AG-UI, расход) — chat отвечает за то,
          чтобы работать ПРОСТО КАК ЧАТ: юзер↔агент и юзер↔юзер рендерятся одним и тем же ядром,
          поведение чата от собеседника не зависит. Тулз-колл — фича поверх ядра (в теории её мог
          бы позвать и другой юзер, не только агент), видео/вложения — тоже фичи, по умолчанию не
          нужны большинству рабочих чатов. Решение: `neurobox` — один из будущих АДАПТЕРОВ ядра
          (переводит свой AG-UI словарь — `TEXT_MESSAGE_CHUNK`/`TOOL_CALL_*` — в нейтральные parts
          ядра), а не источник модели сообщения. Ядро не знает слов AG-UI.

          Дословно от user: «тэнстак ориентирован на общения юзера и нейронки, при этом он дает
          мехи, который не привязаны конкретно к нейронки. за нейронки отвечает нейробокс, а на
          твоей стороне я хочу чат который будет уметь работать просто как чат в первую очередь.
          общается юзер с агентом или другим юзером, на само поведение чата вообще никак не
          влияет... вызов тулза через чат это не его основная задача, а фича... если мы говорим
          именно про чат с агентом, это как бы фича уже поверх основного чата».

      - id: chat-core-before-features
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Порядок: сначала ядро без единой фичи, фичи — отдельными заходами поверх"
        description: |
          Означает: этот заход и ближайшие — только `core-participant-model`/`core-message-model`/
          `core-parts-extension-point`/`core-composer`/`core-stream-render`/`core-scroll-anchor`
          ниже. Ни тулз-коллы, ни агентский адаптер `neurobox`, ни вложения/видео в этот объём НЕ
          входят — вопрос закрыт явно (user, 2026-09-14): «идем по очереди, сначала доводим ядро,
          что бы фичи класть не на хорошую базу». Точка расширения (open parts registry)
          закладывается, но пустой — первая фича (вероятно, агентский адаптер `neurobox`)
          проверит её собой отдельной задачей.

  - category: Ядро (в работе)
    items:
      - id: core-participant-model
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "Нейтральная модель участника (participant)"
        description: |
          Означает: identity собеседника чата без понятия «агент»/«человек» на уровне типов ядра —
          ядру всё равно, кто на том конце. Различие агент/человек, если вообще где-то нужно
          ядру (например, для статуса «печатает»), не должно определять ветвление поведения самого
          чата — это ответственность будущих фич/адаптеров, не ядра.

      - id: core-message-model
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "Модель сообщения: message = parts[], в ядре только `text`"
        description: |
          Означает: сообщение — контейнер частей (parts), не строка. Ядро знает единственный тип
          части — `text` (единственное, что есть у любого чата всегда). `tool-call`/`attachment`/
          `video-embed`/реакции и т.п. — НЕ типы ядра, их вносят фичи через точку расширения ниже.

      - id: core-parts-extension-point
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "Открытая точка регистрации новых типов parts — заложена, не заполнена"
        description: |
          Означает: механизм, которым будущая фича регистрирует свой тип part (и его рендер) без
          правки ядра. В этом заходе ничего не регистрирует — первая проверка API этой точкой
          расширения будет отдельной задачей (см. `chat-core-before-features`).

      - id: core-composer
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "Композер: многострочный ввод, стоп вместо сабмита во время стрима"
        description: |
          Означает: базовый ввод текста — авто-рост высоты, кнопка меняет назначение на «стоп»,
          пока идёт стриминг ответа. Не завязан на то, кто отвечает (агент или человек печатает
          долго) — свойство ядра, не агентской фичи.

      - id: core-stream-render
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "Безопасный рендер текста по мере поступления (token-by-token)"
        description: |
          Означает: буферизация входящих токенов вместо релейаута на каждый чанк — рыночная
          база 2026 года для любого чата с потоковым текстом (см. ROADMAP-лог, разведка). Не
          специфика ИИ-чатов — свойство ядра, раз текст в принципе может литься по частям от
          любого источника.

      - id: core-scroll-anchor
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "Скролл: stick-to-bottom через anchor + IntersectionObserver"
        description: |
          Означает: пока читатель внизу списка — список едет за новым сообщением; ушёл читать
          историю вверх — автоскролл не дёргает, вместо этого индикатор «новые сообщения ↓».
          Строится на `@web-core/ui` `scroll-area` (Ark-примитив, уже в ките) — отдельного
          кирпича изобретать не нужно, см. лог разведки ниже.

  - category: Назначение (частично решено)
    items:
      - id: chat-purpose
        type: decision
        status: In Progress
        priority: High
        milestone: null
        name: "Что chat сводит и какой UI даёт"
        description: |
          Архитектурное направление решено (`chat-core-agnostic-decision`): ядро нейтрально к
          собеседнику, агентность/тулзы/вложения — фичи поверх, `neurobox` — будущий адаптер, не
          источник модели. Открыто по-прежнему: полный список фич первого релиза, транспорт для
          плеча юзер↔юзер (в репозитории пока нет ни вебсокета, ни GraphQL-подписки — проверено
          чтением `packages/query`), и когда/как заходит фича «агентский адаптер `neurobox`».
          Разбор продолжает owner с user.

      - id: neurobox-agent-adapter
        type: feature
        status: Backlog
        priority: null
        milestone: null
        name: "Фича «агентский адаптер @web-core/neurobox» — бэклог, не спецификация, для общей картины"
        description: |
          НЕ руководство к реализации — architect записал по просьбе user, чтобы было на чём
          опираться при решении про хранение переписки прямо сейчас, прорабатывать будем при заходе
          в саму фичу. Ядро сначала (`chat-core-before-features`), это не меняется.

          Что уже известно фактически (сверено живым прогоном architect+box, 2026-09-14, не по
          доке): бокс шлёт `RUN_STARTED`/`TEXT_MESSAGE_CHUNK`/`TOOL_CALL_START`/`_ARGS`/`_END`/
          `TOOL_CALL_RESULT`/`TEXT_MESSAGE_START`/`_CONTENT`/`_END`/`RUN_FINISHED` — адаптер
          переводит это в `parts[]` ядра (`text` уже есть, `tool-call`/`tool-result` — новые типы
          через открытую точку расширения, не трогая ядро).

          Важная деталь именно для вопроса «хранение переписки» (`NEUROBOX_CLIENT.md`, «Кто помнит
          разговор», + `packages/neurobox`'s `requireThreadId`): **бокс переписку не хранит и не
          ждёт её целиком** — Claude Code помнит сам на своей стороне, на каждый ход уезжает ТОЛЬКО
          последняя реплика человека, не вся история. Значит хранилище переписки на стороне chat —
          забота ТОЛЬКО про то, что показать юзеру при перезаходе (свой UI-архив), НЕ про то, что
          отправлять агенту заново — реплей истории агенту не нужен и вреден (переписать/сжать
          прошлое нельзя, агент помнит, как было на самом деле). Единственное, что обязано пережить
          перезагрузку страницы для адаптера — стабильный `threadId` разговора (одна сессия работы
          = один поток, не пересоздавать на каждый визит) и, если решат его использовать, прежде
          показанный текст истории для юзера.

log:
  - id: neurobox-agent-adapter-backlogged
    type: plan
    date: 2026-09-14
    summary: >
      User сперва попросил дописать интеграцию с агентом в README — architect поймал конфликт с
      сегодняшним же решением `chat-core-before-features` («ни одна фича, включая агентский
      адаптер, не входит в объём, пока ядро не готово») и переспросил, не меняя порядок сам.
      User уточнил: имел в виду ROADMAP, не README, и не спецификацию — просто бэклог-пункт,
      нужный прямо сейчас для общей картины при решении вопроса хранения переписки (отдельная,
      сейчас идущая работа). Записан `neurobox-agent-adapter` — что уже известно фактически из
      живого прогона architect+box тем же днём (AG-UI события → parts, и главное для вопроса
      хранения: бокс переписку не хранит и не ждёт её целиком, Claude Code помнит сам, реплей
      истории агенту не нужен — хранилище chat нужно только для показа юзеру, не для отправки
      агенту). Порядок «сначала ядро» не пересмотрен.

  - id: chat-founded
    type: plan
    date: 2026-09-14
    summary: >
      По просьбе user заведён второй кейс слоя `interfaces/` — `chat`, тем же фундаментом, что
      `feeder` (скелет пакета, dev-плейсхолдер, зона в harness.yaml), но документация сразу по
      канону, уточнённому на `feeder` в этом же дне: без отдельного раздела «Архитектура» (FSD
      слоя — только в корневом README, «Интерфейсы»), README/FAQ ссылаются на `feeder`/корневой
      README вместо повтора. Назначение пакета не определено — user заводит owner-сессию для
      разбора напрямую с ним.

  - id: chat-market-research
    type: research
    date: 2026-09-14
    summary: >
      По просьбе user (перед первым ТЗ) — разведка перед развилкой, как требует shared-policy
      («сверка с рынком»). Внутри репозитория: `@web-core/neurobox` (сосед, завёлся 2026-09-13)
      даёт клиент протокола AG-UI поверх TanStack AI (`useChat`, поток `TEXT_MESSAGE_CHUNK`/
      `TOOL_CALL_*`/`RUN_FINISHED`), но прямым текстом не хранит беседу и не рисует UI
      (`NEUROBOX_CLIENT.md`: «своего лица у бокса сейчас нет»). Готовых чат-примитивов в
      `packages/ui`/Ark UI нет (проверено `mcp__ark-ui__list_components`) — ожидаемо, рынок эту
      часть тоже не считает решённой headless-китом. Снаружи: у TanStack AI (тот же вендор, что
      `neurobox`) есть headless UI-слой `@tanstack/ai-solid/ui` (актуальный путь, старый пакет
      `@tanstack/ai-solid-ui` — deprecated реэкспорт) — `Chat/ChatMessages/ChatMessage/ChatInput/
      ToolApproval/TextPart/ThinkingPart`, поведение без вёрстки, конкретной доки по стилизации
      нет. Рыночная база «серьёзного» чата в 2026: сообщение — не строка, а массив частей (parts:
      text/tool-call/tool-result/thinking) — совпадает с моделью AG-UI один в один; стриминг —
      буферизация токенов, код-блок дорисовывается только после закрывающего ```; скролл —
      stick-to-bottom через invisible anchor + IntersectionObserver, подавляется, если юзер сам
      прокрутил вверх читать историю; композер — многострочный с авто-ростом, стоп-кнопка вместо
      сабмита во время стрима; виртуализация списка — нужна на больших историях, но это уже не
      «база», а следующий слой. Кирпичи `packages/ui` (Ark): `scroll-area` под список сообщений,
      `avatar` уже есть, `field`/`editable` под композер, `highlight` под код, `hotkeys`/
      `clipboard`/`toast`/`presence` — подойдут фичам по мере появления.

  - id: chat-core-agnostic-decided
    type: plan
    date: 2026-09-14
    summary: >
      После разведки owner предложил v1-базу, привязанную к плечу агента через `neurobox`
      (parts-модель = словарь AG-UI). User скорректировал развилку прямым текстом (см. `why` в
      `chat-core-agnostic-decision`): ядро НЕ должно знать, кто по ту сторону — агент это фича
      поверх ядра, не архитектурная развилка внутри него; тулз-коллы/видео/вложения — фичи, а не
      специфика агентского плеча. Решено: `neurobox` становится одним из будущих АДАПТЕРОВ ядра
      (переводит свой AG-UI словарь в нейтральные parts), не источником модели. Порядок работы
      (`chat-core-before-features`): сначала ядро без единой фичи — `core-participant-model`,
      `core-message-model` (только `text`-part), `core-parts-extension-point` (заложена, не
      заполнена), `core-composer`, `core-stream-render`, `core-scroll-anchor`. Ни агентский
      адаптер, ни тулз-коллы, ни вложения в этот объём не входят. User уходит согласовать
      направление с architect, дальше — код.
