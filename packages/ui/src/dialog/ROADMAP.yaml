# Дорожная карта диалога — формат тот же, что у остальных компонентов кита (см. table/ROADMAP.yaml,
# шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Полностью тонкая обёртка — каждая часть типизирована как проп компонента-первоисточника напрямую
# один в один (`DialogProps = ArkRootProps` и так далее для всех частей), пропс-серфейс сверен
# целиком инструментом `mcp__ark-ui__get_component_props`, 2026-09-04. Ни одного необёрнутого
# соседнего КОМПОНЕНТА не нашлось.

categories:
  - category: Основа
    items:
      - id: open-close
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Открытие и закрытие по клику
        description: |
          Означает: клик по `trigger` открывает диалог, `closeTrigger`/`Escape` закрывают его —
          обычное поведение модальной панели.
          Реализация: готовое состояние компонента-первоисточника, проверено тестом.

      - id: multiple-triggers
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Несколько триггеров на один диалог
        description: |
          Означает: несколько `DialogTrigger` с разными `value` делят один диалог — клик по любому
          открывает его и помечает себя как `current` (`data-current`), какой из них его открыл.
          Тот же приём, что у `drawer`/`popover`.
          Реализация: готовый проп компонента-первоисточника, проверено тестом.

      - id: alertdialog-role
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Диалог-предупреждение
        description: |
          Означает: `role="alertdialog"` — не только семантика: фокус по умолчанию уходит на
          кнопку закрытия/отмены, клик снаружи диалог не закрывает — подходящее поведение для
          подтверждения опасного действия.
          Реализация: готовый проп компонента-первоисточника, документирован примером README, не
          проверен отдельным тестом при аудите 2026-09-04.

  - category: Тонкая настройка
    items:
      - id: focus-and-dismiss-tuning
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Тонкая настройка фокуса и закрытия
        description: |
          Означает: `closeOnEscape`/`closeOnInteractOutside`/`trapFocus`/`restoreFocus`/
          `initialFocusEl`/`finalFocusEl`/`persistentElements` — какие элементы не закрывают
          диалог кликом снаружи, куда уходит и возвращается фокус.
          Реализация: готовые пропы компонента-первоисточника — технически проброшены, не
          проверены отдельным тестом при аудите 2026-09-04.

  - category: Не построено
    items:
      - id: context-not-reexported
        type: feature
        priority: Low
        milestone: null
        name: Императивный API диалога наружу
        description: |
          Означает: доступ к состоянию машины и методам управления диалогом из объекта API —
          тот же класс возможностей, что `carousel`/`date-picker` теряют без своего `Context`.
          Реализация: ЧЕСТНЫЙ пробел, не тихо забытый — компонент-первоисточник отдаёт это через
          `DialogContext`/`useDialogContext`/`useDialog`, но ни один из них не входит в
          `components/index.ts` кита. Третий такой случай в ките после `carousel`/`date-picker` —
          похоже, системный пробел карты кита, не случайность одного компонента.

# Журнал решений.
log:
  - id: fully-thin-wrapper-context-missing
    type: plan
    date: 2026-09-04
    summary: >
      Все семь частей принимают пропсы компонента-первоисточника один в один — инструмент
      `mcp__ark-ui__get_component_props` не вскрыл ни одного необёрнутого соседнего КОМПОНЕНТА.
      `DialogContext`/`useDialogContext`/`useDialog` не реэкспортируются — третий подряд компонент
      кита (после `carousel`, `date-picker`) с этим же пробелом. Стоит поднять как вопрос архитектору
      кита целиком, не чинить точечно здесь молча.
