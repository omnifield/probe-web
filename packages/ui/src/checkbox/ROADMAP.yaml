# Дорожная карта чекбокса — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# ТОНКАЯ ОБЁРТКА поверх готового компонента, как accordion/avatar — но, в отличие от них, НЕ весь
# пропс-серфейс проброшен: `CheckboxGroup`/`CheckboxGroupProvider` (управление набором чекбоксов
# как единым целым) в ките не завёрнуты вовсе (проверено `mcp__ark-ui__get_component_props`,
# 2026-09-04) — единственный настоящий пробел, не документация задним числом.

categories:
  - category: Основа
    items:
      - id: tri-state
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Три состояния (отмечен/не отмечен/отчасти)
        description: |
          Означает: обычная отметка плюс третье состояние для чекбокса, суммирующего частично
          отмеченных потомков — два независимых индикатора, каждый показывается только для
          своего состояния.
          Реализация: готовое состояние компонента-первоисточника, обвязка своя.

      - id: form-participation
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Настоящее поле формы
        description: |
          Означает: `name`/`value` делают чекбокс родным `<input type="checkbox">` для `FormData`
          — отправка формы подхватывает его без дополнительной обвязки.
          Реализация: скрытый `<input>`, который кладёт сам корень — потребителю добавлять не
          нужно и нельзя, adресa не несёт, наружу не экспортируется.

  - category: Группировка
    items:
      - id: checkbox-group
        type: feature
        priority: High
        milestone: null
        size: M
        name: Группа чекбоксов
        description: |
          Означает: управление набором чекбоксов как ОДНИМ целым — общее имя поля для формы,
          общий управляемый/неуправляемый массив выбранных значений, ограничение на максимум
          выбранных сразу.
          Реализация: у компонента-первоисточника есть готовый `Group`/`GroupProvider` — кит его
          не заворачивает вовсе, не только не документирует. Настоящий пробел, найден при аудите
          2026-09-04, не был в объёме раньше.

# Журнал решений.
log:
  - id: group-is-a-real-gap-not-scope-decision
    type: question
    date: 2026-09-04
    summary: >
      В отличие от accordion/avatar (полный проброс, подтверждённый аудитом), у checkbox найден
      реальный незавёрнутый кусок API — `CheckboxGroup`. Не решено, строить ли его сейчас или
      оставить открытым пунктом — оставляю вопросом, не тихо откладываю и не строю без спроса.
