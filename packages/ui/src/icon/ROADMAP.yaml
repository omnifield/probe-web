# Дорожная карта иконки — формат тот же, что у остальных компонентов кита (см. table/ROADMAP.yaml,
# шапка). Единственный источник правды: статус проставляется рядом с работой.

categories:
  - category: Основа
    items:
      - id: resolve-by-name
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Резолвинг иконки по свободному имени
        description: |
          Означает: `<Icon name="chevron-down" />` рисует настоящий `<svg>` — какая библиотека
          рисует конкретную картинку по этому имени, наружу не видно.
          Реализация: `createResource` + динамический импорт, проверено тестом на двух разных
          именах и через сборку `basic`.

  - category: Не построено
    items:
      - id: no-error-fallback
        type: feature
        priority: Medium
        milestone: null
        name: Нет состояния "имя не резолвилось"
        description: |
          Означает: если `name` не существует в резолвящей библиотеке, компонент не показывает
          ничего и никак не сообщает об этом наружу — падает необработанным отказом промиса.
          Проверено эмпирически: несуществующее имя уходит как unhandled rejection,
          `createResource`'s состояние ошибки в `root.tsx` никак не читается.
          Реализация: отсутствует — ни fallback-иконки на случай ошибки, ни видимого состояния.

      - id: not-own-name-vocabulary
        type: feature
        priority: Low
        milestone: null
        name: Имя — не свой словарь, а имя конкретной библиотеки
        description: |
          Означает: сегодняшние значения `name` — это буквально kebab-имена иконок из библиотеки
          под капотом (`chevron-down`, `trash-2`), не независимый словарь кита. Смена библиотеки
          иконок сломает каждое существующее использование, хотя тип пропса — обычный `string`.
          Реализация: отсутствует — маппинга «имя кита → имя библиотеки» нет.

# Журнал решений.
log:
  - id: solid-condition-vs-hardcoded-mjs
    type: plan
    date: 2026-09-06
    summary: >
      Первая реализация `resolveIcon` приклеивала `.mjs` к специфeру
      (`lucide-solid/icons/${name}.mjs`), рассчитывая на условие `"import"`/`"require"` из
      exports-карты пакета. В этом репо резолвится условие `"solid"` (`vite-plugin-solid`), которое
      ведёт на `./dist/source/icons/*.jsx` — с приклеенным `.mjs` подстановка wildcard давала
      несуществующий путь. Проверено эмпирически (`ls` реального `dist/source/icons/`) и
      исправлено: специфер отдан на резолв exports-карте пакета без ручного расширения.

  - id: waitfor-not-fixed-timeout
    type: plan
    date: 2026-09-06
    summary: >
      Черновик теста ждал резолва фиксированным `setTimeout(resolve, 0)` — оказалось короче
      реального времени динамического импорта под Vite/Vitest, тест падал раньше, чем `<svg>`
      появлялся в разметке. Заменено на `vi.waitFor` — поллинг условия вместо угаданного числа
      миллисекунд.
