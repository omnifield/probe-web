<!doctype html>
<!-- Опознание пресета и режима стоит на ЭТОМ узле — но пишет его не разметка, а точка входа
     (src/main.tsx, блок «названное место»). Соблазн вписать сюда data-theme="…" руками сильный
     и понятный: так оно встало бы до первого кадра гарантированно. Цена — литерал чужого имени
     в файле, который положен один раз и обвесом больше не обновляется: палитру переименуют у
     себя, и страница станет нецветной молча. Поэтому имя приезжает экспортом, а не строкой.

     Файл твой: если вспышка светлой темы перед тёмной для тебя дороже этого риска — обычный
     (не module) скрипт в <head> выполняется до первого кадра, и это твоё право. Наша поставка
     такой строки не кладёт. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
    <!-- Оформление ПОТРЕБИТЕЛЯ — то есть твоё. Кит безголовый (kb:PROBEWEB-4): примитив не
         везёт ни одного класса по умолчанию, зато ставит зацепку data-slot ДО спреда пропсов,
         а палитра даёт токены. Цепляешься за то и другое — и одеваешь весь кит разом, а не
         каждую кнопку поимённо.

         Токены разрешаются только когда палитра НАЗВАНА (kb:PROBEWEB-18): снимешь строку
         «названного места» из main.tsx — и правило ниже останется, а цвета из него уйдут.

         ИМЕНА ТОКЕНОВ НИЖЕ — из набора значений, подключённого в main.tsx. Наш набор стоит там
         умолчанием, но обязательным не является: взял значения на стороне — поставь сюда имена
         СВОЕГО поставщика. Правило твоё целиком, и наших имён оно знать не обязано.

         Блок показывает ПРИЁМ и намеренно мал. Скелет положен один раз, обвес в него больше
         не заглянет — значит всё, что здесь написано, замёрзнет у тебя навсегда, и дизайн-
         системе в нём не место. Свой CSS клади отдельным файлом рядом с main.tsx, импортируй
         его там же, а этот блок убирай. -->
    <style>
      [data-slot="button"] {
        padding: 0.5rem 0.875rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background-color: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- #root — часть замороженной поверхности (kb:PROBEWEB-4): mount() ищет его сам. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
