# Дорожная карта пресета vitest — формат тот же, что у остальных тем зоны (см. src/vite/ROADMAP.yaml,
# шапка). Единственный источник правды: статус проставляется рядом с работой.

categories:
  - category: Основа
    items:
      - id: solid-jsx-transform
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: JSX-трансформ в раннере
        description: |
          Означает: `vite-plugin-solid` в `plugins` — тест Solid-компонента разбирается так же,
          как в реальном приложении.

      - id: resolve-conditions
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: resolve.conditions development+browser
        description: |
          Означает: `solid-js/web` резолвится в клиентскую ветку (иначе `render()` падает), и
          условие `solid` дотягивает зависимости, отдающие непреобразованный JSX.

      - id: jsdom-environment
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: jsdom-окружение
        description: |
          Означает: `test.environment: "jsdom"` — есть документ, в который рендерить. `jsdom` —
          необязательный peer, не тянется тем, кто пресет не зовёт.

      - id: deps-inline-by-extension
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Транзитивные JSX-зависимости не внешнятся
        description: |
          Означает: тест на компоненте кита не падает `Unknown file extension ".jsx"`, даже
          когда JSX-зависимость (`@kobalte/core` и т.п.) приезжает транзитивно, а не объявлена
          у потребителя напрямую.
          Реализация: `test.server.deps.inline: [/\.[jt]sx(\?|$)/]` — правило по расширению
          файла, не по списку имён пакетов (`PROBEWEB-37`).

log:
  - id: selective-failure-measured
    type: plan
    date: 2026-08-18
    summary: >
      Дефект `Unknown file extension ".jsx"` ловит не всякого потребителя — замерено на четырёх
      раскладках (кит тарболом/симлинком, зависимость рядом/вложенной, потребитель внутри/вне
      репозитория): решает манифест (объявлена зависимость напрямую или приехала транзитивно),
      не форма установки. Отсюда и `deps-inline-by-extension` в пресете — он обязан работать в
      обоих случаях.

  - id: explicit-fields-kept-despite-redundancy
    type: plan
    date: 2026-08-08
    summary: >
      `vite-plugin-solid@2.11.14` в режиме `test` подставляет conditions и jsdom сам — проверено
      снятием каждого поля, прогон остаётся зелёным. Поля оставлены явными: так требует дока
      Solid, и пресет не должен зависеть от внутреннего поведения плагина, которое тот вправе
      поменять своим выпуском.
