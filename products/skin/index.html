<!doctype html>
<!-- НИ ТЕМЫ, НИ РЕЖИМА ЗДЕСЬ НЕ ЗАДАЁТСЯ, и обоих больше не существует как отдельных вещей.
     Палитру фреймворк не везёт: палитра без рецептов — половина скина, а половин у скина не
     бывает. Режим — тоже половина скина: нет скина, нет и режима.
     Витрина при этом обязана быть видна всегда, даже когда скинов в службе нет вовсе. Поэтому
     вид САМОЙ оболочки она несёт своими значениями (`showcase.css`) — не потому, что обходит
     фреймворк, а потому, что брать его больше неоткуда и не у кого. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Витрина — компоненты, подключённые к редактору скина</title>
  </head>
  <body>
    <!-- #root — часть замороженной поверхности (kb:PROBEWEB-4): mount() ищет точку сам. -->
    <div id="root"></div>
    <script type="module" src="/src/showcase/main.tsx"></script>
  </body>
</html>
