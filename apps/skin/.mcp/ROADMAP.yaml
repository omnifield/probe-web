# Дорожная карта apps/skin/.mcp — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/mcp/store (categories → items, log → журнал решений); без milestones.

categories:
  - category: Тулы — разведка кита
    items:
      - id: docs-and-components-discovery
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "list_docs/get_doc, list_components — прогрессивное раскрытие"
        description: |
          Означает: `list_docs`/`get_doc` отдают тематические разборы (`docs/*.md`) по запросу, не
          все разом в `instructions` — агент тянет тему (например `color`), только когда она реально
          нужна для текущей задачи. `list_components` отдаёт карточку на компонент (род/группа/
          размерность/пакет/число частей/имена сборок), не всё содержимое кита — фильтр по
          `group`/`footprint`, курсорная пагинация (`@web-core/mcp/pagination`, тот же примитив, что
          у остальных `list_*`). `partsCount` берётся через `groupOf`/`footprintOf` кита, не считает
          дубли надстройки Zag.
          Проверено живьём: реальный HTTP-сервер, фильтр по группе и по несуществующей группе
          (`isError`, не пустой список), пагинация по `cursor`/`limit`.

      - id: get-passport-scope
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "get_passport(component) — паспорт компонента"
        description: |
          Означает: части/состояния (с `mark`)/настройки (с `mark`/умолчанием/`dependsOn`)/
          `variantAxis`/`selfAssembly`/io-схема одного компонента — разведка перед тем, как писать
          палитру/форму/сборку. Форма ответа пересматривается — см. открытый пункт
          `api-response-shape-rework` ниже, вынесены в отдельные тулы `editor`-слайс и полные деревья
          сборок, дублировавшие вес `list_components`/будущего `get_assemblies`.

  - category: Тулы — пресеты
    items:
      - id: preset-crud-and-checks
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "list_presets/get_preset/check_*/save_preset/assemble_preview"
        description: |
          Означает: полный цикл палитры/формы/наряда/сборки/тега — проверка ДО сохранения
          (`check_palette`/`check_form`/`check_assembly`/`check_outfit`, каждая отдаёт отчёт с
          флавами, `isError:false` — отрицательный отчёт это данные, не отказ протокола),
          `save_preset` сохраняет только после того же прохода. `assemble_preview` собирает наряд и
          отдаёт CSS-текст без сохранения. Тег (`kind:"tag"`) — словарь допустимых меток, та же
          механика на двух уровнях (наряд целиком / значение варианта формы через `variantTags`).
          Вес `assemble_preview`/структура флавов пересматриваются — см. `api-response-shape-rework`.

      - id: unknown-variant-tag-flaw
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "variantTags на несуществующий вариант — флав, не тихий ok:true"
        description: |
          Означает: `resolveVariantTags` (`tools/presets.ts`) раньше проверял ссылки только В ОДНУ
          сторону — брал имена из `recipe.variants` и резолвил им теги из `variantTags`, но никогда
          не проверял обратное: ключ `variantTags`, которого нет среди `recipe.variants` (опечатка в
          имени), просто никуда не попадал и молча пропадал. Теперь такой ключ даёт флав
          `unknown-variant` с адресом `variantTags.<имя>`.
          Причина: живая заявка — «позвал check_form на форме с variantTags без соответствующего
          recipe.variants… ожидал флав про лишний ключ, получил тихо ok:true, значение просто
          проигнорировано».
          Проверено живьём: `variantTags:{"no-such-variant":["status"]}` на форме без такого
          варианта — `ok:false`, `referenceFlaws` несёт `unknown-variant`; тот же вызов с реальным
          именем варианта и реальным тегом — `referenceFlaws` пуст, `tagGroups` собран верно
          (регрессии нет).

  - category: Тулы — заявки
    items:
      - id: feedback-lifecycle
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "report_feedback/list_feedback/resolve_feedback"
        description: |
          Означает: `report_feedback` пишет сигнал `{tool, action, expected?, actual}` с `status:
          "open"`, отдельным `kind:"feedback"` — не смешивается с presets в `list_presets`. Живёт в
          службе пресетов этой зоны, не у платформы вызывающего агента — переживает смену агента/
          сессии/платформы. `list_feedback` по умолчанию отдаёт только `open`, постранично, сразу с
          содержимым. `resolve_feedback` закрывает заявку на месте (`store.update` через `PUT`, id не
          меняется), пишет `resolvedAt`/`note`; заявка без `status` (записанная раньше) считается
          `open`. Повторное закрытие и закрытие несуществующей заявки — `isError` с внятной причиной.

      - id: feedback-sign
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "sign: issue|praise — знак заявки, не только жалоба"
        description: |
          Означает: `report_feedback` получил `sign` (`"issue"` по умолчанию — старое поведение,
          `"praise"` — сработало хорошо, `expected` для похвалы необязателен вдвойне). `list_feedback`
          получил независимый фильтр `sign` (наравне с `status`) — можно увидеть только похвалы,
          только проблемы или всё разом. Заявка без `sign` (записанная раньше) считается `issue`, тем
          же приёмом, что заявка без `status` считается `open`. Форма записи не менялась (`tool`/
          `action`/`actual`) — только смысл, поэтому не отдельный тул (`report_praise`), а поле:
          та же сущность, другой знак, не другая операция.
          Причина: живая заявка — «форма только отрицательная: expected и actual подразумевают
          расхождение… похвалу можно затолкать в actual, но она смешается с претензиями».
          Проверено живьём: `sign:"praise"` метит label эмодзи, `list_feedback({sign:"praise"})`
          отдаёт только его, `list_feedback({sign:"issue"})` — остальное, включая старые записи без
          поля `sign` вовсе.

  - category: Тулы — наполнение
    items:
      - id: content-tools
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "save_content/list_content/get_content"
        description: |
          Означает: реальные, curated данные для наполнения компонента при живом просмотре — не
          абстрактный `zocker`-мок. `save_content` сверяет `data` с io-схемой компонента ДО записи
          (несовпадение — флав с адресом поля, не тихая запись мусора); компонент без io-схемы
          (`table` — свои `props`, не `bind`) сверять нечем, проходит без проверки. `kind:"content"` —
          ещё один бесплатный вид (`backend/presets` не толкует `kind`).

  - category: Тулы — браузер
    items:
      - id: browser-tools
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "browser_navigate/browser_snapshot/browser_click/browser_screenshot"
        description: |
          Означает: headless-браузер (`chrome-devtools-mcp` через `@web-core/mcp/browser`) как
          визуальная обратная связь — единственный способ в этой зоне реально УВИДЕТЬ вид, не только
          прочитать CSS-текст. Своя вкладка на MCP-сессию (замыкание в `registerTools`, не отдельная
          карта — оно и так строится заново на сессию). `browser_navigate` — жёсткий переход по URL,
          не воспроизводит внутренний переход SPA (клик по дереву/меню — другой код-путь). Для этого
          — `browser_snapshot` (текстовое a11y-дерево, `uid` на узел) + `browser_click` (клик мышью
          по `uid` из свежего снимка). `uid` может смениться после клика при обновлении DOM.
          Проверено живьём: параллельные сессии на разные адреса не пересекаются; реальная кнопка на
          `data:`-странице меняет текст по клику, снимок это подтверждает.

  - category: Владение записями
    items:
      - id: author-ownership
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "author — симметричное владение"
        description: |
          Означает: у записи есть `author` — переписать её может только запрос с ТЕМ ЖЕ `author`; нет
          — открыта всем. Один код-путь для любого имени, без иерархии и без секрета: `author`
          приезжает С ЗАПРОСОМ от платформы, которая уже знает, с каким залогиненным юзером говорит
          — эта зона identity не проверяет, только сравнивает строки (доверие к источнику — граница
          сети/транспорта, не эта проверка). `push-to-prod.mjs` несёт `author` из каждой конкретной
          локальной записи, не единый параметр на весь прогон.
          Проверено живьём: открытая/занятая запись, свой/чужой/отсутствующий `author`, включая
          контрольную попытку на реальном `omnifield-palette`.
          `author` тогда всё ещё был обычным аргументом тула — см. author-header-not-argument ниже,
          где заголовок `X-User-Login` встал НАД аргументом, не просто рядом.

      - id: author-header-not-argument
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "author приезжает заголовком X-User-Login, аргумент — только резерв без него"
        description: |
          Означает: на HTTP `author` для `authorGuard` (`save_preset`/`save_content`) читается из
          `context.headers["x-user-login"]` (`tools/shared.ts`'s `resolveAuthor`) и ПОБЕЖДАЕТ любой
          аргумент `author`, даже явно указанный. Аргумент остаётся рабочим ТОЛЬКО когда заголовка
          нет вовсе (stdio — локальный запуск, `push-to-prod.mjs`).
          Причина: живая заявка внешнего агента — «агент знает, чей запрос, а ваш сервер — нет...
          агент имя не печатает и подменить его не может. Личность приезжает каналом, а не словами
          агента» — плюс предложенное имя заголовка (`X-User-Login`), принято как есть. До этой
          правки `author` был обычным аргументом — ownership защищала бы от чужой опечатки, но не
          от намеренной (или случайной) путаницы: ничто не мешало любому вызову назваться чужим
          именем.
          Реализация опиралась на находку в `packages/mcp` (см. tool-handler-request-context в
          `packages/mcp/ROADMAP.yaml`) — своя обёртка `registerTool` отбрасывала `extra` SDK
          (реальные HTTP-заголовки на каждый вызов), пришлось чинить это первым, до того как здесь
          вообще стало возможно читать заголовок.
          Проверено живьём: клиент с `X-User-Login: bob` пытается сохранить запись alice, ПОДДЕЛАВ
          аргумент `author: "alice"` — отказано («owned by "alice"»), реальным guard'ом управляет
          заголовок, не то, что написано в аргументе. Тот же вызов по stdio (заголовка нет вовсе) —
          аргумент по-прежнему работает, без единой ошибки.

  - category: Транспорт
    items:
      - id: http-single-instance
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Один HTTP-инстанс на всех агентов, изоляция на уровне вкладки"
        description: |
          Означает: `.mcp.json` подключает зону по `http` к уже поднятой службе (`pnpm run serve`,
          `SKIN_MCP_TRANSPORT=http`), а не поднимает свой процесс на каждую сессию — с headless-
          браузером процесс на сессию был дорог (свой `chrome-devtools-mcp` на каждую). Изоляция
          осталась на уровне вкладки: `@web-core/mcp` строит свой набор тулов на каждую MCP-сессию,
          вкладка замкнута внутри набора. Порт по умолчанию — 8788 (в семье `backend/presets`'s 8787,
          не общий с чужой инфраструктурой контейнера — прошлый дефолт 3000 конфликтовал с ней
          намертво: `listen()` в `@web-core/mcp` теперь ловит ошибку старта явно, отдаёт причину, не
          валит процесс сырым стектрейсом). Служба должна быть поднята ДО подключения агента — не
          поднята, сессия не увидит тулы зоны, это заметно сразу.
          `pnpm run push-to-prod` переносит `omnifield-*`/тег-словарь на прод-адрес тем же путём,
          порядок `tag → palette → form → outfit` — форма сверяется с палитрой по имени, наряд
          резолвит формы по имени.

  - category: Наряд и цвет
    items:
      - id: outfit-color-guidance
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "docs/color.md + второй наряд (amethyst) — accent красит бренд, neutral красит тему"
        description: |
          Означает: `scales.accent` красит кнопки/ссылки/фокус; ВЕСЬ остальной вид (фон/поверхности/
          бордеры/приглушённый текст) — OKLCH-рэмп из ОДНОГО seed-цвета `scales.neutral`
          (`packages/style`). «Как X, но бренд другой» — меняется только `accent`. «Своя тема» —
          обязана смениться `neutral`, причём хью-семьёй (таблица сочетаний — реальные значения
          Radix Colors, не выдуманные) И насыщенностью (фон получает лишь долю chroma seed'а —
          блёклый `neutral` даёт технически другую, но неразличимую на глаз тему). `danger`/
          `success`/`warning` не подгоняются под бренд. `amethyst`/`amethyst-palette` — второй наряд,
          honest пример этого правила, не тестовая заглушка.

  - category: API — пересмотр формы ответа
    items:
      - id: api-response-shape-rework
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Ручки отдают ровно то, что называют — не весь репозиторий одним вызовом"
        description: |
          Замерено живьём 2026-09-08 на поднятом сервере ДО правки (символы/токены): `assemble_preview`
          202281 ≈ 61.3k ток (клиент режет ответ на 25k — не доедет вовсе), `get_passport` 52471 ≈
          15.9k, `check_form` 17112 ≈ 5.2k, `list_presets` (без `kind`) 7179 ≈ 2.2k. Источник веса
          `get_passport` — `editor.assemblies` несла ПОЛНОЕ дерево `PassportAssembly` каждой сборки.

          Решение опиралось на три источника, не на вкус: спека MCP (`resource_link` — официальный
          тип контента; курсорная пагинация `tools/list` — наш `@web-core/mcp/pagination` уже так
          устроен); Anthropic «Writing effective tools for agents» («restrict tool responses to
          25,000 tokens by default» — то же число, что и замер) — консолидировать ОПЕРАЦИИ НАД ОДНОЙ
          СУЩНОСТЬЮ разной глубины, не звать ручку чужим именем ради вместимости; реальный исходник
          `chrome-devtools-mcp` (не по памяти) — тулы по файлам КАТЕГОРИЙ, общий `ToolDefinition`,
          формировщик ответа на каждый тип данных отдельно (их постраничная пагинация НЕ перенята —
          курсорная у нас и так спеке соответствует лучше).

          Сделано:
          1. `get_passport(component)` — только `{component, root, parts, variantAxis, settings,
             selfAssembly}`. `anatomyKeys` (дублировала `parts[].name`) и `editor`-слайс (дублировал
             `list_components`) убраны.
          2. `get_assemblies(component, name?)` — без `name` список `{name, means}`, с `name` —
             полное дерево одной сборки.
          3. `get_io_schema(component)` — `{input, output}` JSON Schema, своя ручка.
          4. `assemble_preview` — CSS едет `resource_link` (`skin-css://<uuid>`, своя карта на
             сессию), ответ — `{report, gaps}`.
          5. `skinGaps` (`engine/mechanics.ts`) группирует по тексту `means` — адреса списком под
             одним сообщением, не фраза на каждую запись.
          6. `OutfitFlaw` (`packages/skin/src/engine/look/types.ts`) получил необязательное поле
             `missing?: readonly string[]` для `palette-incomplete` — ПОЛНЫЙ список ролей, `means`
             по-прежнему резюмирует прозой (может усечь для читаемости, но теперь есть и точные
             данные рядом, не только строка с «…»).
          7. `tools/index.ts` (было 500+ строк одним файлом) разложен на `tools/{kit,presets,
             feedback,content,browser,shared}.ts` (14-231 строка каждый), агрегатор `index.ts` — 14
             строк.
          8. `description` каждого тула — 1-2 предложения; там, где раньше были абзацы обоснований
             (`save_preset`, `check_form`, `save_content`) — короткая ссылка на `get_doc("author"/
             "forms")`. Новые доки: `docs/author.md`, `docs/forms.md`.

          Проверено живьём на реальном сервере (24 тула): `get_passport("button")` — 1803 символа;
          `assemble_preview(omnifield)` инлайн-тело — 47539 символов вместо 202281 (CSS, 134395
          символов, читается отдельно через `resources/read`); `gaps` — 205 групп вместо 229 плоских
          записей (до 3 адресов под одним сообщением); `check_palette` на заведомо неполной палитре
          — `missing` несёт все 141 роль, `means` резюмирует первые 12; `instructions` — 423 символа
          (было заметно больше). `get_assemblies`/`get_io_schema` отвечают на реальном `button`.
          Числа выше поправлены после находки в list-presets-default-bounded ниже — считать нужно
          `content[0].text.length` (реальный текст на проводе, `ok()` печатает JSON с отступом в 2
          пробела), не `JSON.stringify(перепарсенное).length` (компактно, меньше на 20-40%). Первые
          цифры (855/37816/2435) были посчитаны вторым способом — везде исправлены на первый.

      - id: tool-descriptions-cost-tokens
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "description тула — минимум, глубокая дока по get_doc, не всегда"
        description: |
          Сделано вместе с api-response-shape-rework (пункт 8) — `description` короче, `docs/
          author.md`/`docs/forms.md` добавлены, `instructions` в `server/index.ts` сокращён до
          указателя на разведку+флав-конвенцию+темы `get_doc`, без пересказа содержимого тем.
          Причина: агент, с которым работает юзер, платит токенами за каждый вызов — user прямо
          назвал это деньгами, не абстрактной эффективностью, и указал на масштаб: сейчас юзер один,
          лишние токены на каждый список тулов незаметны, но при росте числа юзеров та же
          неэффективность на каждого умножается геометрически. См. также memory
          `mcp-tool-descriptions-must-be-cheap` — то же правило для ЛЮБОЙ будущей MCP-зоны, не
          только этой.

      - id: bounded-limit-everywhere
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "limit — общая limitSchema, не голый z.number().positive() с language-max в схеме"
        description: |
          Означает: `list_components`/`list_presets`/`list_feedback`/`list_content` берут `limit`
          из `@web-core/mcp/pagination`'s `limitSchema` (`max(100)`), не набирают схему заново —
          `z.number().int().positive()` без верхней границы печатал в JSON Schema предельное целое
          языка (`9007199254740991`), одно и то же число в описании ЧЕТЫРЁХ разных ручек.
          Причина: живая заявка — «У поля limit стоит 9007199254740991… приезжает агенту в описании
          КАЖДОЙ ручки с пагинацией… это шум ровно там, где вы вес и режете».
          Проверено живьём: `client.listTools()`'s `inputSchema.properties.limit` любой из четырёх
          ручек — `{"maximum":100}`.

      - id: feedback-header-body-split
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "list_feedback отдаёт заголовки, get_feedback — тело (тот же приём, что у get_preset)"
        description: |
          Означает: `list_feedback` больше не несёт `tool/action/expected/actual` каждой заявки —
          только `{name, label, tool, sign, status, at}`. Новая `get_feedback(name)` — полное
          содержимое одной заявки, тем же разделением, что уже есть у `get_preset`/`get_content`.
          Причина: живая заявка — заявки не удаляются, только помечаются `resolved`, значит вес
          `list_feedback` растёт ЛИНЕЙНО с историей зоны; на восьми заявках уже 7507 знаков
          (~2500 токенов), «на паре сотен заявок это станет самой тяжёлой ручкой здесь, тяжелее
          прежнего list_components».
          Проверено живьём: 13 реальных заявок — `list_feedback` 3426 символов (заголовки),
          `get_feedback` по имени отдаёт полный текст одной.

      - id: list-presets-default-bounded
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "list_presets() без kind тоже режется limit, не выгружает всё пять видов целиком"
        description: |
          Означает: без `kind` каждый из пяти видов режется собственным `OVERVIEW_LIMIT = 10`
          (`tools/presets.ts`), не общим `paginate()`'s `DEFAULT_LIMIT = 50` — цель этой ветки
          обзор пяти видов сразу, не глубокий листинг одного, планка ниже. Без `cursor` в этой ветке
          (пять независимых курсоров в одном ответе не складываются в единую последовательность
          страниц осмысленно) — для полного обхода одного вида называйте `kind` явно.
          Причина: живая заявка — «тот же капкан, из которого только что вылез list_components: там
          фильтр и курсор работают и без прочих аргументов» — самый первый, необученный вызов (без
          аргументов) оставался самым тяжёлым путём, тем же классом проблемы, что уже чинили у
          list_components. Первая попытка чинить (прокинуть вызывающий `limit` голым в `paginate()`)
          оказалась no-op — реальный набор (28 форм, ~30 записей всего) не превышал общий default в
          50, внешний агент перемерил и получил те же 7179 символов, что и до правки.
          Проверено живьём: без аргументов — 3367 символов / 10 форм (было 7179 / 28); явный
          `limit:3` по-прежнему уважается — 1892 символа / 3 формы на вид.

      - id: paginate-default-limit-lowered
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "paginate()'s DEFAULT_LIMIT 50 → 20 — общий движок, не точка за точкой"
        description: |
          Означает: `@web-core/mcp/pagination`'s `DEFAULT_LIMIT` — 20, не 50. Правит ВСЕ ветки,
          которые зовут общий `paginate()` без явного `limit`: `list_components()`,
          `list_presets(kind:"…")`, будущие однотипные листинги — одним изменением в одном месте,
          не точечным `OVERVIEW_LIMIT`-подобным патчем на каждую ручку по мере поступления заявок.
          Причина: живая заявка, сразу вдогонку предыдущей — починка `list_presets()` без `kind`
          (см. `list-presets-default-bounded`) закрыла ОДНУ ветку, но `list_components()` и
          `list_presets(kind:"form")` продолжали отдавать всё целиком без cursor: 35 компонентов
          (8271 символ) и 28 форм (5932 символа) — 50 никогда не было пройдено ни на одном реальном
          наборе, значит default молчал ВЕЗДЕ, не только в одной ветке. Заявка: «закрыть это
          правилом, а не точечно». 20 — планка ниже обоих текущих счётчиков (28, 35), то есть
          проверяема прямо сейчас, а не только на бумаге.
          Проверено живьём: `list_components()` — 20 из 35, `nextCursor` есть, 4754 символа (было
          8271 без cursor); `list_presets(kind:"form")` — 20 из 28, `nextCursor` есть, 4290 символов
          (было 5932). Тесты `packages/mcp` — 34 зелёных (было 33), включая новый на срабатывание
          default на наборе больше него.

      - id: store-client-dedup
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "engine/store.ts дублирует низкоуровневый провод @web-core/skin/presets — не drop-in"
        description: |
          Означает: `engine/store.ts` — 98 строк рукописного HTTP-клиента (голый `fetch`, свои
          `StoreRefused`/`StoreDown`), почти дословно повторяющих `packages/skin/src/presets/
          wire.ts`'s `ask()`/`PresetsRefused`/`PresetsDown`. НЕ drop-in замена на
          `createPresetsClient`, при проверке: его `PresetKind` — закрытый союз `palette|form|
          outfit|assembly` (правильно узко под домен Palette/Form/Outfit/Assembly), а эта зона
          сверху кладёт СВОИ, не-скиновые виды (`tag`/`feedback`/`content`) в ТОТ ЖЕ backend/presets
          — раздувать `PresetKind` пакета до них означало бы протащить заботы MCP-зоны в модель
          движка, которой они не принадлежат. Сама `ask()` — приватная (`./wire.js`, не
          реэкспортирована в `@web-core/skin/presets`), тянуть её напрямую в обход публичной
          границы пакета — тоже неверно.
          ПЕРЕСМОТРЕНО (2026-09-09): вывод про "не drop-in" был верен на момент записи, но обе
          названные причины с тех пор закрыты в `packages/skin` — `tag` (`tag-kind-support`) и
          `content` уже в `PRESET_KIND`. `feedback` вообще ушёл из presets отдельной сущностью
          (`feedback-bucket-and-type`, `backend/presets/ROADMAP.yaml`) — раздувать `PresetKind`
          больше не нужно вовсе. Значит верный путь — НЕ строить второй HTTP-примитив в
          `packages/mcp`, а звать `createPresetsClient` прямо (drop-in ЕСТЬ теперь) — см.
          `retire-engine-store` и `feedback-tools-migration` ниже, план заменяет этот пункт.

      - id: retire-engine-store
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "engine/store.ts — выкинуть, звать createPresetsClient прямо (пресеты/контент)"
        description: |
          Полный список мест, где `store` реально зовётся (сверено grep'ом по всей зоне, не по
          памяти) — `tools/presets.ts`, `tools/shared.ts`, `tools/content.ts`,
          `engine/validate.ts` (последний — напрямую из `./store`, не через барель `../engine`,
          легко упустить). `tools/feedback.ts` — отдельный пункт (`feedback-tools-migration`),
          `store` там относится к другой сущности, не presets.

          Один клиент на всю зону: `const presets = createPresetsClient({url})` — заменяет
          сегодняшний экспорт `store` из `engine/index.ts`. `url` — тот же `/graphql`, что
          резолвит `resolveBase()` в сегодняшнем `store.ts` (переносится, меняется только путь:
          `API_PATH = "/api/presets"` → `/graphql`, тем же приёмом, что `apps/skin`'s
          `shared-api-presets-single-endpoint`), окружение (`SKIN_MCP_PRESETS_URL`/`PRESETS_URL`,
          загрузка `.env` воркспейса) не трогать — работает как есть.

          Соответствие вызовов один-в-один:
          - `store.list(kind)` (без state, для листинга) → `presets.list(kind)`, но результат
            НАДО резать до `{id,label,name,kind,savedAt}` перед отдачей агенту — `list_presets`
            сегодня осознанно без `state` (история `api-response-shape-rework`, бюджет токенов),
            `presets.list()` всегда тащит state. НЕ форвардить `PresetRecord` как есть в этой
            ветке.
          - `store.findByName(kind,name)` + `store.read(id)` (два вызова) → `presets.get(kind,
            name)` (один). Используется в `get_preset`, `authorGuard` (`shared.ts`).
          - `store.readPalettes()`/`store.readForms()` → `presets.list("palette").then(rs =>
            rs.map(r => r.state))` / то же для `"form"` — используется в `check_outfit`,
            `assemble_preview`, `save_preset`'s outfit-ветка, `validate.ts`'s `checkPalette`/
            `checkForm`.
          - `validate.ts`'s `checkTags`: `list("tag")` брал только `.name` каждой записи —
            `presets.list("tag").then(rs => rs.map(r => r.name))`, `.state` не нужен, не
            запрашивать зря то, что не читается (не проблема самого клиента — просто не звать
            лишнее в этой конкретной ветке).
          - `store.replace(kind,name,state,label)` → `presets.replace(kind,name,state,label)` —
            прямое соответствие, используется в `save_preset`, `save_content`.
          - `store.save`/`store.update` — не остаётся вызовов на presets-видах после переноса
            (только `save_preset`/`save_content`, оба уже зовут `replace`, не `save`/`update`
            напрямую) — не переносить их, у presets-клиента `save` для чистого create, здесь не
            нужен.

          `PresetsDown`/`PresetsRefused` (`@web-core/skin/presets`) заменяют `StoreRefused`/
          `StoreDown` — те же два класса отказа, другое имя, `err()`-обёртки тулов ловят по факту
          отказа (`instanceof Error`), не по конкретному классу, менять их не придётся.

          Типовая деталь: `authorGuard(kind: string, ...)` и `KIND`-enum (`shared.ts`) дают
          `kind` как широкий `string`/union из zod — `presets.get<K extends PresetKind>(kind: K,
          ...)` хочет узкий литерал. Понадобится либо сузить тип `authorGuard`'s параметра до
          `PresetKind`, либо привести на вызове — решать по месту, не гадать сигнатуру заранее.

          Сделано ровно по плану: `engine/store.ts` удалён, `engine/presets.ts` — тот же
          `resolveUrl()`/`loadWorkspaceEnv()`, но путь `/graphql`, клиент — `createPresetsClient`.
          `authorGuard` сужен до `PresetKind` (все вызовы совместимы — `KIND`-схема и литерал
          `"content"` оба входят в союз). `list_presets`/`get_preset` — `presets.list`/`.get`
          напрямую, заголовки режутся своей `headersOf()`. `readPalettes`/`readForms` — тонкие
          обёртки в `engine/presets.ts`, используются в `validate.ts` и `tools/presets.ts` (4
          места). `list_content`/`get_content` заодно упростились — `presets.list("content")` уже
          несёт `state`, отдельный `store.read` на каждую запись (было `Promise.all`) не нужен.
          Проверено живьём (2026-09-09) реальным HTTP-клиентом (`@web-core/mcp/peer`) на
          свежепересобранном `backend/presets` (порт 8787, GraphQL): `list_presets({kind:"tag"})`
          — только заголовки, `get_preset` — полный `state`, `list_presets({kind:"palette",
          limit:2})` — `nextCursor` работает.

      - id: feedback-tools-migration
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "tools/feedback.ts — на @web-core/mcp/feedback, три ломающих отличия от старой формы"
        description: |
          Не перенос 1:1 — новая схема (`backend/presets/internal/graphql/feedback.graphql`,
          `packages/mcp/src/feedback/index.ts`) устроена иначе, три вещи меняются НЕ по вкусу, а
          потому что так устроены реальные типы:

          1. АДРЕСАЦИЯ ЛОМАЕТСЯ: `FeedbackEntry` не несёт имени, только `id`. `get_feedback`/
             `resolve_feedback` меняют аргумент `name` → `id`. `list_feedback`'s сводки должны
             отдавать `id`, не `name` — агент берёт оттуда, чем адресовать следующий вызов.
          2. ДЕФОЛТЫ — КОНВЕНЦИЯ ТУЛА, НЕ БЭКА: сегодня `status` по умолчанию `"open"`, `sign` —
             `"all"`. `listFeedback(url, {status?, sign?})` без параметра отдаёт ВСЁ (бэк не
             знает слова "open" как умолчание) — резолвить дефолт `status ?? "open"` в хендлере
             ДО вызова, не рассчитывать на бэк. `sign:"all"` — сентинел ЭТОГО тула, означает "не
             передавать sign вовсе", не строка для бэка (нет значения `sign="all"` в схеме).
          3. НЕТ `label`: `FeedbackEntry` не несёт человеческого ярлыка (фидбэк не `Preset`, у
             него нет envelope-`label`). Раньше ярлык (`${mark}${tool}: ${actual.slice(0,60)}`)
             считался в `report_feedback` и хранился. Теперь либо считать его НА ЧТЕНИИ в
             `list_feedback` тем же приёмом (дешёво, чисто отображение), либо убрать понятие
             ярлыка из ответа вовсе — решить явно, не потерять молча.

          Остальное — чистое упрощение, не только перенос:
          - `report_feedback`: `status`/`at` больше не выставляются тулом — бэк ставит их сам
            (`ReportFeedback`-резолвер). Хендлер просто зовёт `reportFeedback(url, {tool, action,
            expected, actual, sign})`.
          - `list_feedback`: фильтрация по `status`/`sign` теперь на бэке (`Query.feedback`) — но
            результат всё равно нужно резать до заголовков (`id`/`tool`/`sign`/`status`/`at`
            [+вычисленный ярлык]) перед отдачей: `listFeedback()` всегда тащит `action`/
            `expected`/`actual` целиком, а `list_feedback` сознательно лёгкий
            (`feedback-header-body-split` — на восьми заявках уже 2500 токенов, резать НАДО).
          - `resolve_feedback`: повторное закрытие теперь отказывает НА БЭКЕ
            (`resolveFeedback`'s резолвер) — хендлер зовёт функцию и транслирует
            `FeedbackRefused` в `err()`, свою проверку `statusOf(state)==="resolved"` до вызова
            убрать, дублирует то, что бэк уже проверит.

          Мелкая косметика, не блокер: текст отказа от бэка на "уже разобрана" несёт префикс
          `"presets: "` (см. `backend/presets/internal/graphql/feedback.resolvers.go`) — служба
          называет себя чужим именем в сообщении агенту. Можно оставить как есть (не критично,
          читаемо) или зачистить префикс в `wire()`-обёртке `packages/mcp/feedback` — не эта
          заявка, если чистить, то отдельным маленьким заходом там.

          Сделано ровно по плану, три ломающих отличия учтены как описано: `id` вместо `name` в
          `get_feedback`/`resolve_feedback` и в сводках `list_feedback`; дефолты `status:"open"`/
          `sign:"all"` резолвятся в хендлере (сентинел `"all"` — не передавать фильтр бэку вовсе);
          `label` считается на чтении в `labelOf()` (тот же приём `${mark}${tool}: ${actual.slice(
          0,60)}`, что раньше был на записи). `get_feedback(id)` — своей ручки под один id на бэке
          нет (только `Query.feedback(status?, sign?)`), берёт из `listFeedback()` без фильтра и
          ищет по `id` на стороне тула — соответствует форме бэка, не выдуманная ручка.
          `resolve_feedback` ловит `FeedbackRefused` и транслирует в `err()`, свою проверку статуса
          до вызова убрал — бэк проверяет сам.
          Косметика с префиксом `"presets: "` не тронута — не эта заявка.
          Проверено живьём (2026-09-09): `report_feedback(sign:"praise")` → `list_feedback({sign:
          "praise"})` отдаёт заголовок с `id` и вычисленным `👍`-label → `get_feedback(id)` — полное
          тело → `resolve_feedback(id)` — `status:"resolved"` → повторный `resolve_feedback` тем же
          `id` — `isError:true`, текст «заявка "…" уже разобрана» (тот самый префикс `presets: `).

