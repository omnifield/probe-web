# Настройки обвеса omnifield/devbox для производства веба.
# Всё вне ключа `baser` принадлежит самому инструменту, дверь туда не смотрит.
baser:
  # Раскладка omnifield одной строкой: общая сеть, тома секретов и pnpm-стора,
  # ассистент внутри. Перечислять эти значения поимённо не нужно.
  presets:
    - omnifield
  settings:
    # Скоуп приватного реестра. Здесь он нужен не только на чтение: производство
    # ПУБЛИКУЕТ свой обвес, а значит ходит на склад в обе стороны.
    npmScope: '@omnifield'
