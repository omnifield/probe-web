# Дорожная карта @web-core/query — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/build, packages/store и packages/assembly (categories → items, log → журнал
# решений); без milestones — у пакета нет освоенной поставки с датами релиза, только сделанное и
# открытое.
#
# Эта секция (GraphQL) — ПЛАН, согласованный с user 2026-09-09; транспорт (первый пункт) уже
# реализован, кодоген и переезд потребителей (следующие пункты) — ещё Backlog, значит «решено
# делать», не сделано. Контекст: backend/presets переезжает на GraphQL (см.
# /workspaces/probe-web/backend/presets/ROADMAP.yaml) — примитивная пара «список id / запись по
# id» не тянет растущий граф связей компонента. Слова user про ЭТОТ пакет: "это абстрактные
# механики и они не зависят от наших схем" — значит здесь заводится ТОЛЬКО транспортный механизм
# (как отправить GraphQL-документ и типизированно получить ответ), без единого поля/типа из схемы
# пресетов. Сама схема и конкретные запросы — забота потребителей (apps/skin, apps/skin/.mcp),
# третий шаг цепи, обсуждается отдельно.

categories:
  - category: Точка входа
    items:
      - id: root-reexport
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`.` — полный реэкспорт `@tanstack/solid-query`"
        description: |
          Означает: единая точка резолва @tanstack/solid-query (+@tanstack/query-core, который
          solid-query уже реэкспортирует целиком сам) — приложение не импортирует вендора
          напрямую, значит один QueryClientContext на всё приложение, не два из-за двух копий
          пакета. create*-алиасы (createQuery = useQuery и т.д.) — рекомендуемое написание под
          конвенцию Solid, которой в web-core держатся createSignal/createStore/createMachine.

  - category: Devtools
    items:
      - id: devtools-subpath
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Подпуть `./devtools` — SolidQueryDevtools/SolidQueryDevtoolsPanel"
        description: |
          Означает: отдельно от `.`, чтобы дев-инструменты не тянулись в прод случайно. Вендор
          сам себя гасит в проде через isDev из solid-js/web (подтверждено чтением исходников),
          но это не заменяет import.meta.env.DEV на стороне приложения — тот нужен, чтобы Vite
          вообще не включал модуль в бандл. Разбор — FAQ.md.

  - category: Persist
    items:
      - id: persist-subpath
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Подпуть `./persist` — persistQueryClient + createSyncStoragePersister"
        description: |
          Означает: два вендорских пакета (@tanstack/query-persist-client-core,
          @tanstack/query-sync-storage-persister), которые на практике всегда берут вместе, одним
          подпутём — по тому же доводу, что у аддонов @web-core/store. createSyncStoragePersister
          помечен @deprecated в самом вендоре (в пользу createAsyncStoragePersister) — сохранён
          сознательно, разбор и открытый вопрос — FAQ.md и категория «Не сделано» этого файла.

  - category: GraphQL-транспорт
    items:
      - id: graphql-subpath-no-second-cache
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Новый подпуть `./graphql` — транспорт без своего кэша, кэш уже даёт корень пакета"
        description: |
          По образцу `./devtools`/`./persist` — своя папка (`src/graphql/index.ts`), свой подпуть
          в package.json exports. НЕ берём urql/Apollo Client как основу: у обоих свой
          нормализованный кэш, а он у нас уже есть — `@tanstack/solid-query`, смонтированный в
          приложении (`QueryClientProvider`, см. категорию "Точка входа"). Два кэша поверх одних
          данных — источник рассинхрона, которого легко избежать.

          Вместо этого — тонкий клиент БЕЗ состояния (`graphql-request` — сам вендор прямо
          позиционирует себя как "minimal GraphQL client", без кэша, без стора, синглтон `fetch` с
          телом `{query, variables}`). Реализовано как реэкспорт трёх имён (`request` под именем
          `graphqlRequest`, `gql`, `ClientError`) — вся механика загрузки/кэша/ретраев остаётся на
          TanStack Query, GraphQL-клиент — просто транспорт до байт ответа. `queryFn`/`mutationFn`
          в `createQuery`/`createMutation` из корня пакета оборачивают `graphqlRequest` замыканием
          (как уже делает README для обычного `fetchTodo`) — подставлять напрямую как ссылку на
          функцию нельзя, т.к. её первый аргумент — url, а не `QueryFunctionContext`.

          Конкретный эндпоинт (адрес службы, заголовки авторизации) — НЕ в этом пакете: это
          конфигурация конкретного приложения, передаётся параметром при вызове, как уже сделано в
          `./persist`'s `storage`.

          Найдено по ходу реализации: `graphql-request` не ограничивается typescript-типами
          вендора `graphql` — `parse`/`print`/`Kind` из него дёргаются в рантайме (парсинг строки
          документа для определения query/mutation, GET-сериализации и т.д.), поэтому `graphql`
          заведён не только в devDependencies для типов, но и в peerDependencies пакета (диапазон
          `"14 - 16"`, тот же, что объявляет сам `graphql-request`) — приложение обязано поставить
          его само, как уже делает для `solid-js`.

      - id: graphql-codegen-types
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: Типы операций генерируются из схемы бэка, не пишутся руками
        description: |
          GraphQL Code Generator (`@graphql-codegen/cli` + `@graphql-codegen/typescript` +
          `@graphql-codegen/typescript-operations`) читает SDL (теперь есть конкретный файл —
          `backend/presets/internal/graphql/schema.graphql`, кодоген в монорепо может смотреть на
          него напрямую, не обязательно живой интроспекцией по сети) и `.graphql`-документы
          потребителя, отдаёт типизированные `TResult`/`TVariables` для каждой операции. Это ТОЖЕ
          абстрактная механика — конфигурация кодогена в этом пакете не знает ни одного поля схемы
          пресетов, только адрес источника SDL. Сами `.graphql`-документы (что реально
          запрашивается) пишут потребители в своей зоне, кодоген только даёт типы под них.

          Уточнение по факту реализованной схемы (2026-09-09, backend/presets готов): в схеме есть
          именованный скаляр `JSON` (recipe-assembly-json-scalar-boundary — под него идут
          `Form.recipe`/`ComponentAssembly.assembly`/`Palette.scales` и т.д.). Кодоген БЕЗ явной
          настройки `config.scalars` типизирует произвольный кастомный скаляр как `any` — это
          снова абстрактная механика (относится к любому кастомному скаляру любой схемы, не только
          к этой), но её нужно задать явно: `scalars: { JSON: "unknown" }`, чтобы граница осталась
          видимой типом (`unknown`, не `any`) — потребитель обязан явно привести/провалидировать
          перед использованием, а не молча доверять форме. Это тот же принцип, что уже закрыл
          границу на бэке (recipe-assembly-json-scalar-boundary) — здесь он просто продолжается на
          сторону клиента.

          Открытый вопрос, не решается в этом файле: кодоген гоняется на билде (свежие типы каждый
          `dev`/`build`) или коммитится сгенерённый файл в репозиторий (стабильность CI без
          доступности бэка в момент сборки) — решать, когда появится первый реальный потребитель
          (apps/skin), не раньше.

  - category: Структура пакета
    items:
      - id: engine-thin-index
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "src/index.ts (тонкий) + src/engine/index.ts (логика)"
        description: |
          Означает: по образцу packages/store/packages/assembly — src/index.ts один
          export * from "./engine/index.js", реэкспорт @tanstack/solid-query вместе с
          обоснованием (полнота реэкспорта, create*-конвенция) — в src/engine/index.ts.

      - id: subpath-per-folder
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "./devtools и ./persist — своя папка каждому (по образцу store's ./machine)"
        description: |
          Означает: src/devtools.ts → src/devtools/index.ts, src/persist.ts →
          src/persist/index.ts. package.json exports — dist-пути на .../index.js. Devtools и
          persist не образуют семью (в отличие от store's addons/), поэтому не сведены в общую
          папку — каждый самостоятельный подпуть получил свою. `./graphql` (см. выше) заводится
          тем же приёмом — четвёртая самостоятельная папка, не семья ни с одним из существующих
          подпутей.

  - category: Документация
    items:
      - id: readme-engine-template
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: README по общему шаблону "движок" — третий пилот (после store, assembly)
        description: |
          Означает: Анатомия/Использование/Настройки/Состояния/IO/Сборки/Рецепт заполнены
          фактами без обоснований (обоснования — FAQ.md), плюс сохранены две ловушки
          Solid-адаптера и пара с роутером из прежней версии README — контент не потерян,
          переложен в форму шаблона.

      - id: faq-roadmap
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: FAQ.md и ROADMAP.yaml — первое заполнение
        description: |
          Означает: FAQ.md сгруппирован по темам (Solid-адаптер / структура пакета / devtools /
          persist), каждый ответ проверен чтением исходников @tanstack/solid-query,
          @tanstack/solid-query-devtools, @tanstack/query-sync-storage-persister и solid-js/web в
          node_modules (не по памяти). ROADMAP.yaml — по образцу packages/store/packages/assembly.

  - category: Не сделано
    items:
      - id: sync-persister-deprecated
        type: bug
        status: Backlog
        priority: Low
        milestone: null
        name: "createSyncStoragePersister — deprecated у вендора, миграция на createAsyncStoragePersister не оценена"
        description: |
          Означает: @tanstack/query-sync-storage-persister@5.102.8's createSyncStoragePersister
          несёт JSDoc @deprecated в пользу @tanstack/query-async-storage-persister — пакет этот
          вендор не установлен нигде в репозитории. Сегодняшний ./persist построен на
          синхронном localStorage-пути сознательно (хватает того, что реально используется), но
          сама миграция не оценена и не спланирована. Разбор — FAQ.md.

  - category: Дальше по цепи (другая зона, не эта заявка)
    items:
      - id: consumers-write-own-documents
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: Конкретные GraphQL-запросы и схема пресетов — не в этом пакете
        description: |
          Третий шаг общей цепи (backend/presets → этот пакет → потребители). Слова user: "точечно
          пойдём по потребителям и всех нормально пересадим". `apps/skin` (витрина),
          `apps/skin/.mcp` (агент), рантайм `packages/skin` — каждый пишет СВОИ `.graphql`-документы
          под свой профиль потребления (см. `mcp-surgical-reads`/`showcase-page-batch`/
          `runtime-wear-once` в backend/presets/ROADMAP.yaml), используя транспорт и типы из
          `graphql-subpath-no-second-cache`/`graphql-codegen-types`. Не входит в объём этого файла.

log:
  - id: graphql-request-peer-not-just-types
    type: plan
    date: 2026-09-09
    summary: >
      Реализация `graphql-subpath-no-second-cache`: `graphql-request` не просто типизирует свои
      сигнатуры через `graphql`-пакет — `parse`/`print`/`Kind` из него реально дёргаются в
      рантайме (разбор строкового документа при отправке). Значит `graphql` — не devDependency
      «только под TypeScript», а настоящий peerDependency (`"14 - 16"`, диапазон самого
      `graphql-request`) — приложение обязано установить его рядом, иначе рантайм-ошибка резолва
      модуля, не ошибка типов. `gql`-тег из того же вендора рантайм-зависимости не тянет —
      это чистый passthrough по строке, без парсинга в AST.

  - id: backend-landed-transport-assumptions-held
    type: plan
    date: 2026-09-09
    summary: >
      backend/presets реализован (gqlgen, `Preset`-интерфейс + шесть типов, один `POST /graphql`,
      dataloader на связях) — транспортные решения, принятые здесь ДО реализации бэка, не
      потребовали пересмотра: один HTTP-эндпоинт без параметров маршрута подтверждает выбор
      кэш-less `graphql-request` (не нужен урл-роутинг, которым славятся сложные REST-клиенты);
      батчинг живёт целиком на сервере (`no-server-side-n-plus-one` в backend/presets/ROADMAP.yaml)
      — этому пакету по-прежнему нечего делать с N+1 самому. Единственное, что реализация добавила
      конкретного, — кастомный скаляр `JSON` в схеме, из-за которого `graphql-codegen-types`
      дополнен явной настройкой `scalars` (см. выше) — иначе кодоген тихо дал бы `any` вместо
      `unknown` на границе, которую бэк специально оставил непрозрачной.

  - id: subpath-per-folder-vs-addons-family
    type: plan
    date: 2026-09-04
    summary: >
      Реструктуризация src/ (index.ts тонкий + engine/, devtools.ts → devtools/index.ts,
      persist.ts → persist/index.ts) прошла по прецеденту packages/store, но не дословно: у store
      persist/undo/reset/validate сведены в один addons/ (общий смысл «аддон .with()»
      оправдывает семью), а machine/ — самостоятельная папка. У query devtools и persist не
      образуют семью между собой (разная природа: один — дев-инструмент, другой — сохранение
      кэша), поэтому оба взяты по образцу machine/ — каждый своя папка, не общий каталог.

  - id: accessor-type-hidden-confirmed
    type: plan
    date: 2026-09-04
    summary: >
      Подтверждено чтением @tanstack/solid-query@5.102.8/src/queryOptions.ts:
      UndefinedInitialDataOptions/DefinedInitialDataOptions — буквально Accessor<...> под другим
      именем, не отдельный тип с похожей формой. useQuery сразу вызывает options() внутри
      createMemo. Имя типа не содержит слова Accessor — источник путаницы, если разработчик решит
      проверить тип без чтения его определения. create* (createQuery и т.д.) — не типовые алиасы,
      а export const createQuery = useQuery, тот же объект функции в рантайме. Разбор — FAQ.md.

  - id: devtools-isdev-condition-confirmed
    type: plan
    date: 2026-09-04
    summary: >
      Подтверждено чтением solid-js/web/package.json и dist/dev.js|web.js: isDev — константа,
      выбранная package.json exports'ом по условию `development` (true в dev.js, false в web.js).
      @tanstack/solid-query-devtools/src/index.tsx использует эту константу, чтобы в проде
      SolidQueryDevtools стал no-op сам по себе, без участия import.meta.env.DEV на стороне
      приложения. Вывод: наш совет оборачивать импорт в import.meta.env.DEV — про размер бандла
      (исключить модуль из графа импортов), не про безопасность поведения в проде (та уже дана
      вендором). Разбор — FAQ.md.

  - id: sync-storage-persister-deprecated-found
    type: plan
    date: 2026-09-04
    summary: >
      При сверке фактов для FAQ обнаружено: createSyncStoragePersister
      (@tanstack/query-sync-storage-persister@5.102.8) несёт JSDoc @deprecated в пользу
      createAsyncStoragePersister из отдельного пакета @tanstack/query-async-storage-persister,
      который в репозитории не установлен. Не почищено и не заменено в рамках этой сессии —
      только зафиксировано фактом (FAQ.md) и открытым пунктом (эта категория «Не сделано») для
      решения отдельно, не задним числом внутри правки документации.

  - id: readme-engine-template-third-pilot
    type: plan
    date: 2026-09-04
    summary: >
      query — третий пакет, заполнивший общий шаблон README "движок" (Анатомия/Использование/
      Настройки/Состояния/IO/Сборки/Рецепт), после packages/store (первый пилот) и
      packages/assembly (второй). Прежний README пакета (нешаблонный, с разделами "Установка и
      вайринг"/"Две ловушки"/"Devtools"/"Пара с роутером"/"Сохранение кэша") не выброшен — его
      контент переложен в разделы шаблона (ловушки → Использование, пара с роутером и persist →
      Рецепт), обоснования вынесены в FAQ.md по общему правилу.

  - id: graphql-transport-decision
    type: plan
    date: 2026-09-09
    summary: >
      Продолжение решения из backend/presets/ROADMAP.yaml (переезд службы пресетов на GraphQL).
      Для этого пакета user назвал рамку явно: "это абстрактные механики и они не зависят от
      наших схем" — значит заводится только транспорт (как сходить за GraphQL-документом и
      типизированно получить ответ), не единый запрос/тип из схемы пресетов. Решено НЕ брать
      urql/Apollo Client целиком — у обоих свой нормализованный кэш, а кэш в приложении уже даёт
      смонтированный `@tanstack/solid-query` (см. категорию "Точка входа"); второй кэш поверх
      первого — источник рассинхрона без выгоды. Вместо этого — кэш-less клиент (кандидат
      `graphql-request`) как `queryFn`/`mutationFn` для существующих `createQuery`/
      `createMutation`, новым подпутём `./graphql` по образцу `./devtools`/`./persist` (своя
      папка, свой exports-путь). Типы операций — GraphQL Code Generator по интроспекции бэка, не
      руками. Порядок цепи (три отдельные зоны, порядок не менять): backend/presets → этот пакет →
      точечный переезд потребителей (витрина, MCP, рантайм). Пока овнеры делают базовые механики
      этих двух файлов, схемы конкретных доменов (пресеты и далее) обсуждаются отдельно с
      architect — не в этом файле.
