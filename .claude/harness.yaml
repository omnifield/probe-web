# harness.yaml — данные роль-модели продукта: КТО чем владеет и на какой модели работает.
#
# Живёт рядом с обвесом, который его читает (`.claude/hooks/harness-config.mjs`). Прежний дом
# `.omnifield/` снят вместе с baser: пространство имён принадлежало станку, который больше не
# существует, и держать в нём живой файл значило бы поминать покойника при каждой правке.
#
# Здесь ТОЛЬКО две вещи: зоны (границы правки) и пины моделей. Ни адресов служб, ни ключей
# трекера — тем, чего нет, обвес больше не распоряжается.
apiVersion: omnifield.dev/v1
kind: harness

product: probe-web

# Число архитекторов (main-сессий).
architects: 1

# Пины моделей по роли. Берём АЛИАСЫ, а не снапшоты с датой: алиас едет за выпусками сам,
# снапшот замораживает сессии на конкретной сборке и требует ручной правки в каждом репозитории.
models:
  architect: claude-opus-5
  owner: claude-opus-4-8
  layer: claude-haiku-4-5

# ЗОНЫ: scope (leaf-имя) → paths[] + назначение. owner-<zone> правит только свои папки —
# границу держит машина (`.claude/hooks/governance.mjs`), а не договорённость.
#
# Пути РАЗНЫХ зон не пересекаются: одна папка — один владелец.
#
# ЧЕГО ЗДЕСЬ НЕТ — то ведёт архитектор сам: корневые конфиги, `apps/`, `tools/`, `.claude/`,
# `.devcontainer/`. Это не пробел, а правило: у оснастки и гейта цепочки нет отдельного
# владельца, и заводить его ради строчки в файле незачем. Раньше `apps/reference` стоял зоной
# без овнера — и на этом я один раз поставил задачу несуществующему адресату.
zones:
  style:
    paths: [packages/style, packages/style-tools]
    description: "две папки у одного владельца НА ВРЕМЯ РАЗРЕЗА: `style` — набор значений (шкалы, размерности, роли), `style-tools` — инструменты стилизации, которые из него выделяются. Пока шов режется, обе стороны обязаны быть у одного владельца: разделённое владение посреди разреза — это ровно тот случай, когда один чинит и ломает у другого."
  ui:
    paths: [packages/ui]
    description: примитивы на Ark/Zag — 1-to-1 DOM, ноль стилей по умолчанию, паспорт компонента
  runtime:
    paths: [packages/runtime]
    description: mount() и надевание скина — то, что зовёт скелет у потребителя
  skin-mech:
    paths: [packages/skin, packages/skin-reference]
    description: "МЕХАНИКА скина — модель, сборка рецепта по частям, адресация из анатомии, порождение CSS. Рядом `skin-reference`, эталонный скин фреймворка: отдельная поставка, потому что механика не знает ни одного скина. Зависимость односторонняя: эталон знает механику, механика о нём нет. Один овнер у обоих: предмет соседний, компетенция та же."
  assembly:
    paths: [packages/assembly]
    description: "механика сборки — дерево узлов, реестр из паспортов, правки дерева, проверка вложенности, отрисовка по данным. Средство, а не решение: своего вида не приносит."
  build:
    paths: [packages/build]
    description: оснастка сборки — подпути /vite, /tsconfig, /vitest
  lint:
    paths: [packages/lint]
    description: пресет eslint-plugin-solid — канон Solid, выраженный машиной
  starter:
    paths: [packages/starter]
    description: npm-обвес @omnifield/probe-web — шаблоны скелета для потребителя
  mcp:
    paths: [packages/mcp]
    description: "тонкий переиспользуемый MCP-сервер (`PWEB-117`) — каркас, которым ЛЮБОЙ продукт на фреймворке подключает агента: фреймворк отдаёт готовые интроспекционные инструменты (паспорта кита, пресеты), продукт добавляет свои поверх одним вызовом. Не про одного конкретного агента (скин-генератор — свой отдельный вопрос, PWEB-115/116) — про общий протокол подключения."

  # Зоны products/ стоят здесь ВРЕМЕННО и уедут отдельными продуктами. В packages/ им нельзя:
  # там база.
  tables:
    paths: [products/tables]
    description: таблицы, headless как и кит; фильтры — модуль внутри со своей границей
  studio:
    paths: [products/studio, canons/studio]
    description: витрина первой волны — что умеет производство
  presets:
    paths: [products/presets]
    description: хранилище пресетов — кладёт и отдаёт JSON, формата фильтра НЕ понимает
  map:
    paths: [products/map, canons/map]
    description: карта — 3D-рельеф и города на MapLibre, тайлы файлом без сервера
  skin:
    paths: [products/skin, canons/ui-skin]
    description: "производство оформлений для безголового кита — своя логика, кит остаётся голым. У продукта СВОЙ архитектор: заявки сюда приходят от него, а не ставятся ему."
  chat:
    paths: [products/chat, canons/chat]
    description: чат — каркас фонда уже стоит (canons/chat)

# Git-доступ по роли — РАМКА, выключить нельзя: architect=full; owner=commit-only (gate);
# layer=none. Право архитектора даёт маркер `.claude/.main-session-id`.
#
# `full` НЕ значит «без вопросов» (2026-08-31): чтение не гейтится ни у одной роли, но запись
# в shared `.git` (switch/checkout/merge/rebase/push/reset --hard/branch -D/worktree add/commit/
# add/gh pr write) у architect ставит форс-вопрос человеку («ask», `git-gate.mjs`), а не тихо
# проходит — маркер держит несколько параллельных/резюмнутых architect-сессий одновременно, и
# без вопроса они меняли ветки друг у друга не сговариваясь. У owner та же запись — как и раньше,
# твёрдый отказ (deny), а не вопрос: owner работает в СВОЕЙ зоне, у него нет причины трогать это
# вообще, кроме коммита в своих path[].
git:
  architect: full
  owner: commit-only
  layer: none
