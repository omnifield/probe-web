log:
  - id: tags-mechanics-moved-to-packages-skin-log
    type: plan
    date: 2026-09-06
    summary: >
      User заметил зону-путаницу: "я перепутал и сказал тебе писать это в мсипи. но это логика
      packages/skin" — витрина (apps/skin/src) ходит за пресетами напрямую в backend/presets, не
      через MCP, значит чистая (без сети) механика тегов, написанная только здесь, заставила бы
      витрину при рендере группировки (свайперы по тегам) дублировать sortTags/checkTags/
      groupByTag. Архитектор написал заявку прямо в чате (сигнатуры, разделение
      чистое/сеть — тот же чертёж, что у checkOutfit(outfit, parts)), user реализовал сам в
      packages/skin/src/tags/index.ts, архитектор проверил (typecheck/build/тесты пакета — все
      зелёные, 65/65) и пересадил потребителя: engine/validate.ts's checkTags — тонкая И/О-обёртка
      над чистой функцией (ходит в service за словарём, зовёт чистую), tools/index.ts зовёт
      sortTags/groupByTag из пакета напрямую. Внешняя сигнатура checkTags(tags, where) не
      изменилась — resolveTags/resolveVariantTags правок не потребовали. Попутно замечено и
      исправлено: tagGroups считался в resolveVariantTags и раньше, но нигде не отдавался наружу —
      теперь часть ответа check_form при ok:true. Проверено живьём после рестарта сервера
      (:3000) — group/дефолт/unknown-tag ведут себя так же, как до переноса.

  - id: form-variant-tags-correction
    type: plan
    date: 2026-09-06
    summary: >
      Попросили затестить теги на реальных кнопках — выяснилось, что первая версия (только
      Outfit.tags) не про тот уровень: "разные кнопки" в ките — это значения ОДНОЙ оси
      recipe.variants внутри ОДНОЙ формы (primary/secondary/tertiary/error/success/warning/
      error-quiet), не разные наряды. Тег на весь наряд смешал бы статусные и не статусные цвета
      в одной записи. Признано архитектором как собственная ошибка проектирования (спроецировал
      "наряд" вместо того, чтобы свериться с оригинальной формулировкой user про "варианты под
      одной сборкой"), не решение user. User подтвердил: Outfit.tags остаётся (пригодится для
      других вопросов навигации), плюс новый слой Form.variantTags — та же функция
      (resolveTags/checkTags), просто разные точки вызова ("мех одна, слои разные"). Реализовано
      и проверено живым сохранением на omnifield-button: error/success/warning → ["status"],
      остальные четыре значения — молча ["default"]. Ожидает от user: какие ИМЕННО 5 значений
      варианта кнопки нужно пометить "статусы" (пока протестированы только 3 явно статусных цвета
      — error/success/warning).

  - id: outfit-tags-agreed-and-shipped
    type: plan
    date: 2026-09-06
    summary: >
      User поднял запрос на группировку: у компонента много скин-вариантов на одну код-сборку
      (сборка+вариант = «вид компонента» со своим именем), плоский список путает и витрину, и
      агента/человека без знания внутреннего устройства при создании скина. Обсудили две формы —
      тег-на-наряде против отдельной сущности-группы со списком участников — user выбрал тег
      («подвязан к нескольким группам» — от наряда к группам, не наоборот) и попросил сразу вести
      словарь тегов, чтобы не разъехались синонимы/опечатки, плюс обязательный тег по умолчанию
      («default»), если ничего не сформулировано. Реализация в один заход: kind:"tag" — пятый вид
      пресета (реестр имён, backend/presets и так не толкует kind), Outfit.tags?: string[],
      resolveTags/checkTags (tools/index.ts + engine/validate.ts) подставляют default и сверяют
      со словарём в check_outfit/save_preset. Проверено живьём реальным round-trip (не только
      typecheck): дефолт молча берёт "default", известный тег проходит, неизвестный даёт
      unknown-tag рядом с unknown-palette, кириллица в имени тега отказывает bad_name (тот же
      slug-формат, что у любого name службы). Фильтр list_presets по тегу — сознательно не сделан
      в этот же заход (нужно читать state каждой записи, не только лёгкий конверт) — Backlog.

  - id: genus-service-group-mcp-not-new-genus
    type: plan
    date: 2026-09-06
    summary: >
      Архитектор разобрал доку этой зоны на ревью с user — исходное решение (genus "mcp" как
      НОВЫЙ жанр, записи skin-mcp-mcp-genus-doc-rewrite/mcp-genus-readme-first-pilot ниже)
      оказалось неверным. Дословно от user: «я предлагаю ген сервис, а тип мсипи!.. сама суть
      мсипи должна быть в общаке, так как он не единственный, а первый». Прецедент той же формы —
      genus "feature" у backend/presets переименован в genus "service" раньше по той же причине
      (genus называет модель потребления — свой процесс/сеть/протокол против импорта, — не имя
      протокола/технологии сверху неё). Итог: genus этой зоны — service (как backend/presets),
      MCP — устоявшаяся ПОДГРУППА внутри genus service (корневой README.md, «Правила для
      шаблонов», новый абзац + WARNING), эта зона — первый пилот ПОДГРУППЫ, backend/presets
      остаётся общим пилотом genus. Поправлены: шапка (`🏷️ mcp · 🧬 service`, было
      `🏷️ skin · 🧬 mcp`), абзац «Главное», первый вопрос FAQ.md (посыл целиком пересобран под
      группу, не genus). Домен-специфичный контент (тулы, engine/, IO, Сборки, Рецепт) не тронут
      — он не зависел от genus-решения. Старые записи лога ниже не переписаны — они верно
      описывают решение, принятое НА ТОТ МОМЕНТ, это его правка, не отмена истории.

  - id: src-layout-two-corrections
    type: plan
    date: 2026-09-06
    summary: >
      Первый проход doc rewrite оставил код как есть — шесть файлов плоско в src/
      (kit/mechanics/store/validate/tools/server.ts). User указал на корневое правило репозитория
      (README.md: "никто не пишет россыпь файлов в корне") и попросил свой стиль для genus mcp.
      Первое предложение — server.ts и tools.ts как два фиксированных файла в корне, остальное в
      engine/ — user поправил ещё раз: "барел в корне есть", то есть даже server и tools должны
      быть каталогами со своим index.ts, а не файлами-исключениями. Итог — src/index.ts (барель,
      export * from "./server/index.js") + server/, tools/, engine/, у каждого свой index.ts.
      package.json start/dev теперь указывают на src/index.ts. Проверено живьём после переноса:
      typecheck зелёный, реальный HTTP tools/call (list_components) через новую структуру отвечает
      isError:false с полным списком компонентов.

  - id: reference-skins-per-component-agreed
    type: plan
    date: 2026-09-06
    summary: >
      Внешний агент (первый реальный потребитель через HTTP) дал фидбек по итогам первой пробы:
      инструменты устраивают, авторизация пока не критична (работаем внутри команды), но по
      созданию скинов — у него нет примеров, кроме пары кнопок/аккордеонов, и нет общего понимания
      домена (без словаря терминов "аккордеон" в промпте не обязательно читается как UI-виджет).
      User предложил не грузить внешнего агента доками сейчас, а сначала пройти ВСЕ ~31 компонент
      кита по одному, сделать несколько эталонных вариантов на каждый — заодно проверить живьём
      механику компонентов (не только скин), многие из которых вообще не потрогали живым кликом.
      Разделение труда: user правит сами компоненты (entity/анатомия) в ките при находках, эта
      зона (я) — только MCP-сторона; playground/рецепт/сборка компонентов — отдельная работа,
      начнётся после ревью этой доки.

  - id: skin-mcp-mcp-genus-doc-rewrite
    type: plan
    date: 2026-09-06
