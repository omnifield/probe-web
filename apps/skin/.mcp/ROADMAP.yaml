  - category: Наполнение
    items:
      - id: content-kind-and-tools
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "save_content/list_content/get_content — реальные данные вместо zocker-мока"
        description: |
          Означает: kind:"content" (седьмой вид, backend/presets по-прежнему не толкует kind —
          бесплатно) хранит {component, data} — реальные, curated данные для наполнения компонента
          при живом просмотре (browser_navigate), не абстрактный лорем-ипсум. save_content сверяет
          data с io-схемой компонента (get_passport().io.input, через zod safeParse) ДО записи —
          несовпадение отказывает флавом с адресом поля (не тихая запись мусора), у компонента без
          entity/io.ts (table — свои props, не bind по IO) сверять нечем, проходит без проверки.
          list_content — постранично, сразу с содержимым, необязательный фильтр по component.
          Причина: живая стилизация компонентов показала, что часть визуальных багов (переносы,
          обрезки при разной длине текста, кириллица) не ловится случайным zocker-значением — нужны
          настоящие, в нашем контексте, данные, и хранить их в службе пресетов дешевле, чем таскать
          с собой пакет с текстовым контентом (тот же довод, что уже был у tag/feedback — не плодить
          npm-пакеты ради данных). Осознанно ЛЁГКИЙ первый заход, не модель движка — см. FAQ.md,
          развилка "kind+тулы сейчас / Content в packages/skin/model сразу" решена в пользу первого.
          Проверено живьём: валидные данные (avatar, {fallback,alt}) сохранены и прочитаны обратно,
          невалидные (avatar без обязательного fallback) отказаны флавом с точным полем, компонент
          без io-схемы (table) прошёл без проверки, list_content с фильтром по component отдал
          только нужное — все тестовые записи после проверки удалены из службы.

      - id: content-replaces-zocker-in-check-assembly
        type: feature
