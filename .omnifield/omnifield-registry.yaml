# Схема отгрузки постройки — орган решения «что отгружаем и куда» (tasker:BASER2-270).
#
# Живёт в клоне, а не на локации, по природе вещи: склад переживает остановку контейнера,
# потому что лежит на участке; эти решения переживают ПЕРЕСОЗДАНИЕ, потому что лежат здесь.
# Пересборка 2026-08-10 унесла и магазин, и склад — а партия, объявленная тут, приедет
# вместе с клоном и не потребует ни одной ручной настройки.
#
# Инструмент этот файл читает, но никогда в него не пишет: он наш.

# Производство отгружает свою базу соседям по локации — да, магазин нужен.
shop: true

# ПАРТИЯ — ровно то, что уезжает. Не «всё, что собралось».
#
# Шесть пакетов базы, порядок по зависимостям: сперва то, что ни от кого не зависит,
# следом потребители. Обвес идёт последним — он ставит остальных потребителю.
#
# Зон `products/` здесь НЕТ и быть не должно: контракт kb:PROBEWEB-5 запрещает их публикацию,
# пока они стоят в этом репозитории. Имя, которое уехало, занято навсегда (kb:WORLD-9), а
# `products/` уедут отдельными продуктами — опубликовав их сейчас, мы займём их будущие имена
# сами у себя. Обе зоны вдобавок объявлены `private: true`, то есть отказ придёт и от npm.
#
# `apps/reference` — приложение, а не поставка: гейт сборки всей цепочки, тоже `private: true`.
batch:
  - packages/build
  - packages/lint
  - packages/style
  - packages/runtime
  - packages/ui
  - packages/starter

# Куда. Магазин ЭТОЙ локации — обратимо: не понравилось, снёс склад и переложил заново.
# Публичный магазин комьюнити сюда не пишем: выпуск наружу необратим, а выпуск 0.2.0 ещё не
# подтверждён чужой локацией (kb:WORLD-32) — критерий приёмки в tasker:PROBEWEB-7 требует,
# чтобы пустая локация повторила живую страницу из опубликованных пакетов. Это и проверяем.
address: location
