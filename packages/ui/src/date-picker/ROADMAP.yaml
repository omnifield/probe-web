# Дорожная карта пикера даты — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Каждая ЧАСТЬ анатомии (25 штук) — тонкая обёртка, типизирована как проп компонента-
# первоисточника напрямую один в один, пропс-серфейс сверен целиком инструментом
# `mcp__ark-ui__get_component_props`, 2026-09-04. Но `DatePickerContext`/`useDatePickerContext`/
# `useDatePicker` кит не реэкспортирует вовсе — см. категорию «Не построено» ниже.

categories:
  - category: Основа
    items:
      - id: single-range-multiple
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Одна дата, диапазон, несколько дат
        description: |
          Означает: `selectionMode` переключает пикер между одной датой, диапазоном «от — до» (два
          `DatePickerInput`) и набором отдельных дат (`maxSelectedDates` ограничивает количество).
          Реализация: готовое состояние компонента-первоисточника, базовый режим (`single`)
          проверен тестом; `range`/`multiple` документированы примерами, отдельно не проверены
          функциональным тестом при этом аудите.

      - id: value-text-placeholder-render
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Готовый текст значения — плейсхолдер, разделитель, своя разметка на дату
        description: |
          Означает: `DatePickerValueText` сам форматирует выбранные даты текстом (`placeholder`
          пока пусто, `separator` между несколькими), либо принимает `children` рендер-пропом — по
          одной дате за раз, с `remove()` для конкретно этой даты. Не был показан примером README
          до этого аудита.
          Реализация: готовый проп/паттерн компонента-первоисточника, `placeholder` проверен
          тестом; `separator` и рендер-проп с `remove()` — тем же механизмом, отдельно не
          проверены.

      - id: month-year-views
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Виды месяца и года
        description: |
          Означает: `viewTrigger` переключает сетку день → месяц → год и обратно, `minView`/
          `maxView` ограничивают, до какого вида можно углубиться/подняться.
          Реализация: готовое поведение компонента-первоисточника — технически проброшено, не
          проверено отдельным тестом при аудите 2026-09-04.

  - category: Тонкая настройка
    items:
      - id: min-max-unavailable
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Ограничение диапазона и точечная недоступность дат
        description: |
          Означает: `min`/`max` жёстко ограничивают выбираемый диапазон, `isDateUnavailable`
          исключает отдельные даты внутри него (например, выходные).
          Реализация: готовый проп компонента-первоисточника — технически проброшен, документирован
          примером, отдельно не проверен тестом при аудите 2026-09-04.

      - id: inline-mode
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Инлайн-режим без плавающей панели
        description: |
          Означает: `inline` полностью снимает поведение попапа — `positioner`/`content` остаются
          в потоке страницы всегда, вместо `open`/`closed` несут `data-inline`.
          Реализация: готовый проп компонента-первоисточника — технически проброшен, не проверен
          отдельным тестом при аудите 2026-09-04.

      - id: week-numbers
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Номера недели
        description: |
          Означает: `showWeekNumbers` добавляет ведущий столбец, который рисуют два реальных,
          отдельно экспортированных компонента (`DatePickerWeekNumberCell`/`HeaderCell`), делящие
          адрес `tableCell` вместо собственного (см. `[!NOTE]` в README).
          Реализация: готовый проп/компоненты компонента-первоисточника — технически проброшены, не
          проверены отдельным тестом при аудите 2026-09-04.

      - id: presets
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Именованные пресеты диапазона
        description: |
          Означает: `presetTrigger` прыгает сразу к именованному диапазону (например, «последние 7
          дней»), не требуя клика по каждой границе диапазона отдельно.
          Реализация: готовая часть компонента-первоисточника — технически проброшена,
          документирована примером, не проверена отдельным тестом при аудите 2026-09-04.

  - category: Не построено
    items:
      - id: context-not-reexported
        type: feature
        priority: Medium
        milestone: null
        name: Императивный API пикера наружу
        description: |
          Означает: доступ к состоянию машины и методам вроде программного перехода к дате,
          управления фокусом внутри сетки, очистки значения и форматированию из объекта API —
          тот же класс возможностей, что `carousel` теряет без своего `Context`.
          Реализация: ЧЕСТНЫЙ пробел, не тихо забытый — компонент-первоисточник отдаёт это через
          `DatePickerContext`/`useDatePickerContext`/`useDatePicker`, но ни один из них не входит в
          `components/index.ts` кита. Сейчас единственный способ получить этот объект —
          импортировать его напрямую из `@ark-ui/solid/date-picker`, в обход кита.

# Журнал решений.
log:
  - id: parts-thin-context-missing
    type: plan
    date: 2026-09-04
    summary: >
      Каждая из 25 частей анатомии принимает пропсы компонента-первоисточника один в один —
      инструмент `mcp__ark-ui__get_component_props` не вскрыл ни одного необёрнутого соседнего
      КОМПОНЕНТА (сами `WeekNumberCell`/`WeekNumberHeaderCell` уже экспортированы и объяснены в
      README — реальные, но делят адрес `tableCell`, не отдельная часть). Отдельно от частей есть
      императивный `DatePickerContext`, который кит не реэкспортирует вовсе — тот же класс находки,
      что у `carousel`. Вынесено отдельной категорией «Не построено».

  - id: value-text-gap-closed
    type: plan
    date: 2026-09-04
    summary: >
      `DatePickerValueText`'s `placeholder`/`separator`/рендер-проп с `remove()` были доступны
      через прямой проброс типа, но не показаны ни одним примером README до этого аудита —
      добавлен пример и тест на `placeholder`.
