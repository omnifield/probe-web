<!doctype html>
<!-- `dark` — ТЁМНАЯ пара токенов стилевого слоя (`themes.css`: `:root` светлая, `.dark` тёмная).
     Классом в разметке, а не переключателем на JS: тема встаёт до первого кадра, и вспышки
     светлого экрана перед загрузкой скрипта не бывает. Стенд не привозит ни одного цвета
     литералом — только токены, — поэтому смена пары красит его целиком. -->
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Стенд зоны tables — переходник и фильтры</title>
  </head>
  <body>
    <!-- #root — часть замороженной поверхности (kb:PROBEWEB-4): mount() ищет точку сам. -->
    <div id="root"></div>
    <script type="module" src="/src/playground/main.tsx"></script>
  </body>
</html>
