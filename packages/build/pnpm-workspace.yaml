# Тестовое приложение подключает пакет как УСТАНОВЛЕННЫЙ (`workspace:*` → симлинк на корень),
# а не относительным путём в исходники. Иначе сборочный тест проверял бы файлы на диске, а не
# то, ради чего он есть: что приложение поднимается на разрешении по `exports`.
packages:
  - test/fixture
  - test/fixture-dep

# Постинсталл-скрипты pnpm по умолчанию не пускает; esbuild без своего бинаря не работает.
onlyBuiltDependencies:
  - esbuild
