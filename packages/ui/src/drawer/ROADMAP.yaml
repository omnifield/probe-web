# Дорожная карта шторки — формат тот же, что у остальных компонентов кита (см. table/ROADMAP.yaml,
# шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# ПОЧТИ полностью тонкая обёртка — каждая часть типизирована как проп компонента-первоисточника
# напрямую (`DrawerProps = ArkRootProps` и так далее для всех десяти частей), пропс-серфейс сверен
# целиком инструментом `mcp__ark-ui__get_component_props`, 2026-09-04. Единственный настоящий
# пробел — НЕ проброшенные пропсы, а два вовсе не обёрнутых компонента-первоисточника (см. ниже,
# категория «Не построено»).

categories:
  - category: Основа
    items:
      - id: swipe-direction
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Выезд с любого края
        description: |
          Означает: `swipeDirection` — с какого края шторка выезжает и куда закрывается свайпом,
          `"start"`/`"end"` переводятся в физическую сторону по направлению письма.
          Реализация: готовый проп компонента-первоисточника. По умолчанию (`down`) проверено
          тестом, остальные три направления технически проброшены тем же пропом — отдельно не
          проверены при этом аудите.

      - id: multiple-triggers
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Несколько триггеров на одну шторку
        description: |
          Означает: несколько `DrawerTrigger` с разными `value` делят одну шторку — клик по любому
          открывает её и помечает себя как `current` (`data-current`), какой из них её открыл.
          Реализация: готовый проп компонента-первоисточника, проверено тестом.

      - id: snap-points
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Точки привязки
        description: |
          Означает: `snapPoints`/`defaultSnapPoint`/`snapPoint` — промежуточные высоты, между
          которыми можно перетащить шторку за ручку, не просто открыть/закрыть полностью.
          Реализация: готовый проп компонента-первоисточника — технически проброшен, НЕ проверен
          отдельным тестом при аудите 2026-09-04 (требует симуляции реального жеста).

      - id: modal-toggle
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Немодальная шторка
        description: |
          Означает: `modal={false}` разрешает взаимодействовать с остальной страницей, пока шторка
          открыта — вместе со `swipeArea` даёт повторно открыть закрытую шторку свайпом с края.
          Реализация: готовый проп компонента-первоисточника — технически проброшен, не проверен
          отдельным тестом при аудите 2026-09-04.

      - id: content-draggable-toggle
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Отключение перетаскивания за содержимое
        description: |
          Означает: `draggable={false}` на `DrawerContent` разрешает тащить шторку ТОЛЬКО за
          `grabber`, не за произвольное место внутри содержимого — не задокументирован в README на
          момент аудита.
          Реализация: готовый проп компонента-первоисточника — технически проброшен, не проверен
          отдельным тестом при аудите 2026-09-04.

  - category: Не построено
    items:
      - id: nested-drawer-stack-visuals
        type: feature
        priority: Medium
        milestone: null
        name: Визуальный стек вложенных шторок
        description: |
          Означает: когда одна шторка открывает другую поверх себя, нижняя должна визуально
          отступить и притемниться (тот же эффект, что у стопки карт) — координируется общим
          `Drawer.Stack`, который несёт два собственных, отдельных компонента-первоисточника,
          `Drawer.Indent`/`Drawer.IndentBackground`, и проп `stack` на корне.
          Реализация: ЧЕСТНЫЙ пробел, не тихо забытый — паспорт УЖЕ объявляет состояния
          `nested-drawer-open`/`nested-drawer-swiping` и переменную `--nested-drawers` на `content`
          (компонент-первоисточник пишет их сам, как только шторки вложены), но кит не оборачивает
          ни `Indent`/`IndentBackground`, ни `Stack` — без них у потребителя нет способа реально
          собрать сценарий с вложенными шторками, чтобы эти состояния вообще появились.

# Журнал решений.
log:
  - id: thin-wrapper-with-two-unwrapped-siblings
    type: plan
    date: 2026-09-04
    summary: >
      Десять обёрнутых частей — прямой проброс пропсов компонента-первоисточника один в один, тот
      же паттерн, что у accordion/avatar/toggle-семьи. Но инструмент `mcp__ark-ui__get_component_
      props` вскрыл ДВА вовсе не обёрнутых компонента-первоисточника (`Indent`/`IndentBackground`,
      плюс отдельный `Stack`) — тот же класс находки, что unwrapped `CheckboxGroup` у чекбокса,
      только здесь пробел мешает реализовать состояния, которые паспорт УЖЕ заявляет
      (`nested-drawer-open`/`nested-drawer-swiping`). Честно вынесено отдельной категорией, не
      смешано с «Основой».
