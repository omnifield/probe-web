# Дорожная карта аккордеона — формат тот же, что у table/diagram (см. table/ROADMAP.yaml, шапка).
# Этот файл — единственный источник правды: статус проставляется рядом с работой, в момент когда
# она сделана.
#
# ОТЛИЧИЕ ОТ table/diagram: там кит строит анатомию/движок сам (TanStack/d3), фичи добавляются
# волнами. Здесь пропс-серфейс полный, проверен на 2026-09-04 —
# компонент не растёт по частям, он уже полный. Фичового бэклога нет. Пункты ниже документируют,
# что реально есть, не план на будущее.

categories:
  - category: Раскрытие
    items:
      - id: disclosure
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Раскрытие/закрытие раздела
        description: |
          Означает: клик по control раскрывает/закрывает свой content, одиночный или
          множественный режим (multiple).
          Реализация: состояние, клавиатура, aria — всё целиком готовое.

      - id: collapsible
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Закрытие последнего раскрытого
        description: |
          Означает: можно закрыть единственный раскрытый раздел, оставив гармошку полностью
          закрытой (не нужно, если multiple уже включён — dependsOn в settings это выражает).
          Реализация: обычный проброс проверенной настройки `collapsible`.

      - id: orientation
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Ориентация (вертикальная/горизонтальная)
        description: |
          Означает: разделы сверху вниз или слева направо — влияет на клавиатурную навигацию и
          aria, не только на CSS.
          Реализация: настройка паспорта, пробрасывает в data-orientation.

  - category: Управление состоянием
    items:
      - id: controlled-value
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Управляемое/неуправляемое значение
        description: |
          Означает: value/defaultValue/onValueChange — тот же управляемый/неуправляемый паттерн,
          что у остальных компонентов кита.
          Реализация: обычное поведение компонента, проброшено без обвязки.

      - id: lazy-mount
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Отложенный монтаж / размонтирование при закрытии
        description: |
          Означает: lazyMount/unmountOnExit — content не существует в DOM, пока раздел не
          раскрыт хотя бы раз (или вообще не раскрыт).
          Реализация: обычное поведение компонента, проброшено без обвязки.

# Журнал решений — тот же формат, что у table/diagram.
log:
  - id: no-forward-roadmap-full-surface
    type: plan
    date: 2026-09-04
    summary: >
      В отличие от table/diagram (own-built, растут волнами фич), у аккордеона пропс-серфейс
      полный: аудит 2026-09-04 не нашёл ни одной реальной возможности, которой кит не даёт.
      Пункты этого файла — документация того, что реально есть, не план того, что предстоит
      построить. Новый пункт здесь появится, только если появится реальный запрос на
      функциональность, которой сейчас нет вовсе (например, drag-переупорядочивание разделов) —
      таких запросов на 2026-09-04 не было.
