# Дорожная карта конфига Vite — формат тот же, что у остальных тем зоны. Единственный источник
# правды: статус проставляется рядом с работой.

categories:
  - category: Приложение
    items:
      - id: define-config
        type: feature
        status: Done
        priority: High
        milestone: null
        name: defineConfig() — конфиг приложения
        description: |
          Означает: `vite.config.ts` потребителя — три строки, версия Vite и `vite-plugin-solid`
          решаются здесь.

      - id: dev-source-alias
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Соседи по воркспейсу видны исходниками
        description: |
          Означает: правка исходника соседа доезжает до браузера без пересборки — дев-сервер
          не отдаёт вчерашний `dist` (`PWEB-1`).
          Реализация: алиас, посчитанный машинно по признаку симлинка из `node_modules`, не
          список имён — см. FAQ.md.

      - id: generated-css-on-request
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: CSS соседа порождается на запрос
        description: |
          Означает: `dist/css/*.css` прошлой сборки не показывается приложению — ни на свежем
          клоне (где его нет вовсе), ни устаревшим после правки перечня в коде соседа
          (`PWEB-20`/`PWEB-21`).
          Реализация: способность соседа читается с его `exports` (подпуть `./generate`),
          порождатель грузится через `ssrLoadModule`, `hotUpdate` достраивает связь.

      - id: host-true
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: server.host — все интерфейсы
        description: |
          Означает: дев-сервер в контейнере виден и с хоста, и пульту, проверяющему живость по
          `127.0.0.1` — `localhost` резолвится в `::1` и до контейнера не доходит.

  - category: Библиотека
    items:
      - id: define-library-config
        type: feature
        status: Done
        priority: High
        milestone: null
        name: defineLibraryConfig() — конфиг библиотеки
        description: |
          Означает: `ui`/`skin`/`assembly` и подобные зоны не носят собственный
          `scripts/build.mjs` поверх esbuild — один держатель вместо трёх копий, которые
          разошлись бы незамеченными.

      - id: raw-jsx-branch
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Ветка solid (сырой JSX) поверх Vite
        description: |
          Означает: вход с `solid: true` уезжает двумя ветками — `dist/<name>.js` (Vite,
          разобранный JSX) и `dist/<name>.jsx` (esbuild, сырой JSX для условия `solid`).
          Реализация: esbuild `jsx: "preserve"` в `closeBundle`, потому что `oxc.jsx: "preserve"`
          в library mode Vite 8 не работает вовсе — см. FAQ.md.

  - category: Установка
    items:
      - id: prepare-lifecycle
        type: feature
        status: Done
        priority: High
        milestone: null
        name: prepare — оснастка собирается на установке
        description: |
          Означает: свежий клон поднимается `pnpm install`-ом без отдельной команды сборки
          оснастки. Единственная зона репозитория с этим скриптом (`PWEB-16`) — остальные
          пакеты видны через исходники алиасом, и собирать их на установке значило бы вернуть
          ровно ту вчерашнюю сборку, от которой уходит вся тема.

log:
  - id: alias-not-exports-condition
    type: plan
    date: 2026-08-19
    summary: >
      Соседи подменяются алиасом Vite, а не условием `development` в их собственном `exports` —
      оба способа рыночные (дока Vite, discussions #17417/#6684), но условие в `exports` меняет
      публикуемую поверхность соседа (обязывает класть исходники в тарбол). Это отдельное
      решение о поставке (`PWEB-8`), не внутрь починки дев-цикла.

  - id: host-true-measured
    type: plan
    date: 2026-08-19
    summary: >
      `server.host: true` добавлен после того, как зона показывалась мёртвой будучи поднятой
      (`localhost` → `::1`, контейнер недоступен ни с хоста, ни пульту) — замерено на
      `apps/reference`, перенесено из флага команды запуска в конфиг дев-сервера.
