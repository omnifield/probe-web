# Дорожная карта типографики — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Первый компонент кита, построенный с нуля именно потому, что ни у Ark, ни у Kobalte нет своего
# примитива для вывода текста — проверено по спискам компонентов обеих библиотек, 2026-09-06.
# САМЫЙ ПРОСТОЙ компонент кита, тот же рецепт, что у Surface — один узел, без состояний, весь вид
# через ось вариаций.

categories:
  - category: Основа
    items:
      - id: polymorphic-tag
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Смена тега (as), независимая от вида
        description: |
          Означает: `<Typography as="h1" data-variant="caption">` рисует `<h1>` с видом `caption`
          — тег и вид выбираются раздельно, ни один не навязывает другой.
          Реализация: полиморфный рендер (тот же приём, что у `Surface`), проверено тестом.

      - id: variant-axis
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Ось видов несёт весь вид целиком
        description: |
          Означает: `data-variant` — единственный способ дать тексту вид (`body`/`heading`/
          `caption` в проверочном рецепте, реальные имена решает продукт), состояний у компонента
          нет вовсе.
          Реализация: обычная ось паспорта, без собственных имён вариаций в ките.

# Журнал решений.
log:
  - id: no-ark-no-kobalte-primitive
    type: plan
    date: 2026-09-06
    summary: >
      User спросил, есть ли готовый примитив для типографики у Ark/Kobalte, прежде чем строить
      свой. Проверено по обоим спискам компонентов: у `@ark-ui/solid` вывода текста нет вовсе, у
      `@kobalte/core` есть только `text-field` (поле ввода, не про вывод). Построено с нуля, тем же
      рецептом, что уже применён к `Surface` — полиморфный тег, ноль стилей по умолчанию, вид через
      `data-variant`.
