# Дорожная карта карусели — формат тот же, что у остальных компонентов кита (см. table/ROADMAP.yaml,
# шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Каждая ЧАСТЬ анатомии — тонкая обёртка, типизирована как проп компонента-первоисточника напрямую
# один в один, пропс-серфейс сверен целиком инструментом `mcp__ark-ui__get_component_props`,
# 2026-09-04. Но `CarouselContext`/`useCarouselContext`/`useCarousel` кит не реэкспортирует вовсе —
# см. категорию «Не построено» ниже.

categories:
  - category: Основа
    items:
      - id: slide-navigation
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Листание стрелками и точками
        description: |
          Означает: `prevTrigger`/`nextTrigger` листают на страницу назад/вперёд, клик по точке
          индикатора прыгает сразу на свой слайд.
          Реализация: готовое поведение компонента-первоисточника — ФАКТИЧЕСКИЙ переход между
          страницами определяется через `IntersectionObserver` после настоящей прокрутки, поэтому
          НЕ проверен функциональным тестом при этом аудите (см. журнал ниже, честное ограничение
          среды, не пробел компонента). Начальная страница (`defaultPage`) проверена тестом.

      - id: autoplay
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Автопрокрутка с переключателем
        description: |
          Означает: `autoplay` заставляет карусель листать саму себя, `autoplayTrigger` ставит на
          паузу и возобновляет, `pressed` отражает текущее состояние переключателя.
          Реализация: готовый проп/часть компонента-первоисточника — технически проброшены, не
          проверены отдельным тестом при аудите 2026-09-04 (та же причина, что и у навигации —
          требует реального таймера и прокрутки).

  - category: Тонкая настройка
    items:
      - id: slides-per-page
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Несколько слайдов на экране одновременно
        description: |
          Означает: `slidesPerPage`/`slidesPerMove` — сколько слайдов видно за раз и сколько
          страниц пролистывается за один клик по стрелке.
          Реализация: готовый проп компонента-первоисточника — технически проброшен, не проверен
          отдельным тестом при аудите 2026-09-04.

      - id: spacing-and-padding
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Отступ между слайдами и полями области показа
        description: |
          Означает: `spacing` — зазор между слайдами, `padding` — лишнее пространство по краям
          области показа, чтобы соседние слайды были частично видны.
          Реализация: готовый проп компонента-первоисточника — технически проброшен, не проверен
          отдельным тестом при аудите 2026-09-04.

      - id: snap-tuning
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Строгость прилипания к слайду
        description: |
          Означает: `snapType` (`mandatory`/`proximity`) и `Item`'s `snapAlign` — насколько жёстко
          прокрутка прилипает к границе слайда и с какого его края.
          Реализация: готовый проп компонента-первоисточника — технически проброшен, не проверен
          отдельным тестом при аудите 2026-09-04.

      - id: readonly-indicator
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Индикатор только для чтения
        description: |
          Означает: `readOnly` на отдельном `CarouselIndicator` — точка показывает текущую
          страницу, но клик по ней не переключает слайд.
          Реализация: готовый проп компонента-первоисточника, паспорт уже адресует состояние
          `readonly` — не проверено отдельным тестом (та же причина, что у навигации: клик по
          индикатору проверяется через ту же навигацию, которая недоступна в этой среде).

      - id: variable-width-slides
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Слайды переменной ширины
        description: |
          Означает: `autoSize` отключает фиксированную раскладку слайдов — каждый занимает
          собственную естественную ширину, а не долю от `slidesPerPage`.
          Реализация: готовый проп компонента-первоисточника — технически проброшен, не проверен
          отдельным тестом при аудите 2026-09-04.

  - category: Не построено
    items:
      - id: context-not-reexported
        type: feature
        priority: Medium
        milestone: null
        name: Императивный API карусели наружу
        description: |
          Означает: доступ к `page`/`isPlaying`/`canScrollNext`/`canScrollPrev`, а также к методам
          `scrollToIndex`/`scrollTo`/`scrollNext`/`scrollPrev`/`play`/`pause`/`getProgressText`/
          `isInView` — всё, что реально нужно, чтобы собрать живой `progressText`, кнопку «перейти
          к слайду N», паузу по наведению или свою индикацию воспроизведения автопрокрутки.
          Реализация: ЧЕСТНЫЙ пробел, не тихо забытый — компонент-первоисточник отдаёт всё это через
          `CarouselContext`/`useCarouselContext`/`useCarousel`, но ни один из них не входит в
          `components/index.ts` кита. Сейчас единственный способ получить этот объект — импортировать
          его напрямую из `@ark-ui/solid/carousel`, в обход кита.

# Журнал решений.
log:
  - id: navigation-untestable-in-jsdom
    type: plan
    date: 2026-09-04
    summary: >
      Клик по `prevTrigger`/`nextTrigger`/`indicator` в теории должен листать страницу, но реальная
      машина компонента-первоисточника узнаёт текущую страницу через `IntersectionObserver` ПОСЛЕ
      настоящей прокрутки — jsdom не выполняет ни то, ни другое (`Element.scrollTo` — заглушка,
      `IntersectionObserver` — заглушка без единого реального колбэка). Проверено эмпирически:
      клик по `nextTrigger` не меняет ни `prevTrigger`'s `disabled`, ни `data-current` индикаторов
      в этой среде. Честное ограничение окружения, не повод писать тест, который ничего не
      проверяет, и не повод молчать о факте — начальная страница (`defaultPage`) остаётся
      единственным, что здесь реально проверяемо без настоящего браузера.

  - id: parts-thin-context-missing
    type: plan
    date: 2026-09-04
    summary: >
      Каждая часть анатомии принимает пропсы компонента-первоисточника один в один — инструмент
      `mcp__ark-ui__get_component_props` не вскрыл ни одного необёрнутого соседнего КОМПОНЕНТА. Но
      отдельно от частей анатомии есть императивный API (`CarouselContext`/`useCarouselContext`),
      который кит не реэкспортирует вовсе — тот же класс находки, что unwrapped `CheckboxGroup` у
      чекбокса или `Indent`/`IndentBackground` у шторки, только здесь это не DOM-часть, а канал
      данных. Вынесено отдельной категорией «Не построено», не смешано с «Основой».
