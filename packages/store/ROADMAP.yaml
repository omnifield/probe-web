# Дорожная карта @web-core/store — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/build и packages/ui/src/table (categories → items, log → журнал решений); без
# milestones — у пакета нет освоенной поставки с датами релиза, только сделанное и открытое.

categories:
  - category: Плоское хранилище
    items:
      - id: flat-store
        type: feature
        status: Done
        priority: High
        milestone: null
        name: createStore/createAtom/createReducerAtom + солид-хуки
        description: |
          Означает: единая точка резолва @xstate/store + @xstate/store-solid — createStore,
          createAtom, createAtomConfig, createReducerAtom, useSelector, useStore, useAtom,
          useAtomState. Приложение не импортирует @xstate/store*/@xstate/solid напрямую.

      - id: create-action-store
        type: feature
        status: Done
        priority: High
        milestone: null
        name: createActionStore — доменный стор (state + actions + selectors)
        description: |
          Означает: createActionStore(initialValue, ({setState, get}) => actions, options?) —
          createAtom под капотом, actionsFactory собирается одним вызовом вместо ручной сборки
          {get, actions}. Возвращает ReadonlyAtom<T> & {actions} — .set() не публичный, actions
          единственный путь записи не только по конвенции, но структурно. Читается тем же
          useAtom(store, selector)/useSelector, что обычный атом. Закрывает разрыв с
          domain-store-recipe: тот был документацией ручной композиции, этот — сам примитив,
          синтаксис один в один с тем, что просил user (@tanstack/store's createStore(initial,
          actionsFactory)). 4 теста в test/action-store.test.tsx.

  - category: Стейт-машины
    items:
      - id: machine-layer
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Подпуть ./machine — полноценный xstate
        description: |
          Означает: createMachine/setup/assign/fromPromise/guards/акторы + useMachine/useActor/
          useActorRef/fromActorRef. xstate и @xstate/solid — опциональные peer, не подмешаны в
          корневой `.`.

  - category: Аддоны
    items:
      - id: addons-subpaths
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: ./persist, ./undo, ./reset, ./validate
        description: |
          Означает: реэкспорт @xstate/store/{persist,undo,reset,validate} отдельными подпутями —
          @xstate/store НАША зависимость, без реэкспорта её подпути недостижимы строгим pnpm.

      - id: persist-atom
        type: feature
        status: Done
        priority: High
        milestone: null
        name: persistAtom — persist для createAtom (localStorage/sessionStorage)
        description: |
          Означает: @web-core/store/persist экспортирует persistAtom(atom, {name, storage?,
          serialize?, deserialize?}) — гидратация из storage при вызове + подписка на .set() для
          записи. Закрывает дыру: upstream persist() из @xstate/store — StoreExtension, вешается
          через .with() на createStore, у createAtom .with нет вовсе. До этого пункта потребители
          (apps/skin/entities/openapi/model/endpoint/store.ts) вручную писали
          localStorage.getItem/setItem + JSON.parse/stringify на каждый персистентный атом.
          Local/session переключаются готовым createJSONStorage(() => sessionStorage) из того же
          подпути — новой опции под них не заводили. 5 тестов в test/persist.test.tsx.

      - id: persist-atom-indexeddb
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: persistAtom — асинхронный storage (IndexedDB)
        description: |
          Означает: persist-atom сегодня читает storage.getItem синхронно — если он вернёт
          Promise (async-адаптер вроде IndexedDB), гидратация молча не происходит (typeof raw
          === "string" не пропускает Promise). Когда IndexedDB понадобится реально — либо
          persistAtom научится await'ить getItem и гидрировать асинхронно (сигнатура персиста
          при этом меняется — вызывающий код должен знать, что атом не готов сразу), либо рядом
          появится отдельный helper по образцу rehydrateStore у @xstate/store/persist.

  - category: Ресурс — синхронно и асинхронно
    items:
      - id: create-async-atom-broken
        type: bug
        status: Done
        priority: Critical
        milestone: null
        name: "createAsyncAtom из @xstate/store теряет зависимости после первого резолва"
        description: |
          Означает: подтверждено прогоном на голом @xstate/store@4.2.3 без Solid — атом,
          получивший значение хотя бы раз, больше не реагирует на смену входа, которым сам же
          был инициирован. Не реэкспортируется — локальный export function createAsyncAtom():
          never перекрывает звёздочный реэкспорт (именованный экспорт побеждает у ES-модулей при
          коллизии имён), вызов по апстримной сигнатуре падает на тайпчеке. Разбор — FAQ.md.

      - id: create-resource-atom
        type: feature
        status: Done
        priority: Critical
        milestone: null
        name: createResourceAtom — один флоу для sync и async
        description: |
          Означает: createResourceAtom(fetcher) без ключа и createResourceAtom(source, fetcher)
          с ключом (Solid-аксессор) отдают один и тот же {status,data,error}. Реактивность на
          Solid createEffect, не на автотрекинге @xstate/store. Race-guard (AbortController,
          runId) на смену ключа до резолва предыдущего запроса. 4 теста в
          test/resource.test.tsx.

      - id: create-bound-atom
        type: feature
        status: Done
        priority: High
        milestone: null
        name: createBoundAtom — атом, ведомый внешним Solid-аксессором
        description: |
          Означает: createBoundAtom(source, options?) — писуемый createAtom, значение которого
          обновляется createEffect(() => atom.set(source())) при смене source. Закрывает дыру:
          потребитель (apps/skin/entities/component/model/store.ts, currentComponent/
          currentOutfit, синк с пропом страницы/skin.worn()) писал голый solid createSignal +
          setter, минуя атомы пакета — не было ручки под "атом, толкаемый снаружи". Форма
          подтверждена чужим прецедентом (atomEffect/useAtomEffect у Jotai), не изобретена с нуля
          — разбор в FAQ.md. 4 теста в test/bound.test.tsx.

  - category: Структура пакета
    items:
      - id: theme-per-subpath
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "src/ по темам вместо плоского списка файлов"
        description: |
          Означает: каждый экспортируемый подпуть — своя папка (по образцу packages/build).
          Промежуточный шаг — folder-per-subpath один в один с exports, включая `.` → src/flat/
          — заменён следующим пунктом.

      - id: engine-machine-addons-split
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "src/index.ts (поверхность) + engine/ + machine/ + addons/"
        description: |
          Означает: src/index.ts — один export * from "./engine/index.js", вся логика (реэкспорт
          @xstate/store-solid, createResourceAtom, заглушка createAsyncAtom) — в src/engine/.
          По образцу packages/assembly (index.ts как "поверхность пакета"), но без объединения с
          machine/ — машина остаётся независимым подпутём, не подмешивается в корень.

  - category: Документация
    items:
      - id: readme-engine-template
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: README по общему шаблону "движок" — первый пилот
        description: |
          Означает: Анатомия/Использование/Настройки/Состояния/IO/Сборки/Рецепт заполнены
          фактами без обоснований (обоснования — FAQ.md). IO разделён на явные Вход/Выход по
          запросу после первого прохода одним списком.

      - id: faq-roadmap
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: FAQ.md и ROADMAP.yaml — первое заполнение
        description: |
          Означает: FAQ.md сгруппирован по темам (движок ресурсов / структура пакета / аддоны /
          стейт-машины), каждый ответ со ссылкой на проверку. ROADMAP.yaml — по образцу
          packages/ui/src/table (не по составу полей, по ведению: Done-пункты сразу с описанием,
          log — датированный журнал решений).

      - id: domain-store-recipe
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Рецепт: доменный стор — первая версия, ручная композиция createAtom (заменена create-action-store)"
        description: |
          Означает: первая версия README-рецепта собирала {get, actions} вручную поверх
          createAtom — без структурного запрета на .set() наружу, actions только по конвенции.
          Заведено после предложения перейти на @tanstack/store под паттерн state+actions;
          разбор, почему смена вендора не нужна — в FAQ.md. В README текст рецепта заменён на
          create-action-store: тот же вывод (вендор не нужен), но настоящий примитив вместо
          ручной сборки — синтаксис ближе к тому, что просил user, и .set() закрыт структурно, не
          конвенцией. Пункт оставлен в истории ради лога решения, в README ручной версии больше
          нет.

  - category: Не сделано
    items:
      - id: addons-composition-untested
        type: feature
        status: Backlog
        priority: Low
        milestone: null
        name: Композиция аддонов (.with().with()) не проверена тестом
        description: |
          Означает: пример из README (persist+undoRedo+reset цепочкой) — документация, не проба.
          test/ сегодня проверяет createStore/createMachine/createResourceAtom по отдельности,
          не совмещённые через .with().

log:
  - id: create-action-store-scope
    type: plan
    date: 2026-09-13
    summary: >
      Продолжение domain-store-vs-tanstack: user принёс ещё раз тот же @tanstack/store пример
      (createStore(initial, ({setState, get}) => actions)) и спросил прямо — "наш стор умеет так
      работать?" Честный ответ на тот момент был "нет, только руками" (README показывал ручную
      сборку {get: atom.get, actions: {...}} поверх createAtom) — расхождение между "можно
      добиться того же результата" и "есть такая ручка" запутало user, который отдельно тестировал
      реальным агентом на apps/skin/entities/component/model/store.ts: тот попытался применить
      actions-рецепт к currentComponent/currentOutfit (которые на деле кейс createBoundAtom — их
      никто не "экшенит", они зеркалят проп маршрута) и в процессе притащил обратно голый
      createSignal, задублировав состояние в сигнале и в атоме. Решено закрыть разрыв кодом, не
      объяснением: создан createActionStore (src/engine/action-store.ts) — actionsFactory
      собирается одним вызовом, .set() не публичный (ReadonlyAtom<T> & {actions}), синтаксис
      один в один с примером user. README-рецепт (domain-store-recipe) заменён на реальный
      примитив.

  - id: domain-store-vs-tanstack
    type: plan
    date: 2026-09-13
    summary: >
      user принёс готовое ТЗ (от стороннего источника) на "доменный стор" в стиле Zustand/Pinia —
      state+actions+selectors на @tanstack/store, мотивация "с существующим неудобно работать".
      Прежде чем менять движок, сверено предметно: требования ТЗ (стор без Solid-примитивов,
      Solid только на границе, actions — единственный путь записи, точечные selector-подписки)
      уже достижимы createAtom + объект actions + useAtom(atom, selector) — без нового кода
      пакета. Проверены .d.ts уже лежащих в node_modules @tanstack/store и @tanstack/solid-store:
      тот же класс изоляции от Solid (свой граф зависимостей, alien-signals), тот же пробел
      "внешний аксессор → стор" (закрыт для @xstate/store в create-bound-atom, у TanStack не
      закрыт вообще). Решение: не переходить на TanStack Store — задокументировать существующую
      композицию как рецепт (domain-store-recipe), разбор — в FAQ.md.

  - id: create-bound-atom-scope
    type: plan
    date: 2026-09-13
    summary: >
      Запрошено user по конкретному кейсу: apps/skin/entities/component/model/store.ts синкает
      currentComponent/currentOutfit с пропом showcase-страницы и skin.worn() через голый solid
      createSignal + createEffect(() => setCurrentComponent(props.component)) в самой странице —
      мимо атомов пакета, потому что ручки под "атом, ведомый внешним аксессором" не было.
      Первая мысль (одноразовая функция syncAtom(atom, source)) вызвала сомнение user — "выглядит
      как самопальная ручка внутри важного пакета, который вот-вот начнут активно юзать все".
      Сделан research по существующим атомным экосистемам (Jotai discussions#1487,
      useAtomEffect, atomWithObservable, TanStack Store, nanostores, сам Solid) — подтверждено,
      что "эффект пишет во внешний атом" это и есть устоявшийся в индустрии приём, не костыль;
      универсальной "магической" ручки в ядре ни у кого нет, каждый источник — своя маленькая
      обёртка. Решено оформить как createBoundAtom — конструктор той же фабричной формы, что уже
      есть в пакете (createResourceAtom), не отдельно стоящая утилита.

  - id: persist-atom-scope
    type: plan
    date: 2026-09-11
    summary: >
      Запрошено user по конкретному кейсу: apps/skin/entities/openapi/model/endpoint/store.ts
      вручную гидрирует и пишет атом в localStorage (STORAGE_KEY + JSON.parse/stringify руками)
      — потому что upstream persist() из @xstate/store работает только с createStore (.with()),
      у createAtom этого метода нет. Решено добавить persistAtom в тот же подпуть
      @web-core/store/persist (не новый подпуть — переиспользует StateStorage/createJSONStorage
      оттуда же, один словарь опций на persist store и persist atom). Скоуп явно ограничен по
      просьбе user: localStorage/sessionStorage сейчас (через уже существующий
      createJSONStorage), IndexedDB — Backlog (persist-atom-indexeddb), не строить асинхронную
      гидратацию заранее без реального потребителя.

  - id: create-async-atom-confirmed-broken
    type: plan
    date: 2026-09-04
    summary: >
      createAsyncAtom из @xstate/store отслеживает .get() других атомов только в синхронной
      части геттера (пока запрос pending). В момент резолва промиса updateAsyncAtom вызывает
      atom._update(readyValue) — готовым значением, не геттером, — и purgeDeps считает все ранее
      слинкованные атомы недостигнутыми в этом проходе, отвязывает их. Итог: атом, получивший
      значение хотя бы раз, теряет реакцию на дальнейшую смену входа. Проверено изолированным
      прогоном на dist/xstate-store.js без Solid: infoAtom.deps после резолва — undefined,
      idAtom.set() больше не помечает потребителя dirty. Решение — не чинить примитив апстрима
      (внешняя зависимость), а заменить его собственным createResourceAtom и заблокировать
      реэкспорт сломанного имени на уровне типов, а не только предупреждением в доке.

  - id: resource-atom-solid-effect-not-autotrack
    type: plan
    date: 2026-09-04
    summary: >
      createResourceAtom реагирует на смену ключа через Solid createEffect(() => source()), не
      через автотрекинг @xstate/store — ту же систему, что сломана у createAsyncAtom. Сам
      ресурс-атом — обычный писуемый createAtom, обновляется только .set() изнутри эффекта.
      Компромисс: source обязан быть настоящим Solid-сигналом (или производным), .get() другого
      атома @xstate/store сюда не протягивается — это две разные реактивные системы, моста между
      ними нет.

  - id: engine-folder-not-kernel
    type: plan
    date: 2026-09-04
    summary: >
      Реструктуризация src/ прошла в два захода. Первый — folder-per-subpath один в один с
      exports (включая `.` → src/flat/), отклонён user: шесть папок одного уровня без точки
      входа читались как россыпь функций, разложенная по директориям, не движок. Второй заход —
      по образцу packages/assembly (kernel/ + тонкий index.ts), но не взят дословно: у assembly
      kernel/ — плоский мешок из 9 файлов без под-группировки (та же болезнь на уровень глубже),
      слово kernel там означает конкретно «без фреймворка» (./model — без Solid), а корневой
      слой store Solid-хуки как раз несёт — назвать его kernel было бы неточно. Названо engine/.
      machine/ остался независимым подпутём, не подмешан в корень (в отличие от assembly, где
      render всегда едет с kernel в `.`) — про это явно написано в src/index.ts.

  - id: readme-engine-template-first-pilot
    type: plan
    date: 2026-09-04
    summary: >
      Store — первый пакет, заполнивший общий шаблон README "движок" (Анатомия/Использование/
      Настройки/Состояния/IO/Сборки/Рецепт), заведённый user поверх шаблона "компонент" из
      packages/ui. Наблюдения по шаблону, переданные user: "Анатомия" у движка без DOM — за
      "адрес" части взят сам импорт-спецификатор подпути; "Настройки" у движка — опции
      конструкторов по функциям (persist/undoRedo/reset/validateSchemas получили каждый свою
      группу строк в одной таблице), не переключатели одной сущности, как у компонента. IO по
      запросу разделён на явные Вход/Выход после первого прохода одним списком.
