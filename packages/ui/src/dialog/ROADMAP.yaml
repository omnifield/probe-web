# Дорожная карта диалога — формат тот же, что у остальных компонентов кита (см. table/ROADMAP.yaml,
# шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Пропс-серфейс полный — каждая часть типизирована как свой проп напрямую один в один, сверено
# целиком 2026-09-04. Ни одного незавёрнутого соседнего КОМПОНЕНТА не нашлось.

categories:
  - category: Основа
    items:
      - id: open-close
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Открытие и закрытие по клику
        description: |
          Означает: клик по `trigger` открывает диалог, `closeTrigger`/`Escape` закрывают его —
          обычное поведение модальной панели.
          Реализация: готовое состояние компонента, проверено тестом.

      - id: multiple-triggers
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Несколько триггеров на один диалог
        description: |
          Означает: несколько `DialogTrigger` с разными `value` делят один диалог — клик по любому
          открывает его и помечает себя как `current` (`data-current`), какой из них его открыл.
          Тот же приём, что у `drawer`/`popover`.
          Реализация: готовый проп компонента, проверено тестом.

      - id: self-portal-backdrop-positioner
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "backdrop/positioner портализуются сами, без Portal от потребителя"
        description: |
          Означает: `DialogBackdrop`/`DialogPositioner` каждый оборачивает себя в `Portal` из
          `solid-js/web` — потребителю не нужно писать `<Portal>` вокруг них вручную, как того
          требуют все примеры на ark-ui.com.
          Реализация: `components/backdrop.tsx`/`components/positioner.tsx`, тот же приём, что уже
          был у `select`'s позиционера (найден вживую там же класс бага — несвязанный сосед на
          странице забирал клики). Тесты обновлены — портализованные части ищутся через
          `document.querySelector`, не `host.querySelector`.

      - id: alertdialog-role
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Диалог-предупреждение
        description: |
          Означает: `role="alertdialog"` — не только семантика: фокус по умолчанию уходит на
          кнопку закрытия/отмены, клик снаружи диалог не закрывает — подходящее поведение для
          подтверждения опасного действия.
          Реализация: готовый проп компонента, документирован примером README, не проверен
          отдельным тестом при аудите 2026-09-04.

  - category: Тонкая настройка
    items:
      - id: focus-and-dismiss-tuning
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Тонкая настройка фокуса и закрытия
        description: |
          Означает: `closeOnEscape`/`closeOnInteractOutside`/`trapFocus`/`restoreFocus`/
          `initialFocusEl`/`finalFocusEl`/`persistentElements` — какие элементы не закрывают
          диалог кликом снаружи, куда уходит и возвращается фокус.
          Реализация: готовые пропы компонента — технически проброшены, не проверены отдельным
          тестом при аудите 2026-09-04.

  - category: Не построено
    items:
      - id: imperative-state-access
        type: feature
        priority: Low
        milestone: null
        name: Программный доступ к состоянию диалога наружу
        description: |
          Означает: доступ к состоянию машины и методам управления диалогом программно — тот же
          класс возможностей, что `carousel`/`date-picker` теряют без своего канала состояния.
          Реализация: ЧЕСТНЫЙ пробел, не тихо забытый — кит не даёт наружу ни одного публичного
          способа до этого состояния достучаться. Третий такой случай в ките после
          `carousel`/`date-picker` — похоже, системный пробел карты кита, не случайность одного
          компонента.

# Журнал решений.
log:
  - id: portal-was-documented-before-it-was-true
    type: plan
    date: 2026-09-06
    summary: >
      `FAQ.md` уже утверждал «плавающие компоненты порталятся ближе к концу документа» ДО этой
      правки — формально неверно: до сегодняшнего дня `backdrop`/`positioner` не портализовались
      нигде в коде, разметка оставалась там, где её положили в JSX. User нашёл баг вживую (сверено
      с примерами ark-ui.com, где `Portal` — обязательная часть композиции) и попросил закрыть его
      на уровне кита, не оставлять потребителю. Урок тот же, что уже был у `button` — дока и код
      расходятся тихо, если проверять на слово прошлой записи, а не на реальное поведение.

  - id: full-surface-context-missing
    type: plan
    date: 2026-09-04
    summary: >
      Все семь частей принимают свои пропсы один в один — проверка не вскрыла ни одного
      незавёрнутого соседнего КОМПОНЕНТА. Программный канал состояния диалога наружу не дан —
      третий подряд компонент кита (после `carousel`, `date-picker`) с этим же пробелом. Стоит
      поднять как вопрос архитектору кита целиком, не чинить точечно здесь молча.
