# Дорожная карта инфраструктуры кита (packages/ui как пакета, не отдельного компонента) — формат
# тот же, что у роадмапов компонентов (см. table/ROADMAP.yaml, шапка). Единственный источник
# правды: статус проставляется рядом с работой, в момент когда она сделана.
#
# ОТЛИЧИЕ от роадмапов компонентов: это не фичи одного компонента, а процессная/инфраструктурная
# работа над пакетом целиком — сборка, публикация, документация, тестирование. При синке в
# Windshift ложится не под Initiative "Кит" (внешний экспорт для потребителей), а под отдельную
# Initiative "Внутренняя разработка".

categories:
  - category: Анатомия
    items:
      - id: anatomy-from-zag-not-ark
        type: bug
        status: Done
        priority: High
        name: Анатомия берётся у Zag во всех компонентах, а не готовым объектом у надстройки
        description: |
          Пять компонентов брали анатомию готовым объектом у Ark: carousel, date-picker, field,
          listbox, toc. Ark собирает список поверх заговского и дописывает свои части, не проверяя
          повтор имени, — у карусели progressText оказывался в списке дважды (12 частей вместо 11),
          у календаря view (26 вместо 25). Полезного Ark приносил ровно по одной части:
          autoplayIndicator карусели, valueText календаря, empty листбокса; toc не получал ничего.
          Теперь все четыре берут анатомию у Zag и добавляют нужное своим extendWith, а field —
          собственный createAnatomy: машины поля у Zag нет вовсе, как у button и diagram. Состав
          частей нигде не изменился, имя надстройки из entity/ ушло.
          Цена повтора была не косметическая: по списку частей считается покрытие скина, и часть,
          названная дважды, проверялась дважды — в отчёте assemble_preview на реальном наряде
          троились строки про непокрытые состояния view.
          Проверено живьём: 262 теста кита проходят (4 падения — давние, про lucide-иконки, к
          анатомии отношения не имеют), partsCount через MCP стал 11/25/8/11/8, задвоенных записей
          в отчёте о пробелах было 3, стало 0.
          Побочно: carousel, listbox и toc пришлось внести в зависимости кита, и первая установка
          подтянула их версии 1.43.3 при 1.43.1 у остальных двадцати одного — две версии
          @zag-js/anatomy в дереве, из-за чего TypeScript переставал именовать типы анатомии.
          Прибиты к 1.43.1 по остальным. Обновление всего Zag до свежей версии — отдельная работа.

  - category: Сборка
    items:
      - id: vite-build
        type: feature
        status: Done
        priority: High
        name: Репозиторий пакета + сборка через Vite
        description: Поднят репозиторий веб-библиотеки, настроен Vite на сборку пакета.

      - id: barrel-generator
        type: feature
        priority: Medium
        name: Генератор барелов
        description: Настройка генератора barrel-файлов (index.ts) для пакета.

  - category: Документация
    items:
      - id: docs-canonical
        type: feature
        priority: Medium
        name: Перевод всех компонентов на эталон документации
        description: >
          Каждый компонент кита приведён к единому эталону документации (README/FAQ/ROADMAP в
          установленном формате). Сам факт унификации, без перечисления конкретных компонентов —
          список и так виден по дереву компонентов.

  - category: Публикация
    items:
      - id: deploy-staging
        type: feature
        priority: Medium
        name: Деплой на стенд
        description: Настройка деплоя пакета на тестовый стенд.

      - id: kit-versioning
        type: feature
        priority: Medium
        name: Версионирование кита
        description: Настройка версионирования пакета.

      - id: nexus-publish
        type: feature
        priority: Medium
        name: Подключение к NEXUS и публикация
        description: Подключение пакета к NEXUS и настройка публикации в него.

      - id: repo-split
        type: feature
        priority: Medium
        name: Переезд в отдельный рабочий репозиторий
        description: Вынос пакета из текущего репозитория в отдельный рабочий репозиторий.

  - category: Тестирование
    items:
      - id: screenshot-testing
        type: feature
        priority: Medium
        name: Скриншот-тестирование
        description: Дополнение возможностей тестирования компонентов скриншот-тестами.
