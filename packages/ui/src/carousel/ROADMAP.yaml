# Дорожная карта карусели — формат тот же, что у остальных компонентов кита (см. table/ROADMAP.yaml,
# шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Каждая ЧАСТЬ анатомии принимает свои пропсы напрямую один в один, сверено целиком 2026-09-04. Но
# программного доступа к состоянию карусели (какая страница открыта, идёт ли автопрокрутка) и
# управления ею (перейти на слайд, поставить на паузу) кит не даёт вовсе — см. категорию
# «Не построено» ниже.

categories:
  - category: Основа
    items:
      - id: slide-navigation
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Листание стрелками и точками
        description: |
          Означает: `prevTrigger`/`nextTrigger` листают на страницу назад/вперёд, клик по точке
          индикатора прыгает сразу на свой слайд.
          Реализация: готовое поведение компонента — ФАКТИЧЕСКИЙ переход между страницами
          определяется через `IntersectionObserver` после настоящей прокрутки, поэтому НЕ
          проверен функциональным тестом при этом аудите (см. журнал ниже, честное ограничение
          среды, не пробел компонента). Начальная страница (`defaultPage`) проверена тестом.

      - id: autoplay
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Автопрокрутка с переключателем
        description: |
          Означает: `autoplay` заставляет карусель листать саму себя, `autoplayTrigger` ставит на
          паузу и возобновляет, `pressed` отражает текущее состояние переключателя.
          Реализация: готовый проп/часть компонента — технически проброшены, не проверены
          отдельным тестом при аудите 2026-09-04 (та же причина, что и у навигации — требует
          реального таймера и прокрутки).

  - category: Тонкая настройка
    items:
      - id: slides-per-page
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Несколько слайдов на экране одновременно
        description: |
          Означает: `slidesPerPage`/`slidesPerMove` — сколько слайдов видно за раз и сколько
          страниц пролистывается за один клик по стрелке.
          Реализация: готовый проп компонента — технически проброшен, не проверен отдельным
          тестом при аудите 2026-09-04.

      - id: spacing-and-padding
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Отступ между слайдами и полями области показа
        description: |
          Означает: `spacing` — зазор между слайдами, `padding` — лишнее пространство по краям
          области показа, чтобы соседние слайды были частично видны.
          Реализация: готовый проп компонента — технически проброшен, не проверен отдельным
          тестом при аудите 2026-09-04.

      - id: snap-tuning
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Строгость прилипания к слайду
        description: |
          Означает: `snapType` (`mandatory`/`proximity`) и `Item`'s `snapAlign` — насколько жёстко
          прокрутка прилипает к границе слайда и с какого его края.
          Реализация: готовый проп компонента — технически проброшен, не проверен отдельным
          тестом при аудите 2026-09-04.

      - id: readonly-indicator
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Индикатор только для чтения
        description: |
          Означает: `readOnly` на отдельном `CarouselIndicator` — точка показывает текущую
          страницу, но клик по ней не переключает слайд.
          Реализация: готовый проп компонента, паспорт уже адресует состояние `readonly` — не
          проверено отдельным тестом (та же причина, что у навигации: клик по индикатору
          проверяется через ту же навигацию, которая недоступна в этой среде).

      - id: variable-width-slides
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Слайды переменной ширины
        description: |
          Означает: `autoSize` отключает фиксированную раскладку слайдов — каждый занимает
          собственную естественную ширину, а не долю от `slidesPerPage`.
          Реализация: готовый проп компонента — технически проброшен, не проверен отдельным
          тестом при аудите 2026-09-04.

  - category: Не построено
    items:
      - id: imperative-state-access
        type: feature
        priority: Medium
        milestone: null
        name: Программный доступ к состоянию карусели
        description: |
          Означает: узнать текущую страницу и идёт ли автопрокрутка, а также управлять каруселью
          программно — перейти на конкретный слайд, поставить на паузу/возобновить, получить
          готовый текст прогресса вида «2 из 5». Нужно для живого `progressText`, кнопки «перейти
          к слайду N», паузы по наведению или своей индикации воспроизведения автопрокрутки.
          Реализация: ЧЕСТНЫЙ пробел, не тихо забытый — компонент умеет всё это внутри себя, но
          кит не даёт наружу ни одного публичного способа до этого состояния достучаться.

# Журнал решений.
log:
  - id: navigation-untestable-in-jsdom
    type: plan
    date: 2026-09-04
    summary: >
      Клик по `prevTrigger`/`nextTrigger`/`indicator` в теории должен листать страницу, но реальная
      машина узнаёт текущую страницу через `IntersectionObserver` ПОСЛЕ настоящей прокрутки — jsdom
      не выполняет ни то, ни другое (`Element.scrollTo` — заглушка, `IntersectionObserver` —
      заглушка без единого реального колбэка). Проверено эмпирически: клик по `nextTrigger` не
      меняет ни `prevTrigger`'s `disabled`, ни `data-current` индикаторов в этой среде. Честное
      ограничение окружения, не повод писать тест, который ничего не проверяет, и не повод молчать
      о факте — начальная страница (`defaultPage`) остаётся единственным, что здесь реально
      проверяемо без настоящего браузера.

  - id: full-surface-with-one-named-gap
    type: plan
    date: 2026-09-04
    summary: >
      Каждая часть анатомии принимает свои пропсы один в один — проверка не вскрыла ни одного
      незавёрнутого соседнего КОМПОНЕНТА. Но отдельно от частей анатомии есть целый программный
      доступ к состоянию карусели, которого кит не даёт вовсе — тот же класс находки, что
      отсутствующий групповой режим у чекбокса или незавершённая координация вложенных шторок,
      только здесь это не DOM-часть, а канал данных. Вынесено отдельной категорией «Не построено»,
      не смешано с «Основой».
