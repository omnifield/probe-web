<!doctype html>
<!-- НАБОР ЗНАЧЕНИЙ ПОДКЛЮЧАЕТ ПРИЛОЖЕНИЕ, и витрина здесь обычный потребитель.
     Базовый слой значений не красит документ вовсе: он объявляет роли через шкалы, а сами
     шкалы приходят с ТЕМОЙ. Не поставь её приложение — роли не разрешаются ни во что, и
     оболочка остаётся без цвета. Это не дефект зоны значений: она ничего не решает за
     приложение, приложение выбирает палитру само.
     Атрибутом в разметке, а не вызовом из скрипта: тема встаёт до первого кадра, и вспышки
     неокрашенного экрана перед загрузкой не бывает.
     РЕЖИМ НЕ ЗАДАЁТСЯ ЗДЕСЬ: витрина открывается светлой, дальше режим переключает механика
     приложения. Прибитый класс `dark` означал бы, что показ начинается с половины, где лестница
     поднимает акцент, — и первое впечатление о скине давала бы не его основа. -->
<html lang="ru" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Витрина — компоненты, подключённые к редактору скина</title>
  </head>
  <body>
    <!-- #root — часть замороженной поверхности (kb:PROBEWEB-4): mount() ищет точку сам. -->
    <div id="root"></div>
    <script type="module" src="/src/showcase/main.tsx"></script>
  </body>
</html>
