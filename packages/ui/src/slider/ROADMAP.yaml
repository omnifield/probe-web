# Дорожная карта слайдера — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# ТОНКАЯ ОБЁРТКА, как accordion/avatar/toggle/toggle-group/switch — весь пропс-серфейс проброшен
# насквозь один в один (`SliderProps = ArkRootProps`, проверено `mcp__ark-ui__get_component_props`,
# 2026-09-04). Фичового бэклога нет.

categories:
  - category: Основа
    items:
      - id: single-thumb
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Один бегунок (управляемый/неуправляемый)
        description: |
          Означает: обычный управляемый/неуправляемый паттерн (`value`/`defaultValue`/
          `onValueChange`), тот же принцип, что у остальных компонентов кита.
          Реализация: готовое состояние компонента-первоисточника, обвязка своя.

      - id: range-thumbs
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Диапазон — несколько бегунков сразу
        description: |
          Означает: несколько значений в одном массиве — по одному бегунку на каждое, каждый
          независимо двигается и фокусируется.
          Реализация: готовый механизм компонента-первоисточника, проверено тестом.

      - id: markers
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Деления шкалы со своим состоянием позиции
        description: |
          Означает: `marker` знает своё положение относительно текущего значения (ниже/на нём/
          выше) — честный факт о позиции, не о взаимодействии.
          Реализация: готовое состояние компонента-первоисточника, проверено тестом.

  - category: Тонкая настройка диапазона
    items:
      - id: min-steps-between-thumbs
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Минимальный зазор между бегунками
        description: |
          Означает: `minStepsBetweenThumbs` не даёт бегункам диапазона сойтись ближе заданного
          расстояния друг к другу.
          Реализация: готовый проп компонента-первоисточника — технически проброшен полным типом,
          НЕ проверен отдельным тестом при аудите 2026-09-04 (сложнее однозначно проверить, чем
          обычный булев проп — оставлено честно неверифицированным, не описано как испытанное).

      - id: thumb-collision-behavior
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Поведение бегунков при столкновении
        description: |
          Означает: `thumbCollisionBehavior` решает, что происходит, когда бегунки диапазона
          сталкиваются — не могут пройти друг сквозь друга (по умолчанию), толкают друг друга, или
          меняются местами.
          Реализация: готовый проп компонента-первоисточника — технически проброшен, не проверен
          отдельным тестом при аудите 2026-09-04.

      - id: origin
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Откуда закрашивается дорожка
        description: |
          Означает: `origin` решает, от какого края закрашивается дорожка для одиночного значения
          — от начала (обычное абсолютное значение), от центра или от конца (относительное
          смещение).
          Реализация: готовый проп компонента-первоисточника — технически проброшен, не проверен
          отдельным тестом при аудите 2026-09-04.

# Журнал решений.
log:
  - id: no-forward-roadmap-thin-wrapper
    type: plan
    date: 2026-09-04
    summary: >
      Тот же довод, что у остальных Ark-обёрток кита: весь пропс-серфейс проброшен 1:1. У слайдера
      заметно больше нетривиальных пропов, чем у соседей (`minStepsBetweenThumbs`,
      `thumbCollisionBehavior`, `origin`, `thumbAlignment`) — все технически доступны через прямой
      проброс типа, но три из них НЕ были добавлены в README/тесты при этом аудите: глубже
      проверять каждый эмпирически не позволило время, честнее оставить их отмеченными как
      неверифицированные, чем придумать пример без проверки.
