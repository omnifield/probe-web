<!doctype html>
<!-- Режим — классом прямо здесь, чтобы тёмная пара стояла ещё до разбора скрипта: иначе
     вспышка светлой перед тёмной (kb:SKIN-7, инвариант 3). Дальше его подтверждает механика.

     ПАЛИТРЫ ЗДЕСЬ НЕТ НАМЕРЕННО. Её называет точка входа вызовом restoreSkin() — именем из
     стилевого слоя, а не строкой: литерал в разметке пережил бы переименование палитры и
     сделал бы панель нецветной молча (kb:PROBEWEB-18).

     Панель — первый живой потребитель этой механики: чем она одевается сама, тем же одевает
     и зоны в кадре. -->
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Девпанель — probe-web</title>
  </head>
  <body>
    <!-- #root — часть замороженной поверхности (kb:PROBEWEB-4): mount() ищет точку сам. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
