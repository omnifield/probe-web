# Тестовое приложение подключает kit как УСТАНОВЛЕННЫЙ пакет (`workspace:*` → симлинк на
# корень), а не относительным путём в исходники. Иначе сборочный тест проверял бы файлы на
# диске, а не то, ради чего он есть: что приложение поднимается на разрешении по `exports`.
packages:
  - test/fixture

# Постинсталл-скрипты pnpm по умолчанию не пускает; esbuild без своего бинаря не работает.
onlyBuiltDependencies:
  - esbuild
