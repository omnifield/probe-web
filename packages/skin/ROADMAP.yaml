  - id: editorInfo-merge-was-a-detour
    type: plan
    date: 2026-09-12
    summary: >
      Мост через `editorInfo` (пункт 4, сделан этим же владельцем по ТЗ architect'а) оказался
      ненужным крюком. Architect (собственная ошибка, не владельца этого пакета) предложил мёрж
