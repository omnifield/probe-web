  - category: Данные списков и деревьев
    items:
      - id: unified-item-collection-engine
        type: feature
        status: Done
        priority: High
        name: "Единый канон элемента (value/label/children?) и один аксесорный слой — без обхода сбоку ни для одного компонента"
        description: |
          Решение user дословно: "давай все делать по канону, никаких поверх или сбоку. все в
          одном флоу и в одном каноне" — ни у одного компонента, включая accordion, не остаётся
          своя параллельная форма данных. Полный список компонентов кита, работающих с массивом/
          деревом элементов, сверен по факту (`entity/io.ts` каждого), не по памяти:

          - `accordion` — НЕ плоский `items`: `sections[].items`, у секции свои `id`/`title`/
            `activeValues`, у листового item — `{value, label}`.
          - `tabs` — плоский `items: {value, label, content}[]`.
          - `listbox`/`select` — плоский `items: {value, label}[]`.
          - `tree-view` — `items: TreeItem[]`, `TreeItem = {id, label, children?}` — узел зовётся
            `id`, не `value`, единственный такой во всём ките.
          - `menu` — `entity/io.ts` ещё не существует, компонент не реализован до конца. Строить
            сразу на каноне, миграции не будет.
          - `carousel` — massив НЕ использует вовсе (`{slide1, slide2, slide3}`, фиксированные
            слоты) — другая, более глубокая проблема (не список, а жёстко заданное число слотов).
            Осознанно ВНЕ этой заявки, не заворачивать сюда попутно.

          Почему один канон технически верен, а не просто "красивее": в самом Zag коллекция
          (`@zag-js/collection`, `ListCollection`/`TreeCollection`) — самостоятельный класс, не
          привязанный к конкретной машине. Сверено грепом по ВСЕМ установленным `@zag-js/*`
          пакетам на импорт `@zag-js/collection`: используют его только `select`/`combobox`/
          `cascade-select`/`listbox`/`tree-view` — машинам, которым НАДО самим обходить данные
          (клавиатурная навигация, поиск по вводу, виртуализация/async-подгрузка). `accordion`/
          `tabs`/`menu` коллекцию не подключают вовсе — их машина хранит только `value` открытых/
          выбранных элементов, перечисление уже даёт сам рендер (`.map()` по массиву в JSX). Но
          `ListCollection`/`TreeCollection` НИЧЕМ не мешают быть использованными и там — просто как
          нормализатор на стороне кита, не как проп машины. `tree-view/components/root.tsx` УЖЕ
          так делает: `createTreeCollection({nodeToValue: node => node.id, nodeToString: node =>
          node.label})` — ровно этот приём, просто самодельный и не общий. `@ark-ui/solid` (кит
          уже ходит за коллекцией через него, не мимо) реэкспортирует весь набор целиком —
          `createListCollection`/`createTreeCollection`/`CollectionItem`/`TreeCollection`/…

          Канон: `item = {value: string, label: string, children?: item[]}` — рекурсивный, глубина
          не ограничена сверху. "Секция" `accordion` — НЕ отдельная форма, а такой же `item` с
          `children` (группа — узел с детьми, не параллельная сущность); если после проверки
          реального использования группировка accordion'у не нужна вовсе — убрать её, не тащить
          пустую форму ради формы. Подменю `menu` — та же связь через `children`, не своя схема.

          Куда класть (место уже есть, не новая папка):
          1. `shared/data/fields.ts` — рекурсивный фрагмент `item` рядом с `fields.labeled`, тем
             же приёмом (spread в `entity/io.ts` каждого компонента, не копия текста).
          2. `shared/utils/collection.ts` — перестаёт быть голым реэкспортом
             `createListCollection`; добавляются `createItemListCollection(items)`/
             `createItemTreeCollection(root)` — тонкие обёртки над `createListCollection`/
             `createTreeCollection` (те же, что уже реэкспортированы, из `@ark-ui/solid`) с нашими
             аксесорами (`itemToValue`/`itemToString`, `nodeToValue`/`nodeToString`/`nodeToChildren:
             n => n.children ?? []`) зашитыми внутрь — компонент их не пишет каждый раз заново,
             как сегодня делает `tree-view`.

          По компонентам:
          - `accordion` — `sections`/`id`/`title`/`activeValues` уводятся целиком, io-схема
            переходит на плоский (или вложенный через `children`, если группировка реально нужна)
            канонический `item`. Это касается и рендер-кода (`components/`), не только `io.ts`.
          - `tabs`/`listbox`/`select` — форма уже `{value,label}`, переводятся на общий фрагмент
            `item` через spread вместо локального `z.object`; свои поля сверх канона (у `tabs` —
            `content`) остаются — канон это пол, не потолок.
          - `tree-view` — `id` → `value` (канон), `root.tsx`'s ручной `createTreeCollection`
            меняется на `createItemTreeCollection` из `shared/utils`. Проверено (2026-09-09,
            внешний стенд): живых `content`-записей на `tree-view` — 0, только рецепт/наряд
            (стиль), переименование поля контента ничего не ломает.
          - `menu` — реализуется на каноне с нуля, миграции нет.
          - `carousel` — не трогать в этой заявке (см. выше).

          Тесты — по образцу, что уже принят в остальных зонах: не верить, что `ListCollection`/
          `TreeCollection` со старыми/новыми полями работают "по факту одинаковых сигнатур" —
          прогнать реальный рендер каждого мигрированного компонента с данными нового канона,
          сверить, что value/label/children доходят до DOM/машины так же, как раньше.

          Сделано (2026-09-09): `fields.item`/`createItemListCollection`/`createItemTreeCollection`
          на месте, все пять компонентов переведены, реальный рендер прогнан (271 тест кита зелёные,
          нетронутые 2 падения `shipped-artifact.test.ts` — старые, про lucide dist, к этой заявке
          не относятся). `accordion` — group нужен по факту (5 живых content-записей и сборка
          `action-list` реально используют её), убирать не стали; `sections`/`id`/`title`/`items`
          переведены на канонические `items`/`value`/`label`/`children`, 5 живых content-записей
          (`accordion-*`) при этом сломаны намеренно — user подтвердил дословно "не будем из-за
          полумёртвого потребителя резать флоу", правка content — отдельная задача не в этой зоне.
          `menu` — реализован ТОЛЬКО плоский список (новая сборка `list`, `entity/io.ts` на каноне);
          чекбокс/радио/группы/разделители/подменю из данных осознанно вынесены за скобки (см.
          `menu-data-driven-rich-items` ниже), сборка `basic` (статичная, ручная) не тронута.

          Побочная находка, не мой инструмент чинить (packages/skin, не packages/ui): рекурсивный
          `item` в `Data` ломает `Paths<T>` (`packages/skin/src/engine/passport/assembly/paths.ts`)
          — вместо union путей типизация схлопывается в один вырожденный тип
          (`"children/children/children/children/children/children"`), `tsc` валит сборку. У
          `tree-view` это было обойдено ещё раньше (родовой параметр `Data` у `PassportAssembly` не
          передаётся вовсе, путь проверяется как голый `string`) — тем же приёмом обошли `accordion`
          и `menu`. Строгая проверка путей `repeat`/`bind` для ЛЮБОГО компонента с рекурсивными
          `children` в данных сейчас не работает в принципе, не только у этих трёх — на заметку
          architect/владельцу `packages/skin`.

      - id: menu-data-driven-rich-items
        type: feature
        status: Backlog
        priority: Medium
        name: "menu — чекбокс/радио/группы/разделители/подменю из данных, не только плоский список"
        description: |
          Отложено при `unified-item-collection-engine` (2026-09-09) — user дословно: "бери плоский
          список, потом им займёмся нормально". Канонический `item` (`value`/`label`/`children?`)
          закрывает только плоский список и в теории подменю через `children`; чекбокс/радио/
          разделитель/подписанная группа своей формой в канон не укладываются — нужен отдельный
          дискриминатор (`type`/`checked` и т.п.), которого канон не описывает. Требует
          проектного решения по форме данных, не просто миграции на существующий канон.
          `basic` (статичная сборка, живой пример всех видов пунктов руками) и `list` (плоский
          список из данных, сборка `playground/assemblies/list.ts`) остаются как есть, не трогать
          при реализации — это уже сделано.
