# Дорожная карта @web-core/mcp — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/build/store (categories → items, log → журнал решений); без milestones — у
# пакета нет освоенной поставки с датами релиза, только сделанное и открытое.

categories:
  - category: Регистрация тула
    items:
      - id: register-tool-mandatory-annotations
        type: feature
        status: Done
        priority: High
        milestone: null
        name: registerTool() — обязательные annotations, input/output как настоящие Zod-схемы
        description: |
          Означает: тул нельзя зарегистрировать без явного access ("read"/"write"/"destructive")
          — регистрация бросает на старте, не молча принимает тул без разметки. access
          отображается в нативные annotations спеки MCP (readOnlyHint/destructiveHint),
          idempotent/openWorld — отдельные необязательные флаги поверх. input/output —
          настоящие Zod-схемы: SDK (@modelcontextprotocol/sdk) сам валидирует по ним аргументы и
          сам строит JSON Schema для протокола — отдельного шага конвертации нет вовсе (см. log,
          zod-output-schema-was-unnecessary).
          Причина: аудит apps/skin/.mcp показал, что там annotations нет вовсе — ни один из
          десяти тулов не размечен, save_preset (пишет) неотличим от list_components (читает), и
          outputSchema не объявлен ни разу. Образец обязательности — Windshift
          internal/aitools/registry.go (Access/Risk/Scopes обязательны, паника при регистрации
          без них).

      - id: response-envelope
        type: feature
        status: Done
        priority: High
        milestone: null
        name: ok()/err() — конверт ответа по спеке
        description: |
          Означает: успех и отказ хендлера всегда заворачиваются в форму, которую ждёт спека MCP
          (content, structuredContent если есть output, isError) — хендлеру не нужно знать про
          протокол вообще.
          Причина: в apps/skin/.mcp isError никогда не true, даже для настоящих отказов
          (unknown component) — расхождение со спекой, найденное аудитом, не осознанное решение.

  - category: Транспорт
    items:
      - id: transport-bootstrap
        type: feature
        status: Done
        priority: High
        milestone: null
        name: createServer() — stdio и Streamable HTTP одним конфигом
        description: |
          Означает: зона поднимает сервер локально (stdio, как сегодня apps/skin/.mcp/src/server.ts)
          и на сервере (Streamable HTTP) без переписывания — выбор транспортом по конфигу/env, не
          отдельным кодом на каждую зону.
          Реализация: auth — точка расширения (хук-функция на каждый HTTP-запрос), сама проверка
          токена/scope — забота потребителя, не пакета. HTTP-транспорт держит сессию НА КЛИЕНТА —
          отдельная пара McpServer+StreamableHTTPServerTransport на каждый новый mcp-session-id,
          в карте по id (одна пара на процесс держала ровно одну сессию — второй одновременный
          клиент отваливался с -32600, найдено ревью, см. FAQ.md). registerTools теперь функция в
          опциях, а не готовый McpServer наружу — вызывается заново на каждую сессию (ломающее
          изменение публичной сигнатуры, принято осознанно). Неизвестный (не пустой) mcp-session-id
          отвечает 404 ДО постройки McpServer — до починки строился и выбрасывался целый сервер со
          всеми тулами на каждый чужой/протухший id (найдено тем же ревью: 10 выдуманных id → 11
          построенных серверов, в карте ноль). host по умолчанию "127.0.0.1" (раньше — все
          интерфейсы без предупреждения), allowedHosts/allowedOrigins — свои чеки по заголовкам
          Host/Origin в обработчике (не deprecated-опции самого транспорта SDK). instructions —
          новое поле, уходит в ответ initialize. Windshift internal/mcp/server.go — образец формы
          решения (HTTP + auth-мидлварь), не буквальной настройки транспорта (тот Stateless: true
          — другой SDK, другого вендора, не совпадает).

      - id: listen-error-handling
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "listen() ловит ошибку старта HTTP-сервера явно, не валит процесс сырым исключением"
        description: |
          Означает: `server.once("error", cause => reject(...))` рядом с `server.listen(port, host,
          resolve)` — без этого ошибка старта (порт занят) была необработанным событием
          `EventEmitter`, Node валил весь процесс сырым стектрейсом, а промис `listen()` не
          резолвился и не отклонялся, просто зависал. Теперь `await server.listen(port)` либо
          резолвится, либо отклоняется понятной причиной («MCP HTTP-транспорт не смог подняться на
          HOST:PORT — порт N уже занят другим процессом»).
          Причина: найдено живьём — `apps/skin/.mcp` в реальном dev-контейнере падал `EADDRINUSE`
          на каждом старте `pnpm run serve`, порт по умолчанию (`3000`) был занят сторонней
          инфраструктурой контейнера, не web-core.
          Проверено тестом: два `createServer({transport:"http"})` на один порт подряд — второй
          `listen()` отклоняется этим сообщением, не роняет тестовый процесс. 29/29 (было 28).

      - id: tool-handler-request-context
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "registerTool прокидывает ToolContext (заголовки, sessionId) — раньше терялся вторым аргументом"
        description: |
          Означает: хендлер тула теперь получает `ToolContext` (`{headers, sessionId?}`) — вторым
          параметром у тулов с `input`, единственным — у тулов без него (та же вилка, которой сама
          SDK зовёт хендлер: `server/mcp.js`'s `executeToolHandler`, `handler(args, extra)` при
          `inputSchema`, `handler(extra)` без неё). `headers` — реальные HTTP-заголовки запроса
          (`extra.requestInfo.headers` SDK, пусто на stdio), не весь `RequestHandlerExtra` SDK
          (там ещё `signal`/`sendNotification`/`taskStore` — служебное для транспорта, не для
          автора тула).
          Причина: НАШ баг, не ограничение MCP — `RawRegisterTool`'s хендлер был типизирован как
          `(args: unknown) => ...`, ОДИН параметр, `server.registerTool.bind(server) as unknown as
          RawRegisterTool` кастом прятал урезку: SDK реально зовёт хендлер с `extra` (несёт
          `requestInfo.headers` на КАЖДЫЙ вызов, не только `initialize`) — обёртка его отбрасывала.
          Найдено живой заявкой внешнего агента, которому нужен был способ доказать серверу, чей
          запрос — заголовком `X-User-Login`, не аргументом тула (аргумент агент печатает сам,
          заголовок — нет, транспортом управляет платформа перед ним). Реакция на реплику user
          «подцепить хедеры — самая тривиальная задача, что не так с архитектурой» — оказалось, не
          с архитектурой MCP, а с нашей же обёрткой; починено на месте, не обойдено сбоку.
          Проверено тестом на реальном HTTP (оба ветвления — тул с `input` и без): клиентский
          заголовок `X-User-Login` доходит до хендлера неизменным. 31/31 (было 29).

  - category: Листинги
    items:
      - id: cursor-pagination
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: paginate() — курсорная пагинация list_x
        description: |
          Означает: любой list_x-тул (list_presets в skin-mcp, будущие list_x в других зонах)
          отдаёт страницу с nextCursor, а не весь список разом — сегодня list_presets в
          apps/skin/.mcp отдаёт всё по виду без лимита.

      - id: bounded-limit-schema
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "limitSchema — общий потолок поля limit, не language max в JSON Schema"
        description: |
          Означает: `z.number().int().positive()` без верхней границы печатает в JSON Schema
          предельное целое языка (`9007199254740991`) — не бизнес-правило, а утечка типа.
          `limitSchema` (`max(100)`) — общая экспортируемая схема рядом с `paginate()`, не
          переизобретается в каждой ручке каждой зоны. `@web-core/io` стала настоящей (не dev-)
          зависимостью пакета — `z` теперь используется в исходнике, не только в тестах.
          Причина: живая заявка на `apps/skin/.mcp` — то же число повторялось в описании ЧЕТЫРЁХ
          разных ручек (`list_components`/`list_presets`/`list_feedback`/`list_content`), каждая
          сама набирала себе схему `limit` с нуля.
          Проверено тестом: `z.toJSONSchema(limitSchema).maximum === 100`, не
          `Number.MAX_SAFE_INTEGER`; `safeParse(101)` отказывает, `safeParse(100)` проходит.

      - id: default-limit-lowered
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "paginate()'s DEFAULT_LIMIT 50 → 20 — потолок был выше любого реального набора"
        description: |
          Означает: `paginate(items)` без явного `limit` режет на 20, не на 50. Затрагивает КАЖДЫЙ
          list_x любой зоны, который не передаёт свой `limit`.
          Причина: живая заявка на `apps/skin/.mcp` — точечная правка одной ветки (`list_presets`
          без `kind`, свой `OVERVIEW_LIMIT`) оставила СОСЕДНИЕ вызовы того же общего `paginate()`
          дырявыми: `list_components()` (35 записей) и `list_presets(kind:"form")` (28 записей) оба
          отдавали всё целиком без `nextCursor`, потому что 50 не было пройдено НИ НА ОДНОМ реальном
          наборе во всей зоне — default был мёртвым правилом везде, не только там, где заметили
          первым. «Закрыть это правилом, а не точечно»: правка одна, в общем движке, не по ручке.
          20 — планка ниже обоих известных счётчиков (28, 35), проверяема прямо сейчас.
          Проверено тестом: набор из 25 элементов без `limit` — 20 в странице, `nextCursor` есть.
          34/34 (было 33).

      - id: transport-test-port-race
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "transport.test.ts — гонка порта между соседними тестами, найдена не по этой правке"
        description: |
          Означает: два теста на заголовки (`ToolContext`) в конце `transport.test.ts` получили
          свои номера портов (`PORT+1`, `PORT+2`), не общий `PORT` с остальными десятью тестами
          файла — `server.close()` не гарантирует, что предыдущий сервер полностью освободил порт
          к моменту, когда следующий тест того же файла начинает `listen()` на ТОМ ЖЕ числе.
          Причина: обнаружено СЛУЧАЙНО при добавлении bounded-limit-schema — правка в СОСЕДНЕМ
          файле (`pagination.test.ts`) не должна была задеть `transport.test.ts`, но полный прогон
          пакета внезапно словил `SocketError: other side closed` именно там, стабильно. Изолировано
          проверкой: тест отдельно (`vitest run transport.test.ts -t "no input"`) — зелёный; весь
          файл целиком — падает на этом же тесте 3 раза подряд. Гонка была латентной с самого
          добавления этих двух тестов, просто раньше не всплывала на конкретном порядке выполнения.
          Проверено: 3 прогона всего пакета подряд после починки, без единого падения. 33/33 (было
          31, плюс 2 теста limitSchema).

  - category: Документация
    items:
      - id: readme-tooling-skeleton
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: README/FAQ/ROADMAP по шаблону tooling
        description: |
          Означает: тройка доки заведена по образцу packages/build (genus: tooling, тот же
          порядок разделов). Начиналась как согласованный с user план до кода — теперь описывает
          настоящую реализацию (index.ts-барель + register-tool/transport/pagination каталогами,
          реальные тесты, реальный round-trip через MCP SDK), не план.

      - id: real-tests-not-mocks
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Тесты — настоящий round-trip через MCP SDK, не имитация
        description: |
          Означает: registerTool/ok/err проверены через InMemoryTransport.createLinkedPair() с
          настоящим Client (annotations на проводе, structuredContent, isError), createServer —
          через настоящий StreamableHTTPClientTransport на реально поднятый HTTP-порт (успех, 401
          от auth-хука, проход после верного заголовка), paginate — полный обход list по
          nextCursor. 15/15 зелёных (vitest run).

  - category: Обмен с другими инстансами
    items:
      - id: peer-connector
        type: feature
        status: Done
        priority: High
        milestone: null
        name: httpPeer()/stdioPeer() — клиент к чужому MCP-серверу, ленивое подключение
        description: |
          Означает: любая зона может дозвониться до другого MCP-сервера (HTTP-адрес или локальный
          процесс по stdio) и позвать его тул через один и тот же интерфейс ({callTool, close}) —
          не пишет клиентский код заново на каждую пару зон. Подключение — на первый callTool, не
          в момент вызова httpPeer/stdioPeer (объявить peer — не то же самое, что решить им
          воспользоваться; ранний коннект открыл бы соединение или процесс впустую).
          Причина: apps/skin/.mcp/src/engine/browser.ts был написан как разовый клиент к
          chrome-devtools-mcp прямо в зоне — задача "дозвониться до другого MCP и позвать тул"
          ничем не завязана на скин, её же назовёт прод-синк той же зоны (list_feedback с прод-
          инстанса, push эталонов на прод). Перенесено сюда до второго использования, не после.

      - id: stdio-peer-env-passthrough
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "stdioPeer(..., {env}) — явный проброс окружения дочернему процессу"
        description: |
          Означает: StdioPeerOptions получил третье поле env (Record<string,string|undefined>,
          undefined-значения отфильтровываются перед передачей в StdioClientTransport) — не задано,
          SDK по-прежнему даёт свой обрезанный безопасный набор (PATH/HOME/SHELL/USER/LOGNAME/TERM),
          не весь process.env. Умолчание НЕ поменяно (осознанно: stdioPeer порой спавнит СТОРОННИЙ
          процесс — chrome-devtools-mcp через npx в createBrowser — которому наши секреты видеть не
          нужно, supply-chain-риск при полном наследовании по умолчанию).
          Причина: живая финальная сверка apps/skin/.mcp перед первым деплоем на VPS прогнала
          stdioPeer("pnpm",["start"]) с SKIN_MCP_ADMIN_AUTHOR/TOKEN/CHROME_EXECUTABLE в оболочке
          теста — оба симптома (author-guard молча пропустил чужую перезапись, browser_screenshot
          не нашёл Chrome) оказались одной причиной: дочерний процесс их не увидел вовсе. apps/skin/
          .mcp/scripts/push-to-prod.mjs (спавнит СВОЙ ЖЕ локальный сервер тем же stdioPeer) чинится
          тем же полем — env: process.env, доверенный случай, не сторонний процесс.
          Проверено живьём и тестом: две новые строки в peer.test.ts (env не передан — фикстура не
          видит свою переменную; env: process.env передан — видит) плюс повторный прогон полной
          финальной сверки apps/skin/.mcp (17 тулов, author-guard/content/feedback/browser — все
          зелёные после починки). 27/27 в packages/mcp (было 25).

      - id: browser-proxy-factory
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: createBrowser() — обёртка над chrome-devtools-mcp (newPage/navigate/screenshot)
        description: |
          Означает: зона получает headless-браузер как три функции (newPage/navigate/screenshot)
          поверх stdioPeer к chrome-devtools-mcp, без своего рендера — не переписывает то, что
          внешний пакет уже поддерживает (--pageIdRouting, включён по умолчанию, "useful for
          concurrent agent sessions" по его собственной документации). pageId — число, разобранное
          регуляркой из текстового списка страниц ("`${N}: ... [selected]`") — реальный формат
          ответа new_page/navigate_page, не структурированное поле (проверено живым вызовом, не по
          документации). executablePath/chromeArgs — параметры фабрики, не хардкод: путь к
          бинарнику Chrome и обязательные для контейнера флаги (--no-sandbox,
          --disable-dev-shm-usage) отличаются между дев-контейнером и прод-VPS.
          Причина: apps/skin/.mcp понадобился браузер для визуальной обратной связи внешнему
          агенту — механика (процесс chrome-devtools-mcp, peer, парсинг pageId) не специфична
          скину, унесена сюда до того, как обросла бы второй копией в следующей зоне.

      - id: browser-click-and-snapshot
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Browser.snapshot()/.click() — настоящий клик мышью, не переход по URL"
        description: |
          Означает: Browser получил snapshot() (текстовое a11y-дерево, каждый узел с uid — источник
          адресации для click) и click(pageId, uid, {dblClick?}) — chrome-devtools-mcp's click
          адресует ТОЛЬКО по uid (не CSS-селектор), поэтому обе функции добавлены одной заявкой, не
          порознь: click без snapshot был бы нечем адресовать. Формат снимка ("uid=1_1 button ...")
          и то, что uid элемента может смениться после клика при обновлении DOM — проверено живым
          вызовом на реальной кнопке (uid=1_2 до клика → uid=2_0 после, та же логическая подпись).
          Причина: живая заявка от внешнего агента, работающего с apps/skin/.mcp — browser_navigate
          (жёсткий переход по URL) не воспроизводит клик по пункту дерева внутри SPA (переход
          роутером — другой код-путь), баг с миганием ловится именно на клике, через тогдашние тулы
          физически не воспроизводился. Трейсы производительности (второй вариант из той же заявки,
          для ловли переходного кадра) сознательно НЕ добавлены — заявка сама пометила это как
          опциональное, более дешёвый путь (серия screenshot без ожидания settle сразу после click)
          уже доступен существующими тулами без единой новой строки; трейсы — задача на будущее,
          если этого дешёвого пути не хватит на практике (см. FAQ.md).
          Проверено живьём: полный цикл navigate→snapshot→click→snapshot через реальный skin-mcp
          (не только сам пакет) — текст страницы после клика меняется ровно так, как задал
          обработчик. 28/28 в packages/mcp (было 27).

  - category: Не в этом пакете
    items:
      - id: concrete-auth-verification
        type: feature
        status: Backlog
        priority: null
        milestone: null
        name: Проверка bearer-токена/scope под конкретный бэк
        description: |
          Означает: createServer() даёт точку расширения (auth-хук), но САМУ проверку токена
          против сервиса пресетов (или другого бэка зоны) пишет зона, не этот пакет — привязка к
          конкретному бэку не тулинг, а бизнес-логика продукта.

      - id: response-format-verbosity
        type: feature
        status: Backlog
        priority: null
        milestone: null
        name: response_format (concise/detailed)
        description: |
          Означает: переключатель подробности ответа (по совету Anthropic — DETAILED/CONCISE) —
          решение конкретного тула конкретной зоны (например get_passport в skin-mcp), не общий
          примитив этого пакета.

      - id: eval-harness
        type: feature
        status: Backlog
        priority: null
        milestone: null
        name: Eval-харнесс для тулов
        description: |
          Означает: набор реалистичных многошаговых сценариев с проверяемым результатом (гайд
          Anthropic называет это главным способом измерить качество тула) — отдельная задача по
          зоне (например skin-mcp), не часть общего тулинга.

log:
  - id: browser-mechanic-moved-from-skin-mcp
    type: plan
    date: 2026-09-05
    summary: >
      User сформулировал прод-план apps/skin/.mcp (эталоны толкаются на VPS, заявки тянутся
      обратно) и сразу указал: "тебе надо настроить просто базовые мехи для общения между
      инстансами... я предлагаю это вынести в packages/mcp, бери сразу на себя". httpPeer/stdioPeer
      написаны первыми (peer/index.ts, peer.test.ts — реальный round-trip: httpPeer против живого
      createServer({transport:"http"}), stdioPeer против настоящего спавненного процесса-фикстуры
      test/fixtures/stdio-ping-server.mjs, включая проверку "один процесс на весь peer, не на
      каждый вызов" через process.pid). Пока шла правка apps/skin/.mcp/src/engine/browser.ts под
      stdioPeer, user отдельным сообщением уточнил объём шире: "вот это [browser.ts] неси тоже в
      общак, браузер нужен всем" — то есть не только связь, но и весь браузер-прокси целиком.
      Добавлен browser/index.ts (createBrowser) и browser.test.ts (реальный headless Chromium,
      skipIf без бинарника). apps/skin/.mcp/src/engine/browser.ts стал тонкой обёрткой (одна
      строка вызова createBrowser со своим executablePath из SKIN_MCP_CHROME_EXECUTABLE) —
      проверено живьём после переноса тем же способом (browser_navigate+browser_screenshot против
      реального дев-сервера показа, настоящий PNG на выходе).

  - id: unknown-session-and-origin-review-fixes
    type: plan
    date: 2026-09-05
    summary: >
      Второй раунд того же ревью, после починки concurrent-clients-review-fixes, нашёл ещё три
      момента. 1) Живым прогоном (10 запросов с выдуманными mcp-session-id): каждый строил и тут
      же выбрасывал целый McpServer со всеми тулами (11 построенных серверов, в карте сессий
      ноль) — не утечка, но чужой запрос оплачивался полной регистрацией впустую; починка —
      проверка "заголовок есть, в карте нет" ДО постройки, отвечает 404 сразу, новая пара строится
      только при ПОЛНОМ отсутствии заголовка. 2) Проверялся только Host, не Origin — спека MCP
      рекомендует именно Origin; практический риск был ограничен (браузерный preflight без CORS
      всё равно не пропустил бы ответ странице), но добавлено allowedOrigins тем же приёмом
      (свой чек в обработчике, не deprecated-опция транспорта), раз чек на Host уже есть рядом.
      3) Внутренняя `let transport` в handle() затеняла внешний `transport` (режим stdio/http) —
      сегодня не пересекается (проверка режима живёт в listen(), не в handle()), но одно имя на
      две вещи в одной функции — заготовка под чужую ошибку; переименована в sessionTransport.

  - id: concurrent-clients-review-fixes
    type: plan
    date: 2026-09-05
    summary: >
      Заявка от агента, готовящегося подключать своих клиентов к серверу зоны, нашла реальный баг
      живым прогоном (два клиента, SDK 1.30.0): один StreamableHTTPServerTransport на процесс
      ведёт одну сессию, второй клиент отваливается -32600 "Server already initialized" даже с
      sessionIdGenerator из более раннего пункта лога. Починка — карта {server,transport} по
      mcp-session-id, новая пара на каждый неизвестный id (onsessioninitialized/onsessionclosed
      транспорта складывают/убирают её из карты). Следствие, которое заявка тоже назвала прямым
      текстом и предложила решить осознанно: registerTools стал функцией в опциях createServer
      (вызывается на каждую новую сессию), а не готовым McpServer наружу — ломающее изменение
      публичной сигнатуры. Заодно из той же заявки: host по умолчанию "127.0.0.1" (было — все
      интерфейсы без auth это открытая дыра), allowedHosts свой чек в обработчике (не deprecated
      опции транспорта SDK), instructions — новое поле (единственное бесплатное место объяснить
      агенту порядок тулов, ответ на initialize). Явно НЕ тронуто по прямому указанию заявки:
      SKIN_MCP_TRANSPORT-переключение, обязательный access с падением при регистрации,
      разделение отказа протокола и отрицательного результата проверки, свободная форма входов.

  - id: folders-not-flat-files-in-src
    type: plan
    date: 2026-09-05
    summary: >
      Предыдущая запись лога (single-file-not-subpaths) сама была неверно понята: user имел в
      виду не "весь код в одном файле", а правило репозитория "в корне src только index.ts-барель,
      всё остальное по каталогам" (packages/store: engine/ → ., machine/+addons/ → свои подпути;
      packages/build тут не образец — у него нет корневого барреля вовсе). Три подпути (`.`,
      `/transport`, `/pagination`) возвращены — они были верны с самого начала, ошибкой было
      собрать их в плоские файлы src/index.ts+transport.ts+pagination.ts вместо каталогов
      register-tool/, transport/, pagination/ с тонким корневым барелем, реэкспортирующим только
      register-tool/ (общее — через барель, тяжёлое/опциональное — своим подпутём+каталогом).

  - id: single-file-not-subpaths
    type: plan
    date: 2026-09-05
    summary: >
      User поправил структуру после первого прохода: код был раскидан по трём файлам
      (index.ts/transport.ts/pagination.ts) с тремя exports-подпутями — калька формы
      packages/build, но без довода build (там подпути — правда разные цели потребления: конфиг
      Vite, JSON-профиль типов, бинарник). Здесь все три функции потребляются одним способом
      (импорт в TS-файл MCP-сервера зоны) — подпути были поверхностью ради поверхности. Собрано в
      один src/index.ts, один адрес поставки; заодно убраны все объясняющие абзацы из кода
      (правило корневого README "в коде — не проза") — обоснования только в FAQ.md.

  - id: z-via-io-not-raw-zod
    type: plan
    date: 2026-09-05
    summary: >
      Package.json нёс "zod" отдельной зависимостью (сперва dependencies, потом devDependencies
      для тестов) — user спросил, почему не через packages/io, которая уже единственная точка
      входа к z в репозитории (packages/io/src/engine/index.ts, прямым текстом "z через этот
      пакет, не напрямую из zod"), тем же приёмом, что apps/skin/.mcp/src/kit.ts. "zod" снято из
      package.json целиком, тесты берут z из @web-core/io (devDependency) — src/index.ts саму
      zod не импортирует, только тип AnySchema из @modelcontextprotocol/sdk (стирается на
      компиляции).

  - id: sessionid-not-stateless-in-ts-sdk
    type: plan
    date: 2026-09-05
    summary: >
      Первая версия createServer({transport:"http"}) использовала sessionIdGenerator: undefined
      (честный stateless, по аналогии с Windshift Stateless: true) — живой тест показал, что
      ВТОРОЙ HTTP-запрос на тот же transport падает 500 без сообщения. Причина найдена в
      собственном эталонном примере SDK (examples/server/simpleStatelessStreamableHttp.js):
      честный stateless в этой версии @modelcontextprotocol/sdk требует новый McpServer+transport
      НА КАЖДЫЙ запрос — несовместимо с моделью "тулы регистрируются один раз в createServer".
      Починка — sessionIdGenerator: () => randomUUID() (stateful, сессия в заголовке
      mcp-session-id, SDK ведёт её сам) — проверено тем же способом, работает на много запросов
      подряд одним зарегистрированным сервером. Windshift использует другой (Go) SDK другого
      вендора — поведение между реализациями одного протокола не гарантированно совпадает.

  - id: zod-output-schema-was-unnecessary
    type: plan
    date: 2026-09-05
    summary: >
      Изначальный план нёс отдельную точку поверхности /schema (zodTool) — предполагалось, что
      outputSchema требует ручной конвертации Zod → JSON Schema, тем же приёмом (z.toJSONSchema),
      которым apps/skin/.mcp/src/kit.ts уже строит io-схему для get_passport. Чтение исходников
      SDK (@modelcontextprotocol/sdk/server/mcp.js, normalizeObjectSchema/toJsonSchemaCompat)
      перед написанием кода показало: registerTool уже принимает настоящую Zod-схему в
      input/outputSchema напрямую и сам делает и конвертацию, и safeParseAsync-валидацию —
      z.toJSONSchema в kit.ts решает другую задачу (показать io-схему КАК ДАННЫЕ внутри ответа
      тула, не заявить outputSchema самого тула). Точка /schema снята, output стал просто полем
      ToolDefinition — меньше поверхности, тот же результат.

  - id: genus-tooling-decision
    type: plan
    date: 2026-09-05
    summary: >
      Пакет заведён user (packages/mcp, пустой на момент старта) как ответ на аудит
      apps/skin/.mcp: MCP скоро едет на сервер отдельно и станет основным способом создания
      скинов, важнее ручного редактора — значит дыры аудита (annotations, outputSchema,
      isError-конвенция, транспорт/auth, дублирование между будущими MCP-серверами разных зон)
      стоит закрывать один раз в общем месте, а не по зоне. User classified genus как tooling
      ("он тоже тулинг" — по аналогии с packages/build) — образцы доков взяты оттуда же, не из
      packages/store (engine).

  - id: v1-scope-agreed
    type: plan
    date: 2026-09-05
    summary: >
      Объём v1 согласован после трёх источников: 1) построчный аудит apps/skin/.mcp
      (kit.ts/mechanics.ts/validate.ts/tools.ts/store.ts/server.ts) — консолидированные тулы и
      actionable-флавы уже хороши, но annotations/outputSchema отсутствуют целиком, isError не
      используется никогда, list_presets без пагинации, транспорт только stdio; 2) внешний
      research — гайд Anthropic "Writing effective tools for AI agents" (консолидация тулов,
      семантические имена, actionable errors, response_format, eval-driven итерация) и спека MCP
      2025-06-18 (tools/annotations, outputSchema+structuredContent, isError, OAuth 2.1 для
      удалённых серверов); 3) внутренний образец — Windshift internal/aitools/registry.go
      (Access/Risk обязательны при регистрации, паника если не проставлены) и
      internal/mcp/server.go (Streamable HTTP + bearer-auth-мидлварь, уже едет на сервере). v1 —
      registerTool с обязательными annotations, ok/err с isError-конвенцией, zodTool для
      outputSchema, createServer (stdio/http + auth-хук), paginate. Сознательно вне v1 (см.
      категорию "Не в этом пакете"): сама проверка токена под конкретный бэк, response_format
      per-тула, eval-харнесс — все три обсуждались явно и отложены как задачи потребителя/зоны,
      не общего пакета.
