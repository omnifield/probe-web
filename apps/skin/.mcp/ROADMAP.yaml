# Дорожная карта apps/skin/.mcp — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/mcp/store (categories → items, log → журнал решений); без milestones.

categories:
  - category: Тулы
    items:
      - id: http-single-instance-wiring
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Агенты цепляются к поднятой службе по http, свои экземпляры не плодят
        description: |
          Означает: в .mcp.json зона записана как type http на http://127.0.0.1:3000/mcp вместо
          stdio-команды. Раньше каждая сессия поднимала СВОЙ процесс сервера; с появлением
          headless-браузера это стало дорого — по отдельному chrome-devtools-mcp на сессию, при том
          что смотрят все одну витрину. Теперь экземпляр один, а изоляция осталась на уровне
          вкладки: транспорт @web-core/mcp строит свой набор тулов на каждую MCP-сессию, вкладка
          замкнута внутри набора. Рядом заведён скрипт serve — тот же вход, но с SKIN_MCP_TRANSPORT
          http и SKIN_MCP_HOST 0.0.0.0, чтобы служба поднималась штатной командой, а не строкой из
          чужой памяти.
          Цена названа в FAQ.md: служба должна быть поднята до того, как агент подключится. Не
          поднята — сессия не увидит инструменты зоны, и это заметно сразу.
          Проверено живьём: две параллельные http-сессии получили разные вкладки (одна на витрине
          скина, другая на панели), снимки не пересеклись, процесс сервера один. Тем же адресом по
          имени хоста (http://web-core:3000/mcp) ходит внешний агент из соседнего контейнера.

      - id: feedback-status-and-resolve
        type: feature
        status: Done
        priority: High
        milestone: null
        name: resolve_feedback — разобранное уходит из списка заявок
        description: |
          Означает: у заявки появился статус. report_feedback пишет status "open", новая write-ручка
          resolve_feedback помечает разобранное (status "resolved", resolvedAt и note — чем кончился
          разбор), list_feedback по умолчанию отдаёт только открытые, а status "resolved"/"all"
          показывает остальное. Заявка без поля status — записанная до этой правки — считается
          открытой, поэтому старые записи из списка не исчезли. Удаления заявок нет вовсе: закрытая
          остаётся историей разбора.
          Статус лежит внутри state, а не отдельным полем записи: служба пресетов хранит state и не
          толкует его, учить хранилище одному конкретному виду записи ради фильтра неверно (FAQ.md).
          Переписывание идёт новым store.update через PUT, а не парой удалить-создать, как
          store.replace: у заявки, на которую уже сослались, id меняться не должен, и промежутка,
          где записи не существует, быть не должно тоже.
          Причина: живая заявка user — разобранное лежало в списке наравне с открытым, рядом с
          служебными записями от smoke-тестов, и отличить одно от другого было нечем. На восьми
          записях терпимо, на тридцати список читать перестанут.
          Проверено живьём на поднятом HTTP-сервере: восемь записей без поля status читаются как
          open; три служебные закрыты — open стало 5, resolved 3, id сохранились у всех восьми,
          текст заявок не изменился; повторное закрытие уже закрытой и закрытие несуществующего
          имени отбиваются isError с внятной причиной.

      - id: list-components-card-and-filters
        type: feature
        status: Done
        priority: High
        milestone: null
        name: list_components — карточка вместо выгрузки, фильтры group/footprint, пагинация
        description: |
          Означает: перечень перестал платить за все компоненты сразу. Карточка несёт то, на чём
          выбирают (род, группа, размерность, пакет, partsCount, имена сборок), а части, состояния
          и тексты means ушли в get_passport, который стоит одного выбранного компонента. Вход —
          {group?, footprint?, cursor?, limit?}, тем же paginate() из @web-core/mcp/pagination, что
          у list_presets/list_feedback/list_content; форма ответа {items, nextCursor?} у них теперь
          одна на всех. Список групп схема берёт из GROUPS кита, не повторяет литералом. group и
          footprint нормализуются через groupOf/footprintOf — компонент без явной группы попадает в
          other, без размера в regular, иначе фильтр не находил бы именно их.
          Причина: живая заявка внешнего агента, подтверждённая замером — один вызов без аргументов
          стоил 17358 символов (~5.3k токенов) на 35 компонентов, ни фильтра, ни курсора, при том
          что у соседних list_* пагинация была. Разбор веса показал, что дело не в количестве
          записей, а в их содержимом: тексты means весили 7404 символа, больше всех 237 имён частей
          вместе — пагинация одна эту дыру не закрыла бы.
          Проверено живьём на поднятом HTTP-сервере: без аргументов 8271 символ (~2.5k токенов,
          −52%), group:"inputs" — 2322 символа и 10 компонентов, footprint:"wide" — 6, limit:5 плюс
          cursor со второй страницы отдают разные наборы, неизвестная группа отбивается валидацией
          входа (isError), а не пустым списком.
          На момент правки partsCount был завышен у carousel (12 вместо 11) и date-picker (26
          вместо 25) — кит брал анатомию готовым объектом у надстройки и получал вместе с ней
          повторы. Чинилось это в самом ките (packages/ui, анатомия берётся у Zag), не дедупом
          здесь; после починки числа верные — 11 и 25.

      - id: browser-proxy-tools
        type: feature
        status: Done
        priority: High
        milestone: null
        name: browser_navigate/browser_screenshot — прокси через chrome-devtools-mcp
        description: |
          Означает: два новых read-тула — единственный способ в этой зоне реально УВИДЕТЬ вид
          (не только CSS-текст assemble_preview). engine/browser.ts держит ОДИН общий процесс
          chrome-devtools-mcp (headless, --isolated — свой профиль, не мешает ничьему
          интерактивному браузеру), подключён своим MCP-клиентом (@modelcontextprotocol/sdk).
          Изоляция — на уровне ВКЛАДКИ, не процесса: своя вкладка на MCP-сессию через замыкание в
          registerTools (оно и так зовётся заново на каждую сессию — packages/mcp/src/transport) —
          отдельная карта сессия→вкладка не понадобилась. pageId — числовой индекс страницы у
          chrome-devtools-mcp, тулы не отдают его отдельным полем, только текст со списком страниц
          и пометкой [selected] — newPage() разбирает регуляркой. Причина: готовим сервер к
          настоящему внешнему агенту без браузера на своей стороне — user сформулировал прямо
          (агент "либо ничего не сможет, либо будет раскачиваться пол дня" без визуальной
          обратной связи); прокси решает это без дублирования чужой рендер-механики. Найдено
          живьём: в этом контейнере chrome-devtools-mcp не нашёл Chrome по дефолтному пути —
          заведена SKIN_MCP_CHROME_EXECUTABLE (см. FAQ.md), плюс --chromeArg=--no-sandbox
          обязателен в контейнере (стандартная практика, не наш security-даунгрейд). Проверено
          живьём: navigate+screenshot на реальную витрину (button/default) вернул настоящий PNG,
          две ПАРАЛЛЕЛЬНЫЕ сессии на разные URL (button/checkbox) получили разные скриншоты без
          пересечения вкладок.

      - id: browser-click-and-snapshot-tools
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "browser_snapshot/browser_click — настоящий клик мышью, не переход по URL"
        description: |
          Означает: два новых read-тула поверх packages/mcp/src/browser's snapshot()/click().
          browser_snapshot — текстовое a11y-дерево своей вкладки, каждый узел с uid. browser_click —
          клик мышью по uid из СВЕЖЕГО снимка (uid может смениться после клика, если DOM
          обновился — снимать заново перед следующим кликом). chrome-devtools-mcp's click адресует
          только по uid, не по CSS-селектору — snapshot добавлен ВМЕСТЕ с click одной заявкой, не
          отдельно: без него click нечем было бы адресовать.
          Причина: живая заявка от внешнего агента — цитата: "Через нынешний browser_navigate я
          физически не могу повторить именно ту последовательность событий, где ловится баг" (баг с
          миганием ловится на клике по дереву внутри SPA — переход роутером, другой код-путь и
          таймінг, чем жёсткий browser_navigate). Заявка нашла и указала точную цепь (tools/index.ts
          → engine/browser.ts → packages/mcp/src/browser/index.ts, с номерами строк) — не абстрактная
          жалоба. Второй пункт заявки (трейсы производительности для ловли переходного кадра)
          сознательно НЕ реализован — сама заявка пометила это опциональным, более дешёвый путь
          (серия browser_screenshot без ожидания settle сразу после browser_click) уже доступен без
          единой новой строки существующими тулами; трейсы — только если этого не хватит на практике
          (см. FAQ.md).
          Проверено живьём: полный цикл navigate→snapshot→click→snapshot через реальный pnpm start —
          вторая a11y-снимка несёт текст, который выставил обработчик клика реальной кнопки. 21 тул
          (было 19), 18 read/3 write.

  - category: Документация
    items:
      - id: glossary-and-examples-first-technique
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Словарь + техника «сначала пример» — README/FAQ канон, instructions выжимка
        description: |
          Означает: новый раздел README.md «Словарь» (Palette/Form/Outfit/Assembly/Tag человеческим
          языком, не терминологией паспорта) плюс техника поиска примера через footprint/group
          (list_components) и variantTags (get_preset) перед тем, как писать recipe с нуля.
          `instructions` в server/index.ts — сжатая выжимка ИЗ README/FAQ, не отдельный текст:
          источник один, чтобы не разъехались. Причина: готовим сервер к настоящему внешнему
          агенту без доступа к репозиторию/Ark UI MCP/браузеру — единственный дешёвый способ дать
          ему опору есть уже готовые 27+ форм omnifield-*, просто раньше никто не говорил агенту
          явно "посмотри туда сначала". Ручки одни и те же у агента и у ручного пульта (тоже
          MCP-клиент) — значит и источник знаний должен быть один, не два текста, которые могут
          разойтись. Проверено живьём: client.getInstructions() после рестарта отдаёт актуальный
          текст.

  - category: Тулы
    items:
      - id: author-admin-guard
        type: feature
        status: Done
        priority: High
        milestone: null
        name: author + adminToken — единственная жёсткая граница в зоне
        description: |
          Означает: save_preset получил необязательные author/adminToken. По умолчанию — свободно,
          любой агент пишет с любым author. Защита срабатывает, только если author запроса ИЛИ
          author уже существующей записи с этим именем совпадает с SKIN_MCP_ADMIN_AUTHOR — тогда
          без верного SKIN_MCP_ADMIN_TOKEN отказ до записи (isError:true, служба не тронута).
          Причина: готовим сервер к настоящему внешнему агенту — нужна хотя бы одна граница, чтобы
          эталоны (omnifield-*) случайно не переписали, пока остальное остаётся полностью открытым
          (осознанно — "пока все учатся", по словам user, не финальная модель прав). Проверено
          живьём всеми шестью сценариями (без author / чужой author без токена / чужой author с
          неверным токеном / свой author с верным токеном / чужая перезапись уже защищённой записи
          даже без указания author / повторная запись с верным токеном) — каждый ведёт себя ровно
          так, как задумано. Все 30 omnifield-* записей (палитра, наряд, 2 тега, 27 форм) реально
          проставлены author:"Egor Raybul" через сам этот механизм — попытка переписать
          omnifield-button без токена живьём отказана.
          ЗАМЕНЕНО — см. author-ownership-model ниже: сам этот пункт честно предупреждал "не
          финальная модель прав", ADMIN_AUTHOR/ADMIN_TOKEN больше не существуют в коде.

      - id: author-ownership-model
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "author — владение, не админ: SKIN_MCP_ADMIN_AUTHOR/TOKEN убраны целиком"
        description: |
          Означает: authorGuard(kind, name, nextAuthor) сравнивает СТРОКИ — author запроса против
          author уже существующей записи. Совпадают (или у записи ещё нет author) — пишет. Не
          совпадают (включая запрос вовсе без author на занятой записи) — отказ, тот же isError:true,
          что раньше. Ни одного секрета (SKIN_MCP_ADMIN_TOKEN, adminToken-параметр save_preset/
          save_content) в коде и доке больше нет. Защита симметрична всем author, не одному
          хардкоженному "суперюзеру".
          Причина: живая заявка от внешнего агента (см. list_feedback) прямым текстом назвала слом
          старой модели — "агенту нельзя держать секреты, поэтому adminToken как аргумент ручки для
          него недоступен в принципе — если под защищённые имена ему писать нужно, это должно
          приезжать заголовком от нашей стороны, а не через него". User объяснил реальную модель:
          "имя автора будет передоваться с запросом... защищённого имени нет... юзер зашёл, зарегался,
          написал агенту, агент видит с кем он общается и работает только с ресурсами этого юзера" —
          identity приезжает С ЗАПРОСОМ от платформы (которая уже аутентифицировала своего юзера), не
          секретом, который держит агент.
          push-to-prod.mjs починен тем же духом: несёт author ИЗ КАЖДОЙ конкретной локальной записи
          (entry.state.author), не единый SKIN_MCP_ADMIN_AUTHOR/TOKEN из окружения оператора на весь
          прогон — так повторный пуш той же записи проходит владельческую проверку на проде.
          Проверено живьём шестью сценариями (новая запись без author открыта / кто угодно её потом
          правит / новая запись с author:"alice" занята / alice правит своё / bob получает отказ /
          запрос совсем без author получает тот же отказ) плюс контрольная проверка — попытка
          переписать omnifield-palette чужим author (без какого-либо токена, токена больше не
          существует) по-прежнему отказана. Реальные omnifield-*/amethyst-* остались защищены без
          единой миграции данных — поле author в них уже было.

      - id: report-feedback-tool
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: report_feedback — сырой репорт по любой ручке, отдельный kind
        description: |
          Означает: одиннадцатый тул, write, без проверки и без анализа на этой стороне —
          {tool, action, expected?, actual} кладётся как есть в службу пресетов, kind:"feedback"
          (шестой вид, backend/presets по-прежнему не толкует kind — бесплатно, как и tag раньше).
          Не смешивается с palette/form/outfit/assembly/tag в list_presets (тот KIND-enum не
          трогали). Причина заводить именно здесь, не в "Затыки" платформы внешнего агента: репорт
          про эту MCP-зону должен пережить смену агента/сессии/платформы, а не жить в чужой базе,
          которая завтра может уехать вместе с самим агентом. Проверено живьём реальным вызовом —
          {"saved":{"kind":"feedback",...}}, annotations {readOnlyHint:false,destructiveHint:false}.

      - id: list-feedback-tool
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: list_feedback — прочитать report_feedback обратно, постранично
        description: |
          Означает: четырнадцатый тул, read, читает kind:"feedback" (cursor/limit, по умолчанию
          50), каждый элемент сразу с содержимым (tool/action/expected/actual/at) — не только
          id/label, второй проход get_preset не нужен. get_preset/list_presets не годятся —
          feedback намеренно вне их KIND-enum (см. report-feedback-tool). Причина: план user —
          прод-инстанс (внешний агент, отдельная служба пресетов на VPS) копит заявки, локальная
          разработка их периодически стягивает для разбора через httpPeer (@web-core/mcp/peer);
          без своей ручки чтения это было бы сырым REST по чужой службе пресетов в обход MCP,
          нарушая тот же принцип "тулы, не сырой API", по которому сюда же попал report_feedback.
          Проверено живьём реальным round-trip (report_feedback → list_feedback через stdioPeer):
          сохранённая запись вернулась с полным state, заодно нашёлся настоящий старый репорт
          (check_form молча игнорирует variantTags без соответствующего recipe.variants вместо
          флава — отдельная, ещё не решённая находка).

      - id: push-to-prod-script
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "scripts/push-to-prod.mjs — перенос эталонов на прод-инстанс"
        description: |
          Означает: pnpm run push-to-prod читает локальную службу пресетов и пересохраняет
          tag→palette→form→outfit (в этом порядке — form сверяется с palette по имени, outfit
          резолвит form по имени) на прод-адрес из SKIN_MCP_PROD_URL, тем же author/adminToken, что
          и обычный save_preset. Обе стороны — через MCP-тулы (list_presets/get_preset локально,
          save_preset на проде через httpPeer), не сырой REST по backend/presets: прямой REST
          обошёл бы валидацию save_preset и мог бы записать битую форму на прод молча. Локальный
          конец скрипт поднимает сам (stdioPeer("pnpm",["start"])) — прод только адресуется.
          Причина: план user — прод-VPS раскатывается с нуля, эталоны толкаются туда точечно по
          мере готовности, обратный путь (заявки) — list_feedback. Проверено живьём: второй, полностью
          пустой backend/presets + второй apps/skin/.mcp в http-режиме на соседнем порту — все 30
          записей (2 тега, палитра, 27 форм, наряд) перенесены без единого отказа; отдельно
          проверена защита — неавторизованная перезапись omnifield-palette на этом «проде» без
          adminToken отказана тем же isError:true, что и локально.
          ОБНОВЛЕНО — см. author-ownership-model: adminToken из этой цепочки убран, скрипт несёт
          author ИЗ КАЖДОЙ записи (entry.state.author), не единый env-параметр.

      - id: migrated-to-web-core-mcp
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Все десять тулов — через @web-core/mcp
        description: |
          Означает: registerTool/ok/err вместо прямых вызовов SDK — каждый тул размечен access
          (девять read, save_preset write), isError по спеке (раньше даже настоящие отказы
          уезжали isError:false), list_presets с курсорной пагинацией. z теперь только из
          @web-core/io (был отдельный "zod" в зависимостях).

      - id: outfit-tags-for-navigation
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Теги наряда (kind:"tag" словарь, дефолт, проверка)
        description: |
          Означает: Outfit.tags?: string[] — навигация по множеству вариантов одной сборки
          (витрина + агент), не влияет на механику сборки. Пусто/не передано → ["default"].
          Каждый тег сверяется со словарём (kind:"tag", пятый вид пресета — просто реестр имён,
          без списка участников: принадлежность живёт на наряде, не дублируется). Неизвестный тег
          — флав unknown-tag той же формы, что unknown-palette, в check_outfit и save_preset.
          Найдено живьём: имя тега — тот же slug-формат backend/presets, что и любой name
          (кириллица отказывает bad_name) — человекочитаемый текст только в label конверта.

      - id: form-variant-tags-second-layer
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Теги на значении варианта формы (Form.variantTags) — второй слой той же механики
        description: |
          Означает: Form.variantTags?: {[имя значения recipe.variants]: string[]} — та же машинерия
          (resolveTags/checkTags), что и Outfit.tags, приложена на другом уровне: не на весь
          наряд, а на КАЖДОЕ значение оси варианта формы отдельно. Ключи берутся из recipe.variants
          сохраняемой формы; значение без явного тега получает ["default"], неизвестный тег даёт
          unknown-tag с адресом variantTags.<имя>, в check_form и save_preset(kind:"form").
          Причина: живой тест на реальной кнопке (omnifield-button) показал, что "разные кнопки" —
          не разные наряды, а разные значения ОДНОЙ оси variants внутри ОДНОЙ формы (primary/
          secondary/tertiary/error/success/warning/error-quiet) — тег на весь Outfit был бы неверен.
          Проверено живьём реальным сохранением: error/success/warning → ["status"], остальные
          четыре значения молча получили ["default"], css пропадает из ответа check_form вместе с
          флавом (не только referenceFlaws), чтобы сигнал не был противоречивым.

      - id: tags-mechanics-moved-to-packages-skin
        type: refactor
        status: Done
        priority: High
        milestone: null
        name: Чистая механика тегов переехала в @web-core/skin/tags
        description: |
          Означает: sortTags/checkTags(tags, knownTags, where)/groupByTag больше не определены
          локально в tools/index.ts — зовутся из @web-core/skin/tags (написан user по заявке
          архитектора в чате). Причина: витрина (apps/skin/src) читает пресеты напрямую из
          backend/presets, минуя MCP — чистая (без сети) механика, оставленная только здесь,
          заставила бы витрину дублировать её при рендере группировки. engine/validate.ts's
          checkTags остался тонкой И/О-обёрткой (ходит в store.list("tag") за словарём, строит Set,
          зовёт чистую функцию) — внешняя сигнатура не изменилась, tools/index.ts's
          resolveTags/resolveVariantTags правок на этом стыке не потребовали. check_form при
          ok:true теперь дополнительно отдаёт tagGroups (считался и раньше внутри
          resolveVariantTags, но нигде не использовался) — внешнему агенту, у которого нет доступа
          к npm-пакету, иначе неоткуда взять готовую раскладку под свайперы. Проверено живьём
          реальным HTTP round-trip после рестарта сервера: известные теги группируются верно
          (default первым), неизвестный по-прежнему даёт unknown-tag — поведение не изменилось.

      - id: negative-report-is-not-protocol-error
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Флав-отчёт — business-данные, не отказ протокола
        description: |
          Означает: check_*, отказ валидации внутри save_preset, OutfitRefused/SkinRefused внутри
          assemble_preview — все isError:false, потому что тул выполнил операцию (проверил),
          просто результат отрицательный. Отказ протокола (isError:true) — только для не
          найденного по имени и сломанной формы входа. См. FAQ.md.

