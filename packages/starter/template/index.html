<!doctype html>
<!-- Опознание скина стоит на ЭТОМ узле, но пишет его не разметка: скин у тебя свой, и его имя
     здесь было бы литералом чужого имени в файле, который положен один раз и обвесом больше не
     обновляется. Пока скина нет, на корне нет ничего — и это рабочее состояние, а не пустое
     место, которое надо чем-то заполнить.

     Режима тут тоже нет и быть не может: он половина скина, а не свойство документа. На голом
     приложении ставить его некуда, поэтому вспышке светлой темы перед тёмной взяться неоткуда
     — вида нет вовсе. Базовый слой объявляет браузеру, что страница умеет обе пары, и голая
     страница следует за настройкой человека сама. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
    <!-- Оформление ПОТРЕБИТЕЛЯ — то есть твоё. Кит безголовый: примитив не везёт ни одного
         класса по умолчанию, зато ставит зацепку data-slot ДО спреда пропсов. Цепляешься за
         неё — и одеваешь весь кит разом, а не каждую кнопку поимённо.

         ЦВЕТА В ЭТОМ БЛОКЕ НЕТ, И ЭТО НЕ НЕДОДЕЛКА. Цвет приходит скином, скин — единица
         (переменные и правила вида вместе), и половины его поставка не везёт: цвета у того,
         чего не сшили, быть не может. Цветовые роли до надетого скина ПУСТЫ, опираться на них
         нельзя, а свой цвет литералом здесь означал бы вид от фреймворка — ровно то, от чего
         продукт уходит. Размерные шкалы работают и без скина: у них есть подстраховки, и
         пример берёт только их.

         ИМЕНА ТОКЕНОВ НИЖЕ — из набора значений, подключённого в main.tsx. Наш набор стоит там
         умолчанием, но обязательным не является: взял значения на стороне — поставь сюда имена
         СВОЕГО поставщика. Правило твоё целиком, и наших имён оно знать не обязано.

         Блок показывает ПРИЁМ и намеренно мал. Скелет положен один раз, обвес в него больше
         не заглянет — значит всё, что здесь написано, замёрзнет у тебя навсегда, и дизайн-
         системе в нём не место. Свой CSS клади отдельным файлом рядом с main.tsx, импортируй
         его там же, а этот блок убирай. -->
    <style>
      [data-slot="button"] {
        padding: 0.5rem 0.875rem;
        border: 1px solid currentColor;
        border-radius: var(--radius-md);
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- #root — часть замороженной поверхности: mount() ищет его сам. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
