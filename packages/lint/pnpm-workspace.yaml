# Проект-потребитель подключает пресет как УСТАНОВЛЕННЫЙ пакет (`workspace:*` → симлинк на
# корень), а не относительным путём в исходники. Иначе тест проверял бы файлы на диске, а не
# то, ради чего он есть: что чужой ESLint разрешает пакет по `exports` и поднимает `dist`.
packages:
  - test/consumer

# Поставлено pnpm при установке: `eslint@10.8.1` вышел недавно, и политика minimum-release-age
# держала бы его в карантине. Версия нужна именно текущая — под ней проверяется пресет.
minimumReleaseAgeExclude:
  - eslint@10.8.1
