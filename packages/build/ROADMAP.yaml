# Дорожная карта зоны build — формат тот же, что у packages/ui (см. её ROADMAP.yaml, шапка).
# Единственный источник правды: статус проставляется рядом с работой. Пункты по конкретной теме
# — в её собственном src/<тема>/ROADMAP.yaml; здесь — то, что касается зоны целиком.

categories:
  - category: Темы
    items:
      - id: vite-theme
        type: feature
        status: Done
        priority: High
        milestone: null
        name: vite — конфиг приложения и библиотеки
        description: Подробности — src/vite/ROADMAP.yaml.

      - id: vitest-theme
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: vitest — пресет тест-раннера
        description: Подробности — src/vitest/ROADMAP.yaml.

      - id: tsconfig-theme
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: tsconfig — фронтенд-профиль типов
        description: Подробности — src/tsconfig/ROADMAP.yaml.

      - id: node-theme
        type: feature
        status: Done
        priority: High
        milestone: null
        name: node — TS-раннер и профиль для серверов без Vite
        description: |
          Означает: у зоны появился путь для серверного TS помимо Vite — до этого серверы
          (`products/presets`, `products/skin/.mcp`) писали JS руками, потому что альтернативы
          не было.
          Подробности — src/node/ROADMAP.yaml.

  - category: Не сделано
    items:
      - id: rebuild-test-suite
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: Восстановить настоящие пробы зоны
        description: |
          Означает: раньше зона проверялась настоящей сборкой тестового приложения, реальными
          HTTP-запросами к дев-серверу и разбором тарбола `pnpm pack` — сейчас `test/` в
          репозитории нет вовсе (снесён вместе с `tools/dev-nav`, PWEB-124, попутно). Сейчас
          зона проверена только вручную (build/typecheck/смок-тесты) в рамках текущей правки,
          не автоматическим прогоном. См. FAQ.md.

      - id: migrate-existing-js-servers
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: Перевести products/presets и products/skin/.mcp на TS
        description: |
          Означает: инструмент (тема `node`) готов, серверы ещё не переведены — это задача
          владельцев тех зон, не `build`.

log:
  - id: json-configs-ship-via-dist
    type: plan
    date: 2026-09-04
    summary: >
      `/tsconfig`, `/tsconfig-node` и bin `probe-web-node` переехали с прямой ссылки на `src/`
      на `dist/` (копируются туда шагом сборки). Причина — npm/pnpm ВСЕГДА включает `README.md`
      любой директории, участвующей в `files`, независимо от `!`-негейшенов: пока конфиги
      отдавались прямо из `src/tsconfig/`+`src/node/`+`src/shared/`, в тарбол утекали доки этих
      тем. Через `dist/` (там документов нет) поставка снова чистая — только код и конфиг,
      `files` вернулся к `["dist", "README.md"]`, как у `packages/ui`.

  - id: docs-restructure
    type: plan
    date: 2026-09-04
    summary: >
      Зона переведена на структуру packages/ui: код разложен по темам (`src/vite`, `src/vitest`,
      `src/tsconfig`, `src/node`, `src/shared`), у каждой темы своя триада README/FAQ/ROADMAP.yaml,
      объёмная проза вынесена из комментариев кода в доки — в коде остались короткие пометки.
      Скелет (заголовки, формат FAQ, схема ROADMAP.yaml) взят у ui один в один; содержание —
      своё, под домен зоны (конфиги, не визуальные компоненты).

  - id: js-source-extensions-removed
    type: plan
    date: 2026-09-04
    summary: >
      `SOURCE_EXTENSIONS` дев-алиаса (`src/vite/workspace-source.ts`) больше не ищет исходник
      соседа в `.js`/`.jsx`/`.mjs` — только `.ts`/`.tsx`/`.mts`. Причина: правило репозитория
      «дев-пространство — TS-only», алиас не обязан легитимизировать JS-исходник соседа поиском.

  - id: node-theme-added
    type: plan
    date: 2026-09-04
    summary: >
      Добавлена тема `node` (`/tsconfig-node` + бинарник `probe-web-node`) — ответ на то, что
      серверы в репозитории писали JS руками не по выбору, а из-за отсутствия TS-пути. Разбор
      решения (`bundler`, не `nodeNext`) — src/node/ROADMAP.yaml.
