  - category: Открытое
    items:
      - id: agent-tooling-by-the-book
        type: feature
        status: Open
        priority: High
        milestone: null
        name: Инструмент для агента, сделанный по правилам, а не «отдать всё, что нашлось»
        description: |
          Означает: набор ручек, где каждая отвечает на ОДИН вопрос и отдаёт ровно то, что у неё
          спросили. Сегодня не так: ручка отдаёт всё, что нашла про предмет, и растёт вместе с
          предметом. Разбор, почему это дефект устройства, а не «данных много» — FAQ.md.

          Правила, которые задают целевое состояние (спека MCP и практика её применения, сверено
          2026-09-08):

          1. Ручка атомарна: одно понятие — один адрес. Паспорт отдаёт паспорт; анатомия, сборки,
             ио и слайс редактора — свои ручки. Смешивать пять понятий под одним именем нельзя,
             даже если все пять лежат рядом в памяти.
          2. У ответа есть предел. В каркасе — верхняя граница длины (порядок 25 000 символов,
             ровно столько же в токенах режет клиент на своей стороне). Ответ длиннее не
             отдаётся молча: он обрезается ЯВНО, с пометкой, что обрезано, и с подсказкой, каким
             параметром сузить запрос.
          3. Список отдаётся страницей. limit с разумным умолчанием (20–50), курсор, признак
             «есть ещё». Не «весь список, потому что он пока короткий».
          4. Большое отдаётся ссылкой, не телом. В спеке для этого есть resource_link: ручка
             возвращает URI, клиент читает его, когда данные реально понадобились. Полотно CSS —
             ровно этот случай.
          5. Сериализация без украшений: компактный JSON, а не с отступами. На нашем ответе
             отступы стоили 58% длины. Дублирование строки и structuredContent при этом ОСТАЁТСЯ —
             оно требуется спекой ради совместимости, и вычёркивать его нельзя.

          Работа лежит в каркасе (packages/mcp: предел ответа, страницы по умолчанию, ресурсы) и в
          зоне-потребителе (apps/skin/.mcp: разрезать ручки по понятиям). Здесь пункт стоит
          потому, что предмет у этих ручек — паспорт, анатомия, сборки и рецепт, то есть понятия
          этого пакета: пока их границы размыты в инструменте, размыты они и для того, кто им
          пользуется.

      - id: contrast-consumer
        type: feature
        status: Open
        priority: Low
        milestone: null
        name: Потребитель для skinContrast
        description: |
          Означает: витрина/редактор, реально показывающие предупреждения о читаемости —
          механика готова, вызывающего пока нет.

      - id: editor-plugin-surface
        type: feature
        status: Open
        priority: Low
        milestone: null
        name: Формальный плагин для будущего редактора скина
        description: |
          Означает: когда появится редактор палитр/форм/нарядов, то, что ему реально понадобится
          из сегодняшних внутренних шестерёнок (семена, адресные селекторы), оформляется своим
          плагином — не раскрывается заранее вслепую.
