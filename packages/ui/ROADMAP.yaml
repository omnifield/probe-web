  - category: Данные списков и деревьев
    items:
      - id: unified-item-collection-engine
        type: feature
        status: Done
        priority: High
        name: "Единый канон элемента (value/label/children?) и один аксесорный слой — без обхода сбоку ни для одного компонента"
        description: |
          Решение user дословно: "давай все делать по канону, никаких поверх или сбоку. все в
          одном флоу и в одном каноне" — ни у одного компонента, включая accordion, не остаётся
          своя параллельная форма данных. Полный список компонентов кита, работающих с массивом/
          деревом элементов, сверен по факту (`entity/io.ts` каждого), не по памяти:

          - `accordion` — НЕ плоский `items`: `sections[].items`, у секции свои `id`/`title`/
            `activeValues`, у листового item — `{value, label}`.
          - `tabs` — плоский `items: {value, label, content}[]`.
          - `listbox`/`select` — плоский `items: {value, label}[]`.
          - `tree-view` — `items: TreeItem[]`, `TreeItem = {id, label, children?}` — узел зовётся
            `id`, не `value`, единственный такой во всём ките.
          - `menu` — `entity/io.ts` ещё не существует, компонент не реализован до конца. Строить
            сразу на каноне, миграции не будет.
          - `carousel` — massив НЕ использует вовсе (`{slide1, slide2, slide3}`, фиксированные
            слоты) — другая, более глубокая проблема (не список, а жёстко заданное число слотов).
            Осознанно ВНЕ этой заявки, не заворачивать сюда попутно.

          Почему один канон технически верен, а не просто "красивее": в самом Zag коллекция
          (`@zag-js/collection`, `ListCollection`/`TreeCollection`) — самостоятельный класс, не
          привязанный к конкретной машине. Сверено грепом по ВСЕМ установленным `@zag-js/*`
          пакетам на импорт `@zag-js/collection`: используют его только `select`/`combobox`/
          `cascade-select`/`listbox`/`tree-view` — машинам, которым НАДО самим обходить данные
          (клавиатурная навигация, поиск по вводу, виртуализация/async-подгрузка). `accordion`/
          `tabs`/`menu` коллекцию не подключают вовсе — их машина хранит только `value` открытых/
          выбранных элементов, перечисление уже даёт сам рендер (`.map()` по массиву в JSX). Но
          `ListCollection`/`TreeCollection` НИЧЕМ не мешают быть использованными и там — просто как
          нормализатор на стороне кита, не как проп машины. `tree-view/components/root.tsx` УЖЕ
          так делает: `createTreeCollection({nodeToValue: node => node.id, nodeToString: node =>
          node.label})` — ровно этот приём, просто самодельный и не общий. `@ark-ui/solid` (кит
          уже ходит за коллекцией через него, не мимо) реэкспортирует весь набор целиком —
          `createListCollection`/`createTreeCollection`/`CollectionItem`/`TreeCollection`/…

          Канон: `item = {value: string, label: string, children?: item[]}` — рекурсивный, глубина
          не ограничена сверху. "Секция" `accordion` — НЕ отдельная форма, а такой же `item` с
          `children` (группа — узел с детьми, не параллельная сущность); если после проверки
          реального использования группировка accordion'у не нужна вовсе — убрать её, не тащить
          пустую форму ради формы. Подменю `menu` — та же связь через `children`, не своя схема.

          Куда класть (место уже есть, не новая папка):
          1. `shared/data/fields.ts` — рекурсивный фрагмент `item` рядом с `fields.labeled`, тем
             же приёмом (spread в `entity/io.ts` каждого компонента, не копия текста).
          2. `shared/utils/collection.ts` — перестаёт быть голым реэкспортом
             `createListCollection`; добавляются `createItemListCollection(items)`/
             `createItemTreeCollection(root)` — тонкие обёртки над `createListCollection`/
             `createTreeCollection` (те же, что уже реэкспортированы, из `@ark-ui/solid`) с нашими
             аксесорами (`itemToValue`/`itemToString`, `nodeToValue`/`nodeToString`/`nodeToChildren:
             n => n.children ?? []`) зашитыми внутрь — компонент их не пишет каждый раз заново,
             как сегодня делает `tree-view`.

          По компонентам:
          - `accordion` — `sections`/`id`/`title`/`activeValues` уводятся целиком, io-схема
            переходит на плоский (или вложенный через `children`, если группировка реально нужна)
            канонический `item`. Это касается и рендер-кода (`components/`), не только `io.ts`.
          - `tabs`/`listbox`/`select` — форма уже `{value,label}`, переводятся на общий фрагмент
            `item` через spread вместо локального `z.object`; свои поля сверх канона (у `tabs` —
            `content`) остаются — канон это пол, не потолок.
          - `tree-view` — `id` → `value` (канон), `root.tsx`'s ручной `createTreeCollection`
            меняется на `createItemTreeCollection` из `shared/utils`. Проверено (2026-09-09,
            внешний стенд): живых `content`-записей на `tree-view` — 0, только рецепт/наряд
            (стиль), переименование поля контента ничего не ломает.
          - `menu` — реализуется на каноне с нуля, миграции нет.
          - `carousel` — не трогать в этой заявке (см. выше).

          Тесты — по образцу, что уже принят в остальных зонах: не верить, что `ListCollection`/
          `TreeCollection` со старыми/новыми полями работают "по факту одинаковых сигнатур" —
          прогнать реальный рендер каждого мигрированного компонента с данными нового канона,
          сверить, что value/label/children доходят до DOM/машины так же, как раньше.

          Сделано (2026-09-09): `fields.item`/`createItemListCollection`/`createItemTreeCollection`
          на месте, все пять компонентов переведены, реальный рендер прогнан (271 тест кита зелёные,
          нетронутые 2 падения `shipped-artifact.test.ts` — старые, про lucide dist, к этой заявке
          не относятся). `accordion` — group нужен по факту (5 живых content-записей и сборка
          `action-list` реально используют её), убирать не стали; `sections`/`id`/`title`/`items`
          переведены на канонические `items`/`value`/`label`/`children`, 5 живых content-записей
          (`accordion-*`) при этом сломаны намеренно — user подтвердил дословно "не будем из-за
          полумёртвого потребителя резать флоу", правка content — отдельная задача не в этой зоне.
          `menu` — реализован ТОЛЬКО плоский список (новая сборка `list`, `entity/io.ts` на каноне);
          чекбокс/радио/группы/разделители/подменю из данных осознанно вынесены за скобки (см.
          `menu-data-driven-rich-items` ниже), сборка `basic` (статичная, ручная) не тронута.

          Побочная находка, не мой инструмент чинить (packages/skin, не packages/ui): рекурсивный
          `item` в `Data` ломает `Paths<T>` (`packages/skin/src/engine/passport/assembly/paths.ts`)
          — вместо union путей типизация схлопывается в один вырожденный тип
          (`"children/children/children/children/children/children"`), `tsc` валит сборку. У
          `tree-view` это было обойдено ещё раньше (родовой параметр `Data` у `PassportAssembly` не
          передаётся вовсе, путь проверяется как голый `string`) — тем же приёмом обошли `accordion`
          и `menu`. Строгая проверка путей `repeat`/`bind` для ЛЮБОГО компонента с рекурсивными
          `children` в данных сейчас не работает в принципе, не только у этих трёх — на заметку
          architect/владельцу `packages/skin`.

      - id: menu-data-driven-rich-items
        type: feature
        status: Backlog
        priority: Medium
        name: "menu — чекбокс/радио/группы/разделители/подменю из данных, не только плоский список"
        description: |
          Отложено при `unified-item-collection-engine` (2026-09-09) — user дословно: "бери плоский
          список, потом им займёмся нормально". Канонический `item` (`value`/`label`/`children?`)
          закрывает только плоский список и в теории подменю через `children`; чекбокс/радио/
          разделитель/подписанная группа своей формой в канон не укладываются — нужен отдельный
          дискриминатор (`type`/`checked` и т.п.), которого канон не описывает. Требует
          проектного решения по форме данных, не просто миграции на существующий канон.
          `basic` (статичная сборка, живой пример всех видов пунктов руками) и `list` (плоский
          список из данных, сборка `playground/assemblies/list.ts`) остаются как есть, не трогать
          при реализации — это уже сделано.

  - category: Скин
    items:
      - id: component-skin-wiring
        type: feature
        status: Done
        priority: High
        name: "Каждый компонент кита сам себя одевает — useComponentSkin(passport, props) вместо RenderNode"
        description: |
          План владельца packages/skin, обсуждён с user 2026-09-11, ждём отмашку архитектора —
          в коде ничего не менялось, только согласование.

          Правки только в двух местах — packages/skin (владелец) и packages/ui (эта зона, ~35
          файлов). Бэк (backend/presets) и packages/assembly не трогаются вообще: бэк уже отдаёт
          presets(kind, component) — резать по значению variant/setting нужно ВНУТРИ одного JSON-
          рецепта (весь компонент приезжает одним небольшим объектом), это задача клиента, не
          сети. assembly не звонит assemble()/checkOutfit() ни разу (подтверждено владельцем) —
          вызов теперь на стороне кита, не через RenderNode.

          На стороне packages/skin (не моя работа, для контекста цепи):
          1. Узкая печать в engine/rules/engine/generate — берёт провалидированный на wear()
             рецепт компонента и печатает (а) base+defaultVariant ОБЯЗАТЕЛЬНО вместе при первом
             обращении (иначе движок ложно решит, что дефолта нет), (б) одно значение variant по
             запросу, (в) одно значение одной настройки по запросу, (г) compoundVariants, полностью
             покрытые уже загруженными значениями — только по variant, у settings пересечений с
             variant в модели нет (CompoundVariant не знает про settings).
          2. ensureComponentSkin(component, axis, value) — кеш+оркестрация (сеть/печать/доклейка в
             лист), в wear/switch.ts либо новый модуль рядом.
          3. useComponentSkin(passport, props) в solid/ — реактивный хук: следит за
             props[passport.variantAxis.mark.name] и props[каждый settings[name].mark.name], на
             каждое НОВОЕ значение зовёт ensureComponentSkin. Без <SkinProvider> в дереве — не
             падает, просто ничего не делает (отличие от useSkin(), который кидает throw вне
             провайдера — осознанно: кит обязан жить и без скина вообще).

          На стороне packages/ui (моя работа):
          - В каждый components/root.tsx (~35 компонентов) — новый импорт
            `import { passport } from "../entity/passport.js"` (значение, не только тип) и вызов
            `useKitLife(passport, props)` сразу после сигнатуры функции, до useSlot/useAddress.
          - Риск рантайм-цикла (root.tsx → entity/passport.ts → type ButtonProps из
            components/index.js) проверен и закрыт: tsconfig везде `verbatimModuleSyntax: true` +
            `isolatedModules: true`, и ВСЕ ~35 entity/passport.ts уже берут пропсы через
            `import type` (не просто договорённость — компилятор обязан стереть это на сборке).
            Направление components → entity уже существует (root.tsx и так тянет anatomy.js из
            entity/), новый импорт passport — тот же вектор, не новый паттерн.
          - Вместо двух строк на файл (traceLife("ui.<component>") + useComponentSkin(passport,
            props)) — одна утилита `useKitLife(passport, props)` в
            packages/ui/src/shared/utils/skin-life.ts (рядом с trace.ts/slot-chain.ts), внутри
            зовёт обе. Метка трейса выводится как `ui.${passport.component}`, не хардкодится
            руками в каждом файле — passport.component берётся из data-scope, который сама
            анатомия задаёт через `.rename("segment-group")` и т.п. (engine/passport/form/
            passport.ts:40,78) — это ТА ЖЕ строка, что сейчас руками вбита в traceLife("ui.segment-
            group"), просто без риска расхождения при будущем переименовании компонента.
          - Button как образец: entity/passport.ts уже импортирует `type ButtonProps` из
            components/index.js, settings пустые (defineSettings<ButtonProps>()({})) — хук будет
            следить только за variantAxis, алгоритм не ломается на пустом списке настроек.

          Сделано (2026-09-11): владелец packages/skin выкатил свою часть тем же днём
          (component-skin-on-demand, отдельная запись в его ROADMAP) — `useComponentSkin`
          реально экспортирован из `@web-core/skin/solid`, дист пересобран. На стороне packages/ui
          — `useKitLife(passport, props)` в `shared/utils/skin-life.ts`, добавлен в 32 из 33
          root.tsx (импорт `passport` как значение + вызов сразу после сигнатуры функции). `toast`
          сознательно пропущен — известный архитектурный аутсайдер (`_props: Record<string,
          never>`, ни variant, ни settings передать некуда), трогать без отдельного решения не
          стал.

          Найден и закрыт реальный (не мой) баг на стыке: первая версия `useComponentSkin`
          требовала `props: Readonly<Record<string, unknown>>` — индексную сигнатуру, которой НЕТ
          у обычных интерфейсов пропсов (`AccordionRootProps`, `DialogRootProps` и т.п. от
          `@kobalte/core`/`@ark-ui/solid`), только у полиморфных (`PolymorphicProps<T, ...>`).
          typecheck падал на 24 из 32 файлов. Не обходил `as`-кастом на своей стороне (это чужая
          сигнатура, костыль спрятал бы реальный гап) — эскалировал владельцу packages/skin;
          починка пришла как `props: object` в `useComponentSkin` (фактический каст внутри самой
          функции). `useKitLife` под это же поправлен.

          Проверено: `pnpm run generate && pnpm run typecheck && pnpm run build && pnpm run test
          && pnpm run lint` — всё зелёное, 275/275 тестов кита, build без новых ошибок (только
          штатные предупреждения rollup про внешние зависимости, не новые).

      - id: toast-address-and-skin-hook
        type: bug
        status: Done
        priority: High
        name: "toast — ни одна из 5 частей не адресована (нет data-scope/data-part), поэтому скин не мог лечь физически"
        description: |
          Найдено user живьём (2026-09-12) после [[component-skin-wiring]]: «сейчас по стилям все
          ок, и каждый запрашивает стили сам кроме тостера» — то есть у ВСЕХ остальных компонентов
          скин реально лёг, у toast — нет.

          Причина в ДВА слоя, не в одном:

          1. `Toast` не звал `useKitLife`/`useComponentSkin` — печать CSS для него не запрашивалась
             вообще (это и было названо при выкатке [[component-skin-wiring]] как «сознательный
             пропуск», но там это объяснялось только отсутствием variant/settings пропсов —
             объяснение оказалось НЕПОЛНЫМ, см. пункт 2).
          2. Даже если бы звал — стили физически не могли бы совпасть ни с одним узлом DOM.
             Проверено по исходнику `@zag-js/toast` (`toast.connect.mjs`): машина Zag НЕ ставит
             `data-scope`/`data-part` сама, только `id`/`aria-*`. Эти атрибуты — целиком
             ответственность кита, их даёт только `anatomyParts.<часть>.attrs`
             (`@zag-js/anatomy`'s `.build()`, `create-anatomy.mjs:14-19`: селектор буквально
             `&[data-scope="…"][data-part="…"]`). В `toast/components/root.tsx` этого не было НИ НА
             ОДНОМ из 5 узлов (`ArkToaster`/`ArkRoot`/`ArkTitle`/`ArkDescription`/
             `ArkCloseTrigger`) — они рисовались голыми пропсами. Для сравнения: `accordion`
             (тоже без `useAddress` на своём root.tsx) не задет тем же образом, потому что там
             ВЕСЬ реальный вид лежит на дочерних `item/control.tsx`/`content.tsx`/`indicator.tsx`,
             которые адресуются отдельными файлами (`{...dropAddress(props)}
             {...anatomyParts.control.attrs}`) — у toast ЖЕ вообще нет отдельных файлов на части,
             всё рисует один `root.tsx`, и адреса не было вообще ни на одной.

          Проверено, что `playground/recipe.ts` у toast полноценный и рабочий (доказан
          `test/recipe.test.tsx`) — паспорт и рецепт готовы давно, не хватало только подключения
          в живом компоненте. Проверено и то, что `ensureComponentSkin` печатает `base` ВСЕГДА,
          независимо от того, накоплен ли хоть один variant (`scopeRecipe` копирует `base`
          безусловно, `accumulatorFor` в `presets/lazy.ts` сеет `variants` дефолтным вариантом
          формы, если он объявлен, но `base` не зависит от этого множества вовсе) — значит просто
          вызов `useKitLife` уже дал бы печать, а вот совпадение в разметке без адреса — нет.

          Фикс (обе части, в `packages/ui`, не трогая `packages/skin`):
          - `useKitLife(passport, props)` в `Toast` (переименовать `_props` → `props`, тип
            `ToastProps` не меняется).
          - `{...anatomyParts.group.attrs}` на `ArkToaster`, `{...anatomyParts.root.attrs}` на
            `ArkRoot`, `{...anatomyParts.title.attrs}` на `ArkTitle`,
            `{...anatomyParts.description.attrs}` на `ArkDescription`,
            `{...anatomyParts.closeTrigger.attrs}` на `ArkCloseTrigger` — прямой спред литералом,
            как у `accordion/components/item/control.tsx`, без `dropAddress` (у `Toast` нет
            внешних consumer-пропсов, которые могли бы принести чужой адрес, — `ToastProps` пуст).
          - Проверено по типам Ark (`@ark-ui/solid/dist/components/toast/index.d.ts`): `Toaster`/
            `ToastRoot`/`ToastTitle`/`ToastDescription`/`ToastCloseTrigger` — все `PolymorphicProps`
            + `HTMLProps`, произвольные атрибуты долетают до DOM без проблем.

          Не архитектурная правка, не новая механика — обычное подключение уже существующей
          адресации, которого не было сделано при первой сборке toast. `control.ts`/`getToaster()`/
          портал не трогаются.

          Сделано (2026-09-12): `useKitLife(passport, props)` (переименован `_props` → `props`) +
          `{...anatomyParts.<часть>.attrs}` на всех пяти узлах в `toast/components/root.tsx`.
          Новый `test/toast.test.tsx` — реальный рендер `<Toast />` + живой `toast.create(...)`,
          проверка `[data-scope="toast"][data-part="…"]` на все пять частей (не только рецепт на
          бумаге, как раньше делал единственный `recipe.test.tsx`). README/FAQ поправлены — старое
          объяснение «нечем кормить useKitLife» было неполным, реальная причина была в отсутствии
          адресации (см. FAQ.md). `generate && typecheck && build && test && lint` — зелёные,
          276/276 тестов кита (было 275, +1 новый).

      - id: workspace-grid-columns-not-variant-scoped
        type: bug
        status: Backlog
        priority: High
        name: "Workspace — gridTemplateColumns/Rows в base, общие на все варианты — сборке stacked нечем ими не быть"
        description: |
          Найдено живьём (architect+user, 2026-09-14/15): `apps/skin/src/pages/index.tsx` не рендерит
          `WorkspaceSidebar`/`WorkspaceRightbar`/`WorkspaceFooter` вовсе (только `Header`+`Outlet`
          внутри `WorkspaceMain`), но сетка всё равно резервирует под них колонки — пришлось обходить
          инлайновым `style`-оверрайдом прямо в апп, с явным комментарием в коде о причине. Дословно
          user: «у меня вообще не стоят части ни райт ни сайт бары. при этом грид зачем-то рисуется.
          тут что-то странное».

          Причина — `playground/recipe.ts`: `gridTemplateColumns`/`gridTemplateRows` лежат в
          `base.root.props`, ОБЩИЕ на все варианты (`sidebar-first`/`header-first`/`header-full`) —
          различается только `gridTemplateAreas`. Все три существующих варианта предполагают все три
          колонки (sidebar/main/rightbar) — колонки/строки, задуманные как «структура сетки», на
          самом деле часть КОНКРЕТНОГО варианта, не общий инвариант компонента.

          Важно: сборка (`PassportAssembly`) для ИМЕННО этого случая уже существует —
          `playground/assemblies/stacked.ts` («шапка во всю ширину, показ под ней, без колонок
          вовсе», `{TOPBAR, STAGE}` — ровно header+main). Разрыв ровно там, где сборка (структурное
          дерево, JSX) не встречается с формой (CSS-рецепт, `variants`): для `stacked` нет
          соответствующего варианта в `recipe.ts`, и колонки из `base` навязываются, даже когда JSX
          их не рисует вовсе.

          Планируемый фикс (не финальный, за владельцем): убрать `gridTemplateColumns`/
          `gridTemplateRows` из `base.root.props`, сделать их частью КАЖДОГО варианта (включая три
          существующих — они этот шаг не меняют по факту, просто явно несут свои колонки/строки
          вместо наследования из `base`) — и добавить новый вариант `stacked`
          (`gridTemplateAreas: '"header" "main"'`, `gridTemplateColumns: "1fr"`,
          `gridTemplateRows: "auto 1fr"`, 2 строки — footer не нужен), зеркалящий уже существующую
          сборку `stacked` по имени и по составу.

          Известный потребитель вне этой зоны, который заберёт готовый вариант следующим заходом (не
          здесь, architect+user договорились чинить отдельно): `apps/skin/src/pages/index.tsx` —
          снять инлайн-`style`-оверрайд, перейти на `<Workspace variant="stacked" ...>`, убрать
          рендер уже не нужных `WorkspaceSidebar`/`WorkspaceRightbar`/`WorkspaceFooter` (сегодня их
          и так нет — но сама раскладка апп сейчас держится на оверрайде, не на компоненте).

  - category: Валидация
    items:
      - id: kit-life-validation-fold-in
        type: feature
        status: Done
        priority: High
        name: "useKitLife возвращает акцессор валидации — третье, что он делает, одним вызовом"
        description: |
          ТЗ от architect (2026-09-13), по итогам ADR `@web-core/form` (`packages/form/ROADMAP.yaml`,
          категория «Роль и архитектура» — Done, механика реализована и прошла ревью, 11/11
          тестов). Пакет `@web-core/form` не рендерит, не владеет состоянием формы — производит
          `путь → issues` (валидность, из io-схемы сборки) и `nodeId → {hidden, disabled}`
          (производное UI-состояние, JsonLogic-правило из `node.meta.rule`). Задача этой зоны —
          подключить готовую механику к киту, тем же приёмом, каким уже подключён скин.

          Тот же файл, третий вызов — `useKitLife` (`packages/ui/src/shared/utils/skin-life.ts`,
          сегодня `traceLife`+`useComponentSkin`, `void`, `component-skin-wiring` выше в этом же
          роадмапе) добавляет `useComponentValidation(passport, props)` из `@web-core/form/solid`
          и ВОЗВРАЩАЕТ её результат — `Accessor<ComponentValidation | undefined>`
          (`{invalid?, errorText?, hidden?, disabled?}`). НЕ второй хук рядом (архитектурное
          решение зафиксировано в `@web-core/form/ROADMAP.yaml`'s `kit-life-validation-fold-in`
          дословно от user: «useValidation должен быть внутри useKitLife»).

          Блаcт-радиус, сверено `grep -rl "useKitLife(" packages/ui/src` (35 файлов): смена
          сигнатуры с `void` на возврат — АДДИТИВНА для 34 из 35. Они зовут `useKitLife(passport,
          props);` выражением-стейтментом, TS не требует использовать возврат — ни один из них не
          трогается этим пунктом. Реально читает результат только `Field`
          (`field-invalid-errortext-wiring` ниже) в рамках ЭТОГО захода; остальные компоненты с
          объявленным `invalid`-состоянием (`Select`/`Checkbox`/`RadioGroup` — сверить по `states`
          паспортов) — отдельным пунктом ПОСЛЕ того, как проводка на `Field` обкатана живьём, не
          вместе с ним (объём одного захода не растягиваем на весь кит сразу).

          Новая реальная зависимость — `@web-core/form` в `dependencies` `package.json` этого
          пакета. ПРОВЕРЕНО ЭМПИРИЧЕСКИ architect'ом ДО передачи этого ТЗ (не на словах): временно
          заведена `"@web-core/form": "workspace:*"`, прогнан `pnpm exec nx graph` (без предупреждения
          о цикле, в отличие от прецедента `assembly⇄skin`, `packages/assembly/ROADMAP.yaml`'s
          `verified-real-cycle-with-skin`) и `pnpm --filter @web-core/ui... build` — прошёл
          целиком, `packages/ui build: Done`. Правка отменена сразу после теста (`git status` —
          пусто). `@web-core/form` зависит от `@web-core/assembly`+`@web-core/io`, ни один из них
          не зависит от `@web-core/ui`/`@web-core/form` — цикл структурно невозможен, и это же
          подтверждено прогоном, не только по графу на бумаге.

          `passport-validation-field-open-question` (`@web-core/form/ROADMAP.yaml`) закрыт БЕЗ
          правки паспорта (`packages/skin/ROADMAP.yaml`'s `no-validation-axis-on-passport`) —
          `useComponentValidation` не читает `ComponentPassport`, первый параметр `useKitLife`
          прокидывается в неё чисто по совместимости сигнатуры, не по необходимости.

          Сделано (2026-09-13): `@web-core/form` добавлен в `dependencies` `package.json` насовсем
          (не откачен, в отличие от пробного захода architect'а). `shared/utils/skin-life.ts` —
          `useKitLife` третьим вызовом зовёт `useComponentValidation(passport, props)` и возвращает
          её результат вместо `void`; сигнатура `Accessor<ComponentValidation | undefined>`.
          `generate && typecheck && lint && build && test` — все зелёные, 283/283 тестов кита (было
          281, +2 новых в `test/skin-life.test.tsx`: без `<ValidationProvider>` акцессор отдаёт
          `undefined` тем же no-op'ом, что и скин; с провайдером и реально невалидными данными
          акцессор реально отражает `invalid` для узла по `data-node`). Блaст-радиус подтверждён на
          деле, не только по графу — typecheck прошёл на всех 35 файлах, зовущих `useKitLife`, без
          единой правки вызывающей стороны.

      - id: field-invalid-errortext-wiring
        type: feature
        status: Done
        priority: High
        name: "Первая нагрузка оси — Field реально показывает invalid/errorText"
        description: |
          Заблокировано `kit-life-validation-fold-in` (делается тем же заходом, не отдельно —
          `useKitLife` без содержимого нечего читать). Крючок уже стоит пустой:
          `packages/ui/src/field/entity/passport.ts` объявляет состояния `invalid`/`required`/
          `errorText`/`requiredIndicator` с CSS-метками (`data-invalid` и т.п.) — скин уже умеет
          красить невалидное поле, не хватает только того, кто выставит эти пропы по правде.

          Правка `packages/ui/src/field/components/root.tsx`:
          ```tsx
          export function Field(props: FieldProps) {
            const validation = useKitLife(passport, props); // теперь не void — акцессор
            return <ArkRoot {...dropAddress(props)} invalid={validation()?.invalid} errorText={validation()?.errorText} />;
          }
          ```
          `invalid`/`errorText` — родные пропы `FieldRootProps` (Ark), передаются как есть, без
          новой CSS-механики. Живой прогон — обязателен (не только `recipe.test.tsx` на бумаге,
          тот же урок, что `toast-part-attrs-missing` выше в этом файле): реальный рендер `<Field>`
          внутри `<ValidationProvider>` с заведомо невалидными данными, проверка, что
          `[data-invalid]`/текст ошибки реально появляются в DOM, не только что функция вызвана.

          Найдено при реализации: посылка ТЗ была неполной — `errorText` НЕ родной проп
          `FieldRootProps`. Сверено по d.ts `@ark-ui/solid/field`: `UseFieldProps` несёт
          `invalid`/`required`/`disabled`/`readOnly`/`id`/`ids`/`target`, `errorText`-сообщения
          там нет вовсе; `tsc` валит сборку на месте. `FieldErrorText` — самостоятельная часть,
          рендерящая ровно то, что ей передали детьми (`{...dropAddress(props)}`, без своего
          текста) — сегодня содержимое ошибки задаёт только сам потребитель руками. `invalid` —
          настоящий проп, довёл до DOM без проблем.

          User (2026-09-13): тестировать сейчас нужно именно ось форм — что компонент реально
          валидируется через `ValidationProvider`, а не визуальную часть. Стилизация невалидного
          состояния (`errorText` и подобное, чего АРК не даёт) — отдельный контракт со скином
          (визуал не на Ark, на нашем скине), решается отдельно с architect. `errorText` в эту
          заявку сознательно не входит — не мой сейчас выбор архитектуры, не хакал обход.

          Сделано (2026-09-13): `Field` (`components/root.tsx`) забирает акцессор из `useKitLife`,
          прокидывает `invalid={validation()?.invalid}` в `ArkRoot`. Новый
          `src/field/test/field-validation.test.tsx` — реальный рендер `<Field data-node="email">`
          внутри `<ValidationProvider>`: невалидные данные реально ставят `data-invalid` на
          `[data-scope="field"][data-part="root"]`, валидные — реально снимают (сигнал
          пересчитывается реактивно); без `<ValidationProvider>` — no-op, `data-invalid` не
          появляется сам по себе. `generate && typecheck && lint && build && test` — зелёные,
          285/285 тестов кита (было 283, +2 новых).

      - id: error-text-fold-in
        type: feature
        status: Done
        priority: High
        name: "FieldErrorText сам зовёт useKitLife — юзеру не нужно вручную прокидывать errorText"
        description: |
          Разобрано с user (2026-09-13) по шагам, отдельно от предыдущего пункта не потому что
          другая механика, а потому что первый заход (`field-invalid-errortext-wiring`) сознательно
          не входил в него — «тестировать сейчас нужно именно ось форм, не визуальную часть»
          (see log там же).

          `packages/ui/src/field/components/error-text.tsx` сегодня — только `traceLife` +
          `dropAddress`, `errorText` содержимое рисует не сам, ждёт детей от потребителя. Правка —
          тот же приём, что уже в `Field`:
          ```tsx
          export function FieldErrorText(props: FieldErrorTextProps) {
            const validation = useKitLife(passport, props); // тот же passport, что у Field
            return <ArkErrorText {...dropAddress(props)}>{validation()?.errorText}</ArkErrorText>;
          }
          ```
          Условие для юзера — то же, что уже требует `invalid` у `Field`: `FieldErrorText` в
          составе модуля обязан получить СВОЙ `data-node` (тот же узел дерева, что валидирует
          нужный путь — обычно тот же `bind`, что у соответствующего `Field`, если оба заведены
          отдельными узлами с одним и тем же путём; если `FieldErrorText` не адресован отдельным
          узлом — акцессор просто `undefined`, `errorText` пуст, ничего не падает).

          НЕ трогает self-assembly-выращенные части (`field/playground/assemblies/basic.ts`) — там
          `errorText` получает текст старым способом (`{genus:"text", value:{path}}`, литеральная
          привязка к данным демо-витрины, никак не связана с `growValidatorLayer`); это отдельный,
          более ранний механизм, менять его не нужно и не входит сюда.

          Сделано (2026-09-13): `error-text.tsx` — `useKitLife(passport, props)` (тот же passport,
          что у `Field`) вместо голого `traceLife`, `<ArkErrorText>{validation()?.errorText}</...>`.
          `mergeProps` (`@zag-js/solid`, реактивный геттер) сохраняет консьюмерские `children`, если
          `validation()?.errorText` — `undefined` (без `<ValidationProvider>` или без своего
          `data-node` у самого `FieldErrorText`) — тот же приём, что уже вынес `invalid` в `Field`.

          Живьём найдено при тесте: `@ark-ui/solid`'s `FieldErrorText` САМ оборачивает себя в
          `<Show when={field().invalid}>` (`field-error-text.tsx` в дисте Ark) — читает `invalid`
          из СВОЕГО контекста `Field`, который уже реактивно ставит `field-invalid-errortext-wiring`
          (`invalid={validation()?.invalid}` на `Field`-корне). Значит узел `error-text` не просто
          красится, а физически появляется/пропадает из DOM САМ, без единой строчки от этой заявки —
          `errorText` внутри него был последним недостающим кусочком, не первым.

          `src/field/test/field-validation.test.tsx` — 2 новых сценария (было 2, стало 4): реальный
          рендер `<Field data-node="email"><FieldErrorText data-node="email"/></Field>` внутри
          `<ValidationProvider>` — невалидные данные показывают сообщение issue в DOM, валидные
          убирают УЗЕЛ ЦЕЛИКОМ (не просто текст — это Ark's `<Show>`, не наша механика);
          `FieldErrorText` без своего `data-node` — акцессор `undefined`, консьюмерский текст
          (`children`) остаётся как есть. `generate && typecheck && lint && build && test` —
          зелёные, 287/287 тестов кита (было 285, +2 новых).

      - id: invalid-state-rollout-remaining-components
        type: feature
        status: Backlog
        priority: Medium
        name: "invalid из useKitLife — ещё 8 компонентов кита с объявленным состоянием invalid"
        description: |
          Тот же однострочный приём, что уже в `Field` (`validation()?.invalid` → `invalid`-проп
          собственного `ArkRoot`), распространяется на остальные компоненты, у которых `invalid`
          уже объявлен в паспорте (`grep -rl "invalid" packages/ui/src/*/entity/passport.ts` —
          полный список, не «и другие»): `checkbox`, `date-picker`, `file-upload`, `select`,
          `slider`, `segment-group`, `radio-group`, `switch`. Все восемь уже зовут `useKitLife(
          passport, props)` bare statement'ом (сверено чтением каждого `root.tsx`) — правка КАЖДОГО
          файла: забрать акцессор в переменную вместо bare-вызова, прокинуть `invalid` в
          собственный корневой Ark-компонент. Не требует знания, под каким ключом лежит `bind`
          (`value`/`checked`/т.п.) — `ownValuePathOf` (`@web-core/form/solid`) уже общий по любому
          единственному ключу, спец-случаев на компонент нет.

          Один компонент — один тест по образцу `field-validation.test.tsx` (реальный рендер внутри
          `<ValidationProvider>`, проверка `data-invalid` на реальном DOM-узле, не только что
          функция вызвана — тот же урок, что `toast-part-attrs-missing`). Восемь файлов, восемь
          тестов — делать по одному, не одним махом без проверки каждого (тот же компонент может
          использовать `invalid` иначе — сверить точку, прежде чем чинить, не копипастом вслепую).

  - category: Информация о компоненте
    items:
      - id: component-info-sync-descriptor
        type: feature
        status: Done
        priority: Medium
        name: Синхронный срез компонента (componentDescriptorOf/listComponents) — без службы раздачи
        description: |
          Найдено user при разборе `apps/skin` (2026-09-12): "неудобно, приходится дублировать и
          собирать" про рутовые хелперы кита — конкретно двумя фактами.

          1. `apps/skin/src/entities/component/model/list.ts` и
             `apps/skin/src/entities/component/ui/catalog/tree/adapter.ts` оба писали
             `Object.keys(KIT).sort()` ради одного и того же перечня имён компонентов — и оба ради
             этого тащили весь Solid-кит (39 настоящих компонентов всех частей), хотя нужны были
             только ключи, которые давно лежат в данных (`PASSPORTS`, без единой строчки Solid).
          2. `apps/skin/.mcp/src/engine/kit.ts` (MCP-инструменты, синхронный процесс, без
             `presets`) вручную стыковал `passportOf`/`editorInfoOf`/`IO.get` по каждому
             компоненту — ровно ту же склейку, что уже делает `createComponentInfo`, только без
             async и без службы раздачи, которой MCP не имеет и не просит.

          Решение: в `component-info.ts` — `ComponentDescriptor` (паспорт + срез редактора + io,
          без skin) и `componentDescriptorOf(component, provider?)` поверх уже существующего
          `kitComponentProvider()`; `listComponents(provider?)` — отсортированные имена из
          `provider.components`. Оба принимают поставщика вторым (необязательным) параметром — та
          же DI-форма, что у `createComponentInfo`, второй поставщик кита — тем же
          `mergeComponentProviders`. `createComponentInfo` переписан поверх `componentDescriptorOf`
          вместо своей копии той же склейки — одна реализация на двоих, не две синхронизируемые
          вручную.

          Новый подпуть НЕ заведён: обе функции живут в уже опубликованном `./component-info`,
          сборка (`vite.config.ts`/`package.json` exports) не тронута.

          Проверено: тесты (`test/component-info.test.ts`, 5/5 — два новых сценария на
          `componentDescriptorOf` включая неизвестный компонент, один на `listComponents`),
          `tsc --noEmit`, `eslint`, `vite build` — весь пакет: 279/279 тестов зелёные, сборка без
          ошибок, `dist/component-info.js` обновлён.

          НЕ сделано здесь (зона `apps/skin`, не `packages/ui` — user переносит сам): переключение
          `list.ts`/`catalog/tree/adapter.ts` на `listComponents()` и `apps/skin/.mcp/.../kit.ts` на
          `componentDescriptorOf()` вместо ручной стыковки.

      - id: component-info-derived-group
        type: feature
        status: Done
        priority: Medium
        name: groupOf(component)/GROUPS в component-info.ts — производный факт готовым, не сырой editorInfo
        description: |
          Продолжение `component-info-sync-descriptor`. User перевёл
          `apps/skin/.../catalog/tree/adapter.ts` на `listComponents()`, но заметил живьём: файл
          всё ещё импортировал `GROUPS`/`editorInfoOf`/`groupOf` из `@web-core/ui/passport`
          напрямую и сам считал `groupOf(editorInfo)` — та же болезнь, что чинил
          `component-info-sync-descriptor`, просто на один шаг глубже. Дословно: "я не хочу чтобы
          потребители лазили в паспорта или в ио или подобные данные напрямую — я хочу чтобы это
          было через отдельный хелпер... если потребителю нужно работать не просто с компонентами,
          а с их внутренностями, чтобы он это делал через одну точку, а не ковырялся напрямую".

          Решение: `component-info.ts` — `groupOf(component, provider?)` (группа компонента,
          `undefined` — компонента/среза редактора нет) поверх `provider.editorInfoOf` +
          `@web-core/skin/editor`'s `groupOf(editorInfo)` (тот же приём, что `componentDescriptorOf`
          поверх `passportOf`/`editorInfoOf`/`io.get`); `GROUPS` — реэкспорт каталога групп оттуда
          же, не второй перечень рядом. Потребителю каталога компонентов (дерево показа, список)
          теперь достаточно `@web-core/ui/component-info` целиком — `@web-core/ui/passport` не
          нужен вовсе.

          Прямые импорты `@web-core/ui/passport`/`@web-core/ui/io` НЕ запрещены как таковые —
          подпути остаются для инфраструктурной проводки, которой нужна именно сырая функция
          (`SkinProvider`, `apps/skin/src/app/providers/skin.tsx`, зовёт `passportOf` как
          `lookup` движка скина — не "внутренности компонента для показа", а контракт конкретного
          API движка). Правило — про потребителя, который хочет ФАКТ о компоненте для витрины/
          каталога/показа: тот идёт через `component-info.ts`, не собирает факт сам из сырых
          паспорта/среза редактора/io.

          Проверено: `test/component-info.test.ts` — два новых сценария (`groupOf` известного
          компонента входит в `GROUPS`, `groupOf` неизвестного — `undefined`, не подставляет
          дефолтную группу), `tsc --noEmit`, `eslint`, `vite build` — весь пакет: 281/281 тестов
          зелёные.

          НЕ сделано здесь (зона `apps/skin`): переключение `adapter.ts` на `groupOf`/`GROUPS` из
          `@web-core/ui/component-info` — user переносит сам.

      - id: component-info-multiple-forms-per-component
        type: bug
        status: Done
        priority: High
        name: "componentInfo() берёт ПЕРВУЮ форму компонента и молча теряет остальные"
        description: |
          Найдено user живьём (2026-09-10) на реальных данных, не выдумано: у `date-picker` на
          проде ДВЕ сохранённые формы — `omnifield-date-picker` (без вариантов/тегов) и
          `omnifield-date-picker-outline` (`recipe.variants.outline`, `variantTags:
          {"outline":["default"]}`). Запрос "что известно про date-picker" отдавал пустые
          `variants`/`tags` — вторая форма с реальными данными терялась незаметно для того, кто
          спрашивал.

          Причина — `component-info.ts:200`: `const form = forms.find((record) =>
          record.state.component === component)`. `.find()` берёт первое совпадение. Это НЕ баг
          "два — это много, один — правильно": у `Form` есть `name`, `Outfit` выбирает формы ПО
          ИМЕНИ (`forms: string[]`) — несколько именованных форм на один компонент такая же
          законная часть модели, как несколько нарядов. Реальная причина: `componentInfo(component)`
          зовётся ТОЛЬКО именем компонента (сверено — `entities/component/model/store.ts` в
          apps/skin, единственный вызывающий), без наряда/имени формы. "Какая форма относится к
          компоненту" осмысленно только В КОНТЕКСТЕ конкретного наряда, а наряда функция не
          получает — и приложение сегодня вообще не хранит понятие "текущий наряд" (проверено
          grep'ом по apps/skin — такого сигнала нет), выбрать "правильную" форму сейчас НЕЧЕМ.

          Решение (user, 2026-09-10): раз выбрать нечем — не выбирать. `componentInfo` отдаёт ВСЕ
          формы компонента, не одну — молчаливая потеря данных прекращается, решение "какую
          показать" уходит к вызывающему, у которого хотя бы есть шанс это решить осмысленно (или
          показать все сразу). Конкретно: `ComponentSkinInfo.form` (одна запись) →
          `ComponentSkinInfo.forms` (список) — `variants`/`outfits`/`tags` уже считаются НА ОДНУ
          форму (`outfits.filter(record => record.state.forms.includes(form.name))` — по имени
          конкретной формы), значит тот же расчёт просто переезжает внутрь `.map()` по всем
          найденным формам, а не по одной.

          Известный потребитель ВНЕ этой зоны, который сломается молча, если его не поправить
          следом: `apps/skin/src/pages/showcase/index.tsx:29` —
          `component.info()?.skin?.tags ?? []` — строит группы вкладок карусели показа. С новой
          формой (`skin.forms[]`, у каждой свои `tags`) это единственное место, которое реально
          читает старую форму `ComponentSkinInfo` во всём apps/skin (проверено grep'ом — других
          нет). Не чинить здесь (другая зона), но назвать явно, не оставлять сюрпризом.

          Сделано (2026-09-10): `component-info.ts` — `ComponentSkinFormInfo` (новый тип, одна
          форма: `form`/`variants`/`outfits`/`tags`, тот же состав, что раньше был на
          `ComponentSkinInfo`), `ComponentSkinInfo.forms: readonly ComponentSkinFormInfo[]`
          вместо `.form`; `forms.find()` → `forms.filter()`, `variants`/`outfits`/`tags` считаются
          внутри `.map()` по каждой найденной форме. `skin` остаётся `undefined`, когда для
          компонента не сохранено ни одной формы (семантика не менялась, менялось только "одна vs
          несколько найдено"). Тест `test/component-info.test.ts` — два новых сценария: несколько
          форм на одном компоненте (date-picker, как в живом случае user) отдаются обе, со своими
          независимо посчитанными variants/outfits/tags; ни одной формы — `skin` всё ещё
          `undefined`. `apps/skin/src/pages/showcase/index.tsx:29` — известный слом вне зоны, не
          трогал, эскалация архитектору остаётся в силе. 275/275 тестов кита зелёные.
